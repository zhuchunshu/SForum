version: v2
clean: true

plugins:
  - local:
      - ../../tools/proto/.bin/protoc-gen-go
    out: ../../apps/api/sdk/plugin/v2/gen
    opt:
      - paths=source_relative
  - local:
      - ../../tools/proto/.bin/protoc-gen-go-grpc
    out: ../../apps/api/sdk/plugin/v2/gen
    opt:
      - paths=source_relative
