version: v2

modules:
  - path: .

lint:
  use:
    - STANDARD
  # Streams and common progress/query envelopes intentionally share message
  # types across methods; wire identity is more useful than method-name wrappers.
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME

breaking:
  use:
    - FILE
