        type: string
      description: Non-secret setting key/value map (defaults applied when unset).
ApiResponsePublicActiveThemeSettings:
  type: object
  required:
  - data
  properties:
    data:
      "$ref": "#/PublicActiveThemeSettings"
ExtensionSettings:
  type: object
  required:
  - extensionId
  - extensionType
  - extensionVersion
  - extensionStatus
  - renderer
  - items
  properties:
    extensionId:
      type: string
    extensionType:
      "$ref": "#/ExtensionType"
    extensionVersion:
      type: string
