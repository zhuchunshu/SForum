  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/Extension"
ApiResponseExtensionList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: array
      items:
        "$ref": "#/Extension"
ApiResponseExtensionEventList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: array
      items:
        "$ref": "#/ExtensionEvent"
ApiResponseExtensionEventDefinitionList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: array
      items:
        "$ref": "#/ExtensionEventDefinition"
ApiResponseExtensionEventDeliveryList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: array
      items:
        "$ref": "#/ExtensionEventDelivery"
ApiResponseExtensionNavigationList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: array
      items:
        "$ref": "#/ExtensionAdminNavigationItem"
ApiResponseExtensionSettings:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/ExtensionSettings"
ExtensionType:
  type: string
  enum:
  - plugin
  - theme
ExtensionStatus:
  type: string
  enum:
  - installed
  - enabled
  - disabled
ExtensionSource:
  type: string
  enum:
  - builtin
  - uploaded
ExtensionManifest:
  type: object
  description: SForum extension manifest. Plugins may declare runtime, route, provider, settings, event, and admin capabilities. Themes are Nuxt Layer packages; in v1 they must declare a non-empty frontend.layer, may declare settings and admin or legacy adminPages, and must not declare backend, routes, hooks, events, jobs, providers, migrations, or permissions.
  required:
  - id
  - name
  - description
  - url
  - author
  - version
  - type
  - sforumVersion
  properties:
    id:
      type: string
    name:
      type: string
    description:
      type: string
    url:
      type: string
      format: uri
    author:
      "$ref": "#/ExtensionManifestAuthor"
    version:
      type: string
    type:
      "$ref": "#/ExtensionType"
    sforumVersion:
      type: string
    permissions:
      type: array
      description: Plugin-only permission keys. Theme manifests must omit permissions in v1.
      items:
        type: string
    settings:
      type: array
      description: Settings declarations for plugin or theme core container pages.
      items:
        "$ref": "#/ExtensionManifestSetting"
    migrations:
      type: array
      description: Plugin-only SQL migration declarations. Theme manifests must omit migrations in v1.
      items:
        type: object
    backend:
      type: object
      description: Plugin-only backend runtime declaration. Theme manifests must omit backend runtime fields in v1.
      properties:
        entry:
          type: string
        rpc:
          type: string
        protocolVersion:
          type: integer
    frontend:
      type: object
      description: Frontend package declaration. For type theme, layer is required and points to the Nuxt Layer root inside the ZIP package.
      properties:
        layer:
          type: string
          minLength: 1
          description: Safe relative path to a Nuxt Layer directory, such as frontend/layer. Required for type theme.
    admin:
      "$ref": "#/ExtensionManifestAdmin"
    adminPages:
      type: array
      description: Legacy core-container admin page declarations. Prefer admin.pages for new manifests; legacy pages remain compatibility-mapped.
      items:
        "$ref": "#/ExtensionManifestAdminPage"
    routes:
      type: array
      description: Plugin-only proxied route declarations. Theme manifests must omit routes in v1.
      items:
        "$ref": "#/ExtensionManifestRoute"
    hooks:
      type: array
      description: Plugin-only lifecycle or domain hook declarations. Theme manifests must omit hooks in v1.
      items:
        "$ref": "#/ExtensionManifestHook"
    events:
      type: array
      description: Plugin-only event listener declarations. Theme manifests must omit events in v1. Legacy hooks are treated as observe/filter listeners according to the host event catalog.
      items:
        "$ref": "#/ExtensionManifestEvent"
    jobs:
      type: array
      description: Plugin-only background job declarations. Theme manifests must omit jobs in v1.
      items:
        type: object
    providers:
      type: array
      description: Plugin-only provider slot declarations. Theme manifests must omit providers in v1.
      items:
        "$ref": "#/ExtensionManifestProvider"
ExtensionManifestAuthor:
  type: object
  required:
  - name
  properties:
    name:
      type: string
    url:
      type: string
      format: uri
    email:
      type: string
      format: email
ExtensionManifestSetting:
  type: object
  required:
  - key
  - label
  - type
  properties:
    key:
      type: string
    label:
      type: string
    description:
      type: string
    type:
      type: string
    default:
      type: string
ExtensionManifestAdmin:
  type: object
  description: Extension admin entry and page declarations. Manage resolves to entry, then settings, then first declared page, then the generated about page.
  properties:
    entry:
      type: string
      description: In-admin extension page path such as /settings. Must point to /about or a declared page.
    pages:
      type: array
      items:
        "$ref": "#/ExtensionManifestAdminPage"
ExtensionManifestAdminPage:
  type: object
  required:
  - path
  - label
  properties:
    path:
      type: string
    label:
      type: string
    description:
      type: string
    icon:
      type: string
    view:
      type: string
      enum:
      - about
      - settings
    menu:
      type: boolean
      default: false
      description: Whether this page appears in admin sidebar navigation. Defaults to false.
    order:
      type: integer
      minimum: 0
    permission:
      type: string
ExtensionManifestRoute:
  type: object
  required:
  - path
  - methods
  properties:
    path:
      type: string
    methods:
      type: array
      items:
        type: string
        enum:
        - GET
        - HEAD
        - OPTIONS
        - POST
        - PUT
        - PATCH
        - DELETE
    access:
      type: string
      enum:
      - public
      - login
      - permission
    permission:
      type: string
    timeoutMs:
      type: integer
      minimum: 0
ExtensionManifestHook:
  type: object
  required:
  - name
  properties:
    name:
      type: string
ExtensionManifestEvent:
  type: object
  required:
  - name
  properties:
    name:
      type: string
    kind:
      type: string
      enum:
      - observe
      - validate
      - filter
    timeoutMs:
      type: integer
      minimum: 0
ExtensionManifestProvider:
  type: object
  required:
  - slot
  - label
  properties:
    slot:
      type: string
    label:
      type: string
    timeoutMs:
      type: integer
      minimum: 0
ExtensionRuntimeStatus:
  type: object
  required:
  - state
  - routeCount
  - hookCount
  - eventCount
  - providerCount
  properties:
    state:
      type: string
      enum:
      - stopped
      - starting
      - running
      - failed
    lastError:
      type: string
    startedAt:
      type: string
      format: date-time
    routeCount:
      type: integer
    hookCount:
      type: integer
    eventCount:
      type: integer
    providerCount:
      type: integer
Extension:
  type: object
  required:
  - id
  - name
  - version
  - type
  - status
  - source
  - isSystem
  - isDeletable
  - manifest
  - packagePath
  - installedAt
  - updatedAt
  properties:
    id:
      type: string
    name:
      type: string
    version:
      type: string
    type:
      "$ref": "#/ExtensionType"
    status:
      "$ref": "#/ExtensionStatus"
    source:
      "$ref": "#/ExtensionSource"
    isSystem:
      type: boolean
    isDeletable:
      type: boolean
    manifest:
      "$ref": "#/ExtensionManifest"
    runtime:
      "$ref": "#/ExtensionRuntimeStatus"
    packagePath:
      type: string
      description: Server-local package path, visible only to extension managers.
    installedAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
ExtensionAdminNavigationItem:
  type: object
  required:
  - extensionId
  - extensionName
  - extensionType
  - extensionStatus
  - path
  - label
  - description
  - icon
  - view
  - order
  properties:
    extensionId:
      type: string
    extensionName:
      type: string
    extensionType:
      "$ref": "#/ExtensionType"
    extensionStatus:
      "$ref": "#/ExtensionStatus"
    path:
      type: string
    label:
      type: string
    description:
      type: string
    icon:
      type: string
    view:
      type: string
      enum:
      - about
      - settings
    order:
      type: integer
ExtensionSettings:
  type: object
  required:
  - extensionId
  - items
  properties:
    extensionId:
      type: string
    items:
      type: array
      items:
        "$ref": "#/ExtensionSettingValue"
ExtensionSettingValue:
  type: object
  required:
  - key
  - label
  - description
  - type
  - default
  - value
  properties:
    key:
      type: string
    label:
      type: string
    description:
      type: string
    type:
      type: string
    default:
      type: string
    value:
      type: string
ExtensionSettingsInput:
  type: object
  required:
  - values
  properties:
    values:
      type: object
      additionalProperties:
        type: string
ExtensionEvent:
  type: object
  required:
  - id
  - extensionId
  - actorUserId
  - action
  - message
  - createdAt
  properties:
    id:
      type: integer
      format: int64
    extensionId:
      type: string
    actorUserId:
      type: integer
      format: int64
    action:
      type: string
      enum:
      - installed
      - builtin_synced
      - verified
      - enabled
      - enable_failed
      - disabled
      - theme_activated
    message:
      type: string
    createdAt:
      type: string
      format: date-time
ExtensionEventDefinition:
  type: object
  required:
  - name
  - kind
  - description
  - timeoutMs
  properties:
    name:
      type: string
    kind:
      type: string
      enum:
      - observe
      - validate
      - filter
    description:
      type: string
    payloadFields:
      type: array
      items:
        type: string
    patchFields:
      type: array
      items:
        type: string
    timeoutMs:
      type: integer
ExtensionEventDelivery:
  type: object
  required:
  - id
  - extensionId
  - eventName
  - eventKind
  - status
  - reason
  - message
  - correlationId
  - attemptCount
  - createdAt
  - updatedAt
  properties:
    id:
      type: integer
      format: int64
    extensionId:
      type: string
    eventName:
      type: string
    eventKind:
      type: string
      enum:
      - observe
      - validate
      - filter
    status:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - skipped
    reason:
      type: string
    message:
      type: string
    correlationId:
      type: string
    attemptCount:
      type: integer
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    completedAt:
      type: string
      format: date-time
