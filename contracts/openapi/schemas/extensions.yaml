      items: { type: string }
ExtensionSettingsGroup:
  type: object
  required: [id, label]
  properties:
    id: { type: string }
    label: { type: string }
    description: { type: string }
    columns: { type: integer, minimum: 1, maximum: 2 }
ExtensionSettingsCallout:
  type: object
  required: [id, tone, title]
  properties:
    id: { type: string }
    tone: { type: string }
    title: { type: string }
    body: { type: string }
    tab: { type: string }
    group: { type: string }
ExtensionSettingsAction:
  type: object
  required: [id, kind, label, placement, useDraftValues, available]
  properties:
    id: { type: string }
    kind:
      type: string
