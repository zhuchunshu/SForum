ExtensionManifestAdmin:
  type: object
  description: Extension admin entry and page declarations. Manage resolves to entry, then settings, then first declared page, then the generated about page.
  properties:
    entry:
      type: string
      description: In-admin extension page path such as /settings. Must point to /about or a declared page.
    pages:
      type: array
      items:
        "$ref": "#/ExtensionManifestAdminPage"
ExtensionManifestAdminFrontend:
  type: object
  description: Plugin-only trusted admin component package. The host validates all paths and locked dependencies without executing plugin code.
  required:
  - root
  - apiVersion
  - components
  - locales
  properties:
    root:
      type: string
    apiVersion:
      type: integer
      minimum: 1
    components:
      type: object
      minProperties: 1
      additionalProperties:
        type: string
    locales:
      type: object
      required:
      - zh-CN
      - en-US
      additionalProperties:
        type: string
ExtensionManifestAdminPage:
  type: object
  required:
  - path
  - label
  properties:
    path:
      type: string
    label:
      type: string
    description:
      type: string
    icon:
      type: string
    view:
      type: string
      enum:
      - about
      - settings
    menu:
      type: boolean
      default: false
      description: Whether this page appears in admin sidebar navigation. Defaults to false.
    order:
      type: integer
      minimum: 0
    permission:
      type: string
ExtensionManifestRoute:
