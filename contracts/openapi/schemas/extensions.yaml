ApiResponseExtension:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/Extension"
ApiResponseExtensionList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: array
      items:
        "$ref": "#/Extension"
ApiResponseExtensionEventList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: array
      items:
        "$ref": "#/ExtensionEvent"
ApiResponseExtensionEventDefinitionList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: array
      items:
        "$ref": "#/ExtensionEventDefinition"
ApiResponseExtensionEventDeliveryList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: array
      items:
        "$ref": "#/ExtensionEventDelivery"
ExtensionType:
  type: string
  enum:
  - plugin
  - theme
ExtensionStatus:
  type: string
  enum:
  - installed
  - enabled
  - disabled
ExtensionSource:
  type: string
  enum:
  - builtin
  - uploaded
ExtensionManifest:
  type: object
  description: SForum extension manifest. Plugin manifests may declare runtime, route, provider, settings, event, and admin capabilities. Theme manifests are Nuxt Layer packages; in v1 they must declare a non-empty frontend.layer and must not declare backend, routes, hooks, events, jobs, providers, migrations, adminPages, settings, or permissions.
  required:
  - id
  - name
  - version
  - type
  - sforumVersion
  properties:
    id:
      type: string
    name:
      type: string
    version:
      type: string
    type:
      "$ref": "#/ExtensionType"
    sforumVersion:
      type: string
    permissions:
      type: array
      description: Plugin-only permission keys. Theme manifests must omit permissions in v1.
      items:
        type: string
    settings:
      type: array
      description: Plugin-only settings declarations. Theme manifests must omit settings in v1.
      items:
        type: object
    migrations:
      type: array
      description: Plugin-only SQL migration declarations. Theme manifests must omit migrations in v1.
      items:
        type: object
    backend:
      type: object
      description: Plugin-only backend runtime declaration. Theme manifests must omit backend runtime fields in v1.
      properties:
        entry:
          type: string
        rpc:
          type: string
        protocolVersion:
          type: integer
    frontend:
      type: object
      description: Frontend package declaration. For type theme, layer is required and points to the Nuxt Layer root inside the ZIP package.
      properties:
        layer:
          type: string
          minLength: 1
          description: Safe relative path to a Nuxt Layer directory, such as frontend/layer. Required for type theme.
    adminPages:
      type: array
      description: Plugin-only admin page declarations. Theme manifests must omit adminPages in v1.
      items:
        type: object
    routes:
      type: array
      description: Plugin-only proxied route declarations. Theme manifests must omit routes in v1.
      items:
        "$ref": "#/ExtensionManifestRoute"
    hooks:
      type: array
      description: Plugin-only lifecycle or domain hook declarations. Theme manifests must omit hooks in v1.
      items:
        "$ref": "#/ExtensionManifestHook"
    events:
      type: array
      description: Plugin-only event listener declarations. Theme manifests must omit events in v1. Legacy hooks are treated as observe/filter listeners according to the host event catalog.
      items:
        "$ref": "#/ExtensionManifestEvent"
    jobs:
      type: array
      description: Plugin-only background job declarations. Theme manifests must omit jobs in v1.
      items:
        type: object
    providers:
      type: array
      description: Plugin-only provider slot declarations. Theme manifests must omit providers in v1.
      items:
        "$ref": "#/ExtensionManifestProvider"
ExtensionManifestRoute:
  type: object
  required:
  - path
  - methods
  properties:
    path:
      type: string
    methods:
      type: array
      items:
        type: string
        enum:
        - GET
        - HEAD
        - OPTIONS
        - POST
        - PUT
        - PATCH
        - DELETE
    access:
      type: string
      enum:
      - public
      - login
      - permission
    permission:
      type: string
    timeoutMs:
      type: integer
      minimum: 0
ExtensionManifestHook:
  type: object
  required:
  - name
  properties:
    name:
      type: string
ExtensionManifestEvent:
  type: object
  required:
  - name
  properties:
    name:
      type: string
    kind:
      type: string
      enum:
      - observe
      - validate
      - filter
    timeoutMs:
      type: integer
      minimum: 0
ExtensionManifestProvider:
  type: object
  required:
  - slot
  - label
  properties:
    slot:
      type: string
    label:
      type: string
    timeoutMs:
      type: integer
      minimum: 0
ExtensionRuntimeStatus:
  type: object
  required:
  - state
  - routeCount
  - hookCount
  - eventCount
  - providerCount
  properties:
    state:
      type: string
      enum:
      - stopped
      - starting
      - running
      - failed
    lastError:
      type: string
    startedAt:
      type: string
      format: date-time
    routeCount:
      type: integer
    hookCount:
      type: integer
    eventCount:
      type: integer
    providerCount:
      type: integer
Extension:
  type: object
  required:
  - id
  - name
  - version
  - type
  - status
  - source
  - isSystem
  - isDeletable
  - manifest
  - packagePath
  - installedAt
  - updatedAt
  properties:
    id:
      type: string
    name:
      type: string
    version:
      type: string
    type:
      "$ref": "#/ExtensionType"
    status:
      "$ref": "#/ExtensionStatus"
    source:
      "$ref": "#/ExtensionSource"
    isSystem:
      type: boolean
    isDeletable:
      type: boolean
    manifest:
      "$ref": "#/ExtensionManifest"
    runtime:
      "$ref": "#/ExtensionRuntimeStatus"
    packagePath:
      type: string
      description: Server-local package path, visible only to extension managers.
    installedAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
ExtensionEvent:
  type: object
  required:
  - id
  - extensionId
  - actorUserId
  - action
  - message
  - createdAt
  properties:
    id:
      type: integer
      format: int64
    extensionId:
      type: string
    actorUserId:
      type: integer
      format: int64
    action:
      type: string
      enum:
      - installed
      - builtin_synced
      - verified
      - enabled
      - enable_failed
      - disabled
      - theme_activated
    message:
      type: string
    createdAt:
      type: string
      format: date-time
ExtensionEventDefinition:
  type: object
  required:
  - name
  - kind
  - description
  - timeoutMs
  properties:
    name:
      type: string
    kind:
      type: string
      enum:
      - observe
      - validate
      - filter
    description:
      type: string
    payloadFields:
      type: array
      items:
        type: string
    patchFields:
      type: array
      items:
        type: string
    timeoutMs:
      type: integer
ExtensionEventDelivery:
  type: object
  required:
  - id
  - extensionId
  - eventName
  - eventKind
  - status
  - reason
  - message
  - correlationId
  - attemptCount
  - createdAt
  - updatedAt
  properties:
    id:
      type: integer
      format: int64
    extensionId:
      type: string
    eventName:
      type: string
    eventKind:
      type: string
      enum:
      - observe
      - validate
      - filter
    status:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - skipped
    reason:
      type: string
    message:
      type: string
    correlationId:
      type: string
    attemptCount:
      type: integer
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    completedAt:
      type: string
      format: date-time
