ApiResponseHealth:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/Health"
Health:
  type: object
  required:
  - name
  - status
  - environment
  - locale
  - supportedLocales
  - time
  properties:
    name:
      type: string
    status:
      type: string
      enum:
      - ok
    environment:
      type: string
    locale:
      type: string
      examples:
      - zh-CN
    supportedLocales:
      type: array
      items:
        type: string
    time:
      type: string
      format: date-time
ApiResponseReady:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/Ready"
Ready:
  type: object
  required:
  - status
  - ready
  - checkedAt
  - components
  properties:
    status:
      type: string
      enum:
      - ready
      - degraded
      - not_ready
      description: Overall readiness label; degraded means optional deps failed.
    ready:
      type: boolean
      description: Whether the process should receive traffic.
    checkedAt:
      type: string
      format: date-time
    components:
      type: array
      items:
        "$ref": "#/ReadyComponent"
ReadyComponent:
  type: object
  required:
  - name
  - status
  - required
  properties:
    name:
      type: string
      examples:
      - postgres
      - redis
      - meilisearch
    status:
      type: string
      enum:
      - ok
      - degraded
      - error
      - skipped
    required:
      type: boolean
    error:
      type: string
    latency:
      type: string
      description: Human-readable check duration, e.g. 2ms.
ApiResponseAdminOverview:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/AdminOverview"
AdminOverview:
  type: object
  required:
  - generatedAt
  - windowDays
  - runtime
  - community
  - attachments
  - moderation
  - extensions
  - trends
  - topCategories
  - actions
  properties:
    generatedAt:
      type: string
      format: date-time
    windowDays:
      type: integer
      enum:
      - 7
    runtime:
      "$ref": "#/AdminOverviewRuntime"
    community:
      "$ref": "#/AdminOverviewCommunity"
    attachments:
      "$ref": "#/AdminOverviewAttachments"
    moderation:
      "$ref": "#/AdminOverviewModeration"
    extensions:
      "$ref": "#/AdminOverviewExtensions"
    trends:
      "$ref": "#/AdminOverviewTrends"
    topCategories:
      type: array
      items:
        "$ref": "#/AdminOverviewCategoryActivity"
    actions:
      type: array
      items:
        "$ref": "#/AdminOverviewAction"
    extensionWidgets:
      type: array
      description: Host-owned admin dashboard widgets from admin.dashboard.widgets (F4.3).
      items:
        "$ref": "#/AdminOverviewExtensionWidget"
AdminOverviewExtensionWidget:
  type: object
  required:
  - extensionId
  - id
  - order
  - route
  - severity
  properties:
    extensionId:
      type: string
    id:
      type: string
    order:
      type: integer
    label:
      type: object
      additionalProperties:
        type: string
    icon:
      type: string
    route:
      type: string
      description: Admin-shell relative route such as /jobs or /extensions/plugins.
    severity:
      type: string
      enum:
      - info
      - success
      - warning
      - danger
AdminOverviewRuntime:
  type: object
  required:
  - startedAt
  - uptimeSeconds
  - memoryBytes
  - heapAllocBytes
  - heapSysBytes
  - goroutineCount
  - gcCount
  - lastGcPauseNs
  - database
  properties:
    startedAt:
      type: string
      format: date-time
    uptimeSeconds:
      type: integer
      format: int64
    memoryBytes:
      type: integer
      format: int64
      minimum: 0
      description: Go runtime Sys memory for the API process.
    heapAllocBytes:
      type: integer
      format: int64
      minimum: 0
    heapSysBytes:
      type: integer
      format: int64
      minimum: 0
    goroutineCount:
      type: integer
      minimum: 0
    gcCount:
      type: integer
      minimum: 0
    lastGcPauseNs:
      type: integer
      format: int64
      minimum: 0
    database:
      "$ref": "#/AdminOverviewDatabaseRuntime"
    worker:
      "$ref": "#/AdminOverviewWorkerRuntime"
    queueLag:
      "$ref": "#/AdminOverviewQueueLag"
AdminOverviewWorkerRuntime:
  type: object
  required:
  - stale
  - status
  properties:
    lastSeenAt:
      type: string
      format: date-time
    ageSeconds:
      type: integer
      format: int64
      minimum: 0
    stale:
      type: boolean
    status:
      type: string
      enum:
      - ok
      - stale
      - unknown
AdminOverviewQueueLag:
  type: object
  required:
  - waiting
  - running
  - failed
  properties:
    waiting:
      type: integer
      format: int64
      minimum: 0
      description: Jobs in available/scheduled/retryable/pending states.
    running:
      type: integer
      format: int64
      minimum: 0
    failed:
      type: integer
      format: int64
      minimum: 0
      description: Discarded jobs (cheap failure signal).
AdminOverviewDatabaseRuntime:
  type: object
  required:
  - maxConnections
  - totalConnections
  - acquiredConnections
  - idleConnections
  properties:
    maxConnections:
      type: integer
      minimum: 0
    totalConnections:
      type: integer
      minimum: 0
    acquiredConnections:
      type: integer
      minimum: 0
    idleConnections:
      type: integer
      minimum: 0
AdminOverviewCommunity:
  type: object
  additionalProperties: false
  properties:
    userCount:
      type: integer
      format: int64
    activeUserCount:
      type: integer
      format: int64
    disabledUserCount:
      type: integer
      format: int64
    bannedUserCount:
      type: integer
      format: int64
    topicCount:
      type: integer
      format: int64
    activeTopicCount:
      type: integer
      format: int64
    lockedTopicCount:
      type: integer
      format: int64
    hiddenTopicCount:
      type: integer
      format: int64
    deletedTopicCount:
      type: integer
      format: int64
    commentCount:
      type: integer
      format: int64
    postCount:
      type: integer
      format: int64
    categoryCount:
      type: integer
      format: int64
    tagCount:
      type: integer
      format: int64
    pendingTagCount:
      type: integer
      format: int64
    totalViews:
      type: integer
      format: int64
AdminOverviewAttachments:
  type: object
  additionalProperties: false
  properties:
    totalCount:
      type: integer
      format: int64
    activeCount:
      type: integer
      format: int64
    disabledCount:
      type: integer
      format: int64
    deletedCount:
      type: integer
      format: int64
    orphanCount:
      type: integer
      format: int64
    totalBytes:
      type: integer
      format: int64
AdminOverviewModeration:
  type: object
  additionalProperties: false
  properties:
    openCount:
      type: integer
      format: int64
    reviewingCount:
      type: integer
      format: int64
    resolvedCount:
      type: integer
      format: int64
    rejectedCount:
      type: integer
      format: int64
AdminOverviewExtensions:
  type: object
  additionalProperties: false
  properties:
    totalCount:
      type: integer
      format: int64
    enabledCount:
      type: integer
      format: int64
    pluginCount:
      type: integer
      format: int64
    themeCount:
      type: integer
      format: int64
    installedPluginRuntimeCount:
      type: integer
      format: int64
    failedEventCount:
      type: integer
      format: int64
AdminOverviewTrends:
  type: object
  required:
  - days
  properties:
    days:
      type: array
      items:
        "$ref": "#/AdminOverviewTrendDay"
AdminOverviewTrendDay:
  type: object
  required:
  - date
  - topicCount
  - commentCount
  - userCount
  properties:
    date:
      type: string
      format: date
    topicCount:
      type: integer
      format: int64
    commentCount:
      type: integer
      format: int64
    userCount:
      type: integer
      format: int64
AdminOverviewCategoryActivity:
  type: object
  required:
  - id
  - slug
  - name
  - topicCount
  - commentCount
  properties:
    id:
      type: integer
      format: int64
    slug:
      type: string
    name:
      type: string
    topicCount:
      type: integer
      format: int64
    commentCount:
      type: integer
      format: int64
AdminOverviewAction:
  type: object
  required:
  - key
  - count
  - severity
  - route
  properties:
    key:
      type: string
      enum:
      - moderation_queue
      - pending_tags
      - orphan_attachments
      - failed_extension_events
    count:
      type: integer
      format: int64
    severity:
      type: string
      enum:
      - success
      - info
      - warning
      - danger
    route:
      type: string
