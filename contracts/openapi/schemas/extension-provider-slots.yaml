ProviderSlotArtifact:
  type: object
  additionalProperties: false
  required: [extensionId, extensionVersion, packageDigest, runtimeInstanceId]
  properties:
    extensionId: { type: string }
    extensionVersion: { type: string }
    packageDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
    runtimeInstanceId: { type: string, minLength: 1 }
ProviderSlotContract:
  type: object
  additionalProperties: false
  required:
  - id
  - slot
  - contractVersion
  - requestSchema
  - responseSchema
  - fallback
  - timeoutMs
  - artifact
  - contractRuntimeAvailable
  properties:
    id: { type: string }
    slot: { type: string }
    contractVersion: { type: string }
    requestSchema: { type: string }
    responseSchema: { type: string }
    requestSchemaDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
    responseSchemaDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
    fallback: { type: string, enum: [next, closed] }
    timeoutMs: { type: integer, minimum: 1, maximum: 5000 }
    artifact: { "$ref": "#/ProviderSlotArtifact" }
    contractRuntimeAvailable: { type: boolean }
ProviderSlotCandidate:
  type: object
  additionalProperties: false
  required: [id, targetId, label, handler, priority, rank, artifact, availability]
  properties:
    id: { type: string }
    targetId: { type: string }
    label: { type: string }
    handler: { type: string }
    priority: { type: integer }
    rank: { type: integer, minimum: 1 }
    artifact: { "$ref": "#/ProviderSlotArtifact" }
    availability: { type: string, enum: [available, unavailable] }
ProviderSlotConflict:
  type: object
  additionalProperties: false
  required: [kind, priority, candidateIds]
  properties:
    kind: { type: string, enum: [priority_tie] }
    priority: { type: integer }
    candidateIds:
      type: array
      minItems: 2
      uniqueItems: true
      items: { type: string }
ProviderSlotSelectedArtifact:
  type: object
  additionalProperties: false
  required: [extensionId, extensionVersion, packageDigest]
  properties:
    extensionId: { type: string }
    extensionVersion: { type: string }
    packageDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
    runtimeInstanceId: { type: string }
ProviderSlotSelection:
  type: object
  additionalProperties: false
  required:
  - contractId
  - contractVersion
  - slot
  - contractArtifact
  - candidateId
  - providerArtifact
  - selectedByUserId
  - selectionAuditEventId
  - revision
  - selectedAt
  - updatedAt
  properties:
    contractId: { type: string }
    contractVersion: { type: string }
    slot: { type: string }
    contractArtifact: { "$ref": "#/ProviderSlotSelectedArtifact" }
    candidateId: { type: string }
    providerArtifact: { "$ref": "#/ProviderSlotSelectedArtifact" }
    selectedByUserId: { type: integer, format: int64 }
    selectionAuditEventId: { type: integer, format: int64, minimum: 1 }
    revision: { type: integer, format: int64, minimum: 1 }
    selectedAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }
ProviderSlotInspectionItem:
  type: object
  additionalProperties: false
  required: [contract, candidates, conflicts, selectionStatus, availability]
  properties:
    contract: { "$ref": "#/ProviderSlotContract" }
    candidates:
      type: array
      items: { "$ref": "#/ProviderSlotCandidate" }
    conflicts:
      type: array
      items: { "$ref": "#/ProviderSlotConflict" }
    selectionStatus: { type: string, enum: [default, selected, stale] }
    selection: { "$ref": "#/ProviderSlotSelection" }
    availability: { type: string, enum: [available, unavailable] }
    unavailabilityReason: { type: string, enum: [no_candidates, runtime_unavailable] }
ProviderSlotInspection:
  type: object
  additionalProperties: false
  required: [revision, slots]
  properties:
    revision: { type: integer, format: int64, minimum: 0 }
    slots:
      type: array
      items: { "$ref": "#/ProviderSlotInspectionItem" }
ApiResponseProviderSlotInspection:
  type: object
  additionalProperties: false
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data: { "$ref": "#/ProviderSlotInspection" }
ProviderSlotSelectRequest:
  type: object
  additionalProperties: false
  required: [contractId, candidateId, expectedRevision]
  properties:
    contractId: { type: string }
    candidateId: { type: string }
    expectedRevision: { type: integer, format: int64, minimum: 0 }
ProviderSlotResetRequest:
  type: object
  additionalProperties: false
  required: [contractId, expectedRevision, reasonCode]
  properties:
    contractId: { type: string }
    expectedRevision: { type: integer, format: int64, minimum: 1 }
    reasonCode: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,127}$' }
ProviderSlotProbeRequest:
  type: object
  additionalProperties: false
  required: [contractId, candidateId]
  properties:
    contractId: { type: string }
    candidateId: { type: string }
ProviderSlotReset:
  type: object
  additionalProperties: false
  required: [reset, contractId]
  properties:
    reset: { type: boolean, enum: [true] }
    contractId: { type: string }
ProviderSlotProbe:
  type: object
  additionalProperties: false
  required: [contractId, candidateId, artifact, ok, reason, message, durationMs]
  properties:
    contractId: { type: string }
    candidateId: { type: string }
    artifact: { "$ref": "#/ProviderSlotArtifact" }
    ok: { type: boolean }
    reason: { type: string }
    message: { type: string }
    details:
      type: object
      additionalProperties: { type: string }
    suggestions:
      type: array
      items: { type: string }
    durationMs: { type: integer, format: int64, minimum: 0 }
ProviderSlotSelectionEvent:
  type: object
  additionalProperties: false
  required: [id, contractId, contractVersion, slot, action, auditEventId, selectionRevision, createdAt]
  properties:
    id: { type: integer, format: int64 }
    contractId: { type: string }
    contractVersion: { type: string }
    slot: { type: string }
    action: { type: string, enum: [select, reset, invalidate] }
    previousSelection: { "$ref": "#/ProviderSlotSelection" }
    selectedSelection: { "$ref": "#/ProviderSlotSelection" }
    actorUserId: { type: integer, format: int64 }
    auditEventId: { type: integer, format: int64, minimum: 1 }
    reasonCode: { type: string }
    selectionRevision: { type: integer, format: int64, minimum: 1 }
    createdAt: { type: string, format: date-time }
ApiResponseProviderSlotSelection:
  type: object
  additionalProperties: false
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data: { "$ref": "#/ProviderSlotSelection" }
ApiResponseProviderSlotSelectionEvents:
  type: object
  additionalProperties: false
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data:
      type: array
      items: { "$ref": "#/ProviderSlotSelectionEvent" }
ApiResponseProviderSlotProbe:
  type: object
  additionalProperties: false
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data: { "$ref": "#/ProviderSlotProbe" }
ApiResponseProviderSlotReset:
  type: object
  additionalProperties: false
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data: { "$ref": "#/ProviderSlotReset" }
