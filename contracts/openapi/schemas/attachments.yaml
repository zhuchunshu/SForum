ApiResponseAttachment:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/Attachment"
ApiResponseAdminAttachment:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/AdminAttachment"
ApiResponseAdminAttachmentList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/AdminAttachmentList"
ApiResponseAdminAttachmentDetail:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/AdminAttachmentDetail"
ApiResponseAttachmentSettings:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/AttachmentSettings"
ApiResponseAttachmentProbe:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/AttachmentProbe"
ApiResponseAttachmentCleanup:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/AttachmentCleanupResult"
AttachmentProvider:
  type: string
  description: >
    Core driver id (local) or plugin selection plugin:<extensionId> (E6.1).
  examples:
  - local
  - plugin:sforum.s3
AttachmentStorageCandidate:
  type: object
  required:
  - value
  - kind
  - label
  - available
  properties:
    value:
      type: string
      description: Value written to attachment.provider
    kind:
      type: string
      enum:
      - core
      - plugin
    label:
      type: string
    extensionId:
      type: string
    settingsPath:
      type: string
      description: Optional admin path for plugin settings
    available:
      type: boolean
AttachmentStatus:
  type: string
  enum:
  - active
  - disabled
  - deleted
AttachmentVisibility:
  type: string
  enum:
  - public
  - private
AttachmentOwner:
  type: object
  required:
  - id
  - username
  - displayName
  properties:
    id:
      type: integer
      format: int64
    username:
      type: string
    displayName:
      type: string
Attachment:
  type: object
  required:
  - id
  - publicId
  - name
  - contentType
  - size
  - url
  - status
  - provider
  - referenceCount
  - createdAt
  properties:
    id:
      type: integer
      format: int64
    publicId:
      type: string
    name:
      type: string
    contentType:
      type: string
    size:
      type: integer
      format: int64
    url:
      type: string
    status:
      "$ref": "#/AttachmentStatus"
    provider:
      "$ref": "#/AttachmentProvider"
    owner:
      "$ref": "#/AttachmentOwner"
    referenceCount:
      type: integer
    createdAt:
      type: string
      format: date-time
AdminAttachment:
  allOf:
  - "$ref": "#/Attachment"
  - type: object
    required:
    - objectKey
    - extension
    - sha256
    - visibility
    properties:
      objectKey:
        type: string
      extension:
        type: string
      sha256:
        type: string
      imageWidth:
        type:
        - integer
        - 'null'
      imageHeight:
        type:
        - integer
        - 'null'
      visibility:
        "$ref": "#/AttachmentVisibility"
      deletedAt:
        type:
        - string
        - 'null'
        format: date-time
AdminAttachmentList:
  type: object
  required:
  - items
  - total
  - page
  - perPage
  properties:
    items:
      type: array
      items:
        "$ref": "#/AdminAttachment"
    total:
      type: integer
      format: int64
    page:
      type: integer
    perPage:
      type: integer
AttachmentReference:
  type: object
  required:
  - id
  - attachmentId
  - resourceType
  - resourceId
  - context
  - createdAt
  properties:
    id:
      type: integer
      format: int64
    attachmentId:
      type: integer
      format: int64
    resourceType:
      type: string
      examples:
      - post
      - topic
      - avatar
    resourceId:
      type: integer
      format: int64
    context:
      type: string
    createdAt:
      type: string
      format: date-time
AdminAttachmentDetail:
  allOf:
  - "$ref": "#/AdminAttachment"
  - type: object
    required:
    - references
    properties:
      references:
        type: array
        items:
          "$ref": "#/AttachmentReference"
AttachmentSettings:
  type: object
  required:
  - provider
  - uploadEnabled
  - pathTemplate
  - publicBaseUrl
  - maxFileSizeMb
  - allowedExtensions
  - allowedMimeTypes
  - defaultVisibility
  - cleanupOrphanAfterDays
  - local
  properties:
    providerSlot:
      type: string
      description: Host slot id attachment.storage.provider
      examples:
      - attachment.storage.provider
    drivers:
      type: array
      description: Core built-in driver ids (compat; prefer candidates)
      items:
        type: string
    candidates:
      type: array
      description: Core drivers plus enabled plugin storage providers (E6.1)
      items:
        "$ref": "#/AttachmentStorageCandidate"
    provider:
      "$ref": "#/AttachmentProvider"
    uploadEnabled:
      type: boolean
    pathTemplate:
      type: string
      examples:
      - "{yyyy}/{mm}/{dd}/{public_id}{ext}"
    publicBaseUrl:
      type: string
    maxFileSizeMb:
      type: integer
      minimum: 1
      maximum: 1024
    allowedExtensions:
      type: array
      items:
        type: string
      examples:
      - - ".jpg"
        - ".jpeg"
        - ".png"
        - ".gif"
        - ".webp"
        - ".pdf"
        - ".txt"
        - ".zip"
    allowedMimeTypes:
      type: array
      items:
        type: string
      examples:
      - - image/jpeg
        - image/png
        - application/pdf
    defaultVisibility:
      "$ref": "#/AttachmentVisibility"
    cleanupOrphanAfterDays:
      type: integer
      minimum: 1
      maximum: 3650
    local:
      "$ref": "#/AttachmentLocalSettings"
AttachmentLocalSettings:
  type: object
  required:
  - root
  - publicPrefix
  properties:
    root:
      type: string
      description: Filesystem root for the local attachment provider. Relative paths resolve from the API process working directory.
      examples:
      - storage/app/attachments
    publicPrefix:
      type: string
      description: Optional public URL prefix for locally stored objects.
AttachmentProbe:
  type: object
  required:
  - provider
  - ok
  - message
  properties:
    provider:
      "$ref": "#/AttachmentProvider"
    ok:
      type: boolean
    message:
      type: string
    reason:
      type: string
      description: Stable machine code (e.g. storage.ok, attachment.storage_unavailable, plugin RPC reason).
AttachmentCleanupResult:
  type: object
  required:
  - deleted
  - failed
  properties:
    deleted:
      type: integer
    failed:
      type: integer
