PageDefinition:
  type: object
  required: [id, pathPattern, access, contractVersion, coreComponent, replaceable, virtual]
  properties:
    id: { type: string }
    pathPattern: { type: string }
    access:
      type: string
      enum: [public, login, guest, moderation, permission]
      description: "Empty/omitted access normalizes to public at register time; unknown values fail closed."
    contractVersion: { type: string }
    coreComponent: { type: string }
    replaceable: { type: boolean }
    virtual:
      type: boolean
      description: "True for Host-selected system surfaces that have no public route pattern and never participate in ordinary path matching."
    requiresFeatures: { type: array, items: { type: string } }
    notes: { type: string }

PageResolve:
  type: object
  required: [page, provider, action, fallback]
  properties:
    page: { "$ref": "#/PageDefinition" }
    provider: { type: string }
    extensionId: { type: string }
    contributionId: { type: string }
    action: { type: string }
    fallback: { type: boolean }
    reason:
      type: string
      enum:
        - authoritative_core
        - transport_unavailable
        - view_model_unavailable
        - render_failed
        - artifact_mismatch
        - runtime_unavailable
      description: Stable classification for core authority or fail-closed fallback.
    selectedProvider:
      type: string
      description: Provider selected before fail-closed presentation rewrites provider to core.
    selectedExtensionId: { type: string }
    selectedContributionId: { type: string }
    selectedVersion: { type: string }
    selectedPackageDigest: { type: string }
    selectedRuntimeInstanceId: { type: string }
    nodeRevision:
      type: integer
      format: int64
      minimum: 0
      description: Process-local theme runtime revision for rendered output.
    templatePath: { type: string }
    templateHtml: { type: string, description: "Sandboxed L1 HTML with host islands preserved" }
    dataSource: { type: string, description: "core | plugin" }
    dataRoute: { type: string, description: "Optional plugin data loader route path (host SSR only)" }
    routeParams:
      type: object
      additionalProperties: { type: string }
      description: "Exact matched route parameters for core catalog or added paths"
    loaderData:
      description: "SSR-only plugin page data from host loader gateway; clients must not fetch plugin routes"
    loaderError: { type: string }
    contractVersion: { type: string, description: "Effective page contract version" }
    renderOutput: { "$ref": "#/ThemeRenderedPage" }

ThemeIslandProp:
  type: object
  required: [name, type]
  properties:
    name: { type: string }
    type: { type: string, enum: [string, boolean, integer, url] }
    stringValue: { type: string }
    booleanValue: { type: boolean }
    integerValue: { type: integer, format: int64 }

ThemeIsland:
  type: object
  required: [id, componentId]
  properties:
    id: { type: string }
    componentId: { type: string }
    props:
      type: array
      items: { "$ref": "#/ThemeIslandProp" }
    fallbackHtmlSegments:
      type: array
      maxItems: 256
      description: Balanced L1/SSR fallback fragments rendered as the Host island default slot.
      items: { type: string }

ThemeSEO:
  type: object
  required: [title]
  properties:
    title: { type: string }
    description: { type: string }
    canonicalUrl: { type: string }
    robots: { type: string }
    alternateLinks:
      type: array
      items:
        type: object
        required: [locale, url]
        properties:
          locale: { type: string }
          url: { type: string }
    structuredData:
      type: array
      items:
        type: object
        required: [kind]
        properties:
          kind: { type: string }
          id: { type: string }
          name: { type: string }
          url: { type: string }
          description: { type: string }
          dateCreated: { type: string }
          dateUpdated: { type: string }

ThemeRenderAttempt:
  type: object
  required: [source, outcome]
  properties:
    source: { type: string }
    extensionId: { type: string }
    packageDigest: { type: string }
    template: { type: string }
    outcome: { type: string }
    failureCode: { type: string }

ThemeRenderedPage:
  type: object
  required: [htmlSegments, seo, source, fallback, nodeRevision]
  properties:
    htmlSegments:
      type: array
      items: { type: string }
    islands:
      type: array
      items: { "$ref": "#/ThemeIsland" }
    seo: { "$ref": "#/ThemeSEO" }
    source: { type: string }
    fallback: { type: boolean }
    attempts:
      type: array
      items: { "$ref": "#/ThemeRenderAttempt" }
    nodeRevision:
      type: integer
      format: int64
      minimum: 0
      description: Process-local immutable theme publication revision; not a cluster-wide revision.

AdminPageListItem:
  type: object
  required: [page, provider]
  properties:
    page: { "$ref": "#/PageDefinition" }
    provider: { type: string }
    extensionId: { type: string }
    contributionId: { type: string }
    contractVersion:
      type: string
      description: "Read-only bound or catalog contract; not editable in admin UI"
    candidates: { type: array, items: { type: object, additionalProperties: true } }

PageApproveRequest:
  type: object
  required: [extensionId, contributionId, version, packageDigest, contractVersion]
  properties:
    extensionId: { type: string }
    contributionId: { type: string }
    version: { type: string }
    packageDigest: { type: string }
    contractVersion:
      type: string
      description: "Must match contribution and core catalog contract exactly"
    templatePath:
      type: string
      description: "Deprecated and ignored; template path is always taken from the registered contribution"

PageProviderMutation:
  type: object
  properties:
    pageId: { type: string }
    provider: { type: string }

ThemePageContribution:
  type: object
  required: [id, action, extensionId, version]
  properties:
    id: { type: string }
    action: { type: string, enum: [add, replace] }
    target: { type: string }
    path: { type: string }
    template: { type: string }
    contract: { type: string }
    access: { type: string }
    permission: { type: string }
    dataSource: { type: string }
    dataRoute: { type: string }
    dataSchema: { type: string }
    extensionId: { type: string }
    version: { type: string }
    packageDigest: { type: string }
    runtimeInstanceId: { type: string }
    routeSignature: { type: string }

ThemeActivationImpact:
  type: object
  required: [contribution, requiresApproval]
  properties:
    contribution: { "$ref": "#/ThemePageContribution" }
    page: { "$ref": "#/PageDefinition" }
    conflicts:
      type: array
      items: { "$ref": "#/ThemePageContribution" }
    requiresApproval: { type: boolean }

ThemeActivationPreview:
  type: object
  required:
    - extensionId
    - version
    - packageDigest
    - currentThemeId
    - currentThemeVersion
    - currentThemeDigest
    - impacts
    - canActivate
    - canApproveCoreReplacements
    - requiresCoreReplacementApproval
    - note
  properties:
    extensionId: { type: string }
    version: { type: string }
    packageDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
    currentThemeId: { type: string }
    currentThemeVersion: { type: string }
    currentThemeDigest: { type: string }
    impacts:
      type: array
      items: { "$ref": "#/ThemeActivationImpact" }
    canActivate: { type: boolean }
    canApproveCoreReplacements:
      type: boolean
      description: True only for a super_admin actor; it is not itself an approval.
    requiresCoreReplacementApproval: { type: boolean }
    note: { type: string }

ActiveThemeSkin:
  type: object
  required: [css]
  properties:
    extensionId: { type: string }
    version: { type: string }
    packageDigest: { type: string }
    css:
      type: array
      items:
        type: string
        pattern: '^/_sforum/assets/themes/.+/[0-9a-f]{64}/.+'
    tokens:
      type: string
      pattern: '^$|^/_sforum/assets/themes/.+/[0-9a-f]{64}/.+'
    nodeRevision:
      type: integer
      format: int64
      minimum: 0
      description: Process-local immutable theme publication revision; omitted for the legacy package fallback.

ApiResponsePageCatalog:
  type: object
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data: { type: array, items: { "$ref": "#/PageDefinition" } }

ApiResponsePageResolve:
  type: object
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data: { "$ref": "#/PageResolve" }

ApiResponseAdminPageList:
  type: object
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data: { type: array, items: { "$ref": "#/AdminPageListItem" } }

ApiResponseActiveThemeSkin:
  type: object
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data: { "$ref": "#/ActiveThemeSkin" }

ApiResponsePageProviderMutation:
  type: object
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data: { "$ref": "#/PageProviderMutation" }

ApiResponseThemeActivationPreview:
  type: object
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data: { "$ref": "#/ThemeActivationPreview" }
