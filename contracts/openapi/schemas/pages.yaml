PageDefinition:
  type: object
  required: [id, pathPattern, access, contractVersion, coreComponent, replaceable]
  properties:
    id: { type: string }
    pathPattern: { type: string }
    access:
      type: string
      enum: [public, login, guest, moderation, permission]
      description: "Empty/omitted access normalizes to public at register time; unknown values fail closed."
    contractVersion: { type: string }
    coreComponent: { type: string }
    replaceable: { type: boolean }
    requiresFeatures: { type: array, items: { type: string } }
    notes: { type: string }

PageResolve:
  type: object
  required: [page, provider, action, fallback]
  properties:
    page: { "$ref": "#/PageDefinition" }
    provider: { type: string }
    extensionId: { type: string }
    contributionId: { type: string }
    action: { type: string }
    fallback: { type: boolean }
    templatePath: { type: string }
    templateHtml: { type: string, description: "Sandboxed L1 HTML with host islands preserved" }
    dataSource: { type: string, description: "core | plugin" }
    dataRoute: { type: string, description: "Optional plugin data loader route path (host SSR only)" }
    routeParams:
      type: object
      additionalProperties: { type: string }
      description: "Matched route parameters for add paths"
    loaderData:
      description: "SSR-only plugin page data from host loader gateway; clients must not fetch plugin routes"
    loaderError: { type: string }
    contractVersion: { type: string, description: "Effective page contract version" }

AdminPageListItem:
  type: object
  required: [page, provider]
  properties:
    page: { "$ref": "#/PageDefinition" }
    provider: { type: string }
    extensionId: { type: string }
    contributionId: { type: string }
    contractVersion:
      type: string
      description: "Read-only bound or catalog contract; not editable in admin UI"
    candidates: { type: array, items: { type: object, additionalProperties: true } }

PageApproveRequest:
  type: object
  required: [extensionId, contributionId, version, packageDigest, contractVersion]
  properties:
    extensionId: { type: string }
    contributionId: { type: string }
    version: { type: string }
    packageDigest: { type: string }
    contractVersion:
      type: string
      description: "Must match contribution and core catalog contract exactly"
    templatePath:
      type: string
      description: "Deprecated and ignored; template path is always taken from the registered contribution"

PageProviderMutation:
  type: object
  properties:
    pageId: { type: string }
    provider: { type: string }

ActiveThemeSkin:
  type: object
  required: [css]
  properties:
    extensionId: { type: string }
    version: { type: string }
    css: { type: array, items: { type: string } }
    tokens: { type: string }

ApiResponsePageCatalog:
  type: object
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data: { type: array, items: { "$ref": "#/PageDefinition" } }

ApiResponsePageResolve:
  type: object
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data: { "$ref": "#/PageResolve" }

ApiResponseAdminPageList:
  type: object
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data: { type: array, items: { "$ref": "#/AdminPageListItem" } }

ApiResponseActiveThemeSkin:
  type: object
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data: { "$ref": "#/ActiveThemeSkin" }

ApiResponsePageProviderMutation:
  type: object
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data: { "$ref": "#/PageProviderMutation" }
