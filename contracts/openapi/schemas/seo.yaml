ApiResponseSEOAsset:
  type: object
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data:
      "$ref": "#/SEOAsset"
ApiResponseSEOSitemapEntries:
  type: object
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data:
      "$ref": "#/SEOSitemapEntries"
SEOAsset:
  type: object
  required: [publicId, url, contentType, size]
  properties:
    publicId: { type: string }
    url: { type: string, format: uri }
    contentType: { type: string, pattern: '^image/' }
    size: { type: integer, format: int64 }
    width: { type: [integer, 'null'] }
    height: { type: [integer, 'null'] }
SEOContentPolicy:
  type: object
  required: [titleTemplate, descriptionSources, indexMode, includeInSitemap, schemaType]
  properties:
    titleTemplate: { type: string, maxLength: 120 }
    descriptionSources:
      type: array
      minItems: 1
      uniqueItems: true
      items: { type: string }
    defaultImageUrl: { type: string, format: uri }
    indexMode: { type: string, enum: [index, noindex] }
    includeInSitemap: { type: boolean }
    schemaType:
      type: string
      enum: [WebSite, CollectionPage, DiscussionForumPosting, ProfilePage, WebPage]
SEOSettings:
  type: object
  required: [siteName, homeTitle, homeDescription, pageTitleTemplate, policies]
  properties:
    inheritSiteName: { type: boolean }
    siteName: { type: string }
    homeTitle: { type: string }
    homeDescription: { type: string }
    homeKeywords: { type: string }
    homeOGTitle: { type: string }
    homeOGDescription: { type: string }
    homeOGImageUrl: { type: string, format: uri }
    pageTitleTemplate: { type: string }
    pageDefaultDescription: { type: string }
    titleSeparator: { type: string, enum: ['|', '-', '·'] }
    policies:
      type: object
      additionalProperties:
        "$ref": "#/SEOContentPolicy"
SEOSitemapContentType:
  type: string
  enum: [categories, tags, topics, profiles]
SEOSitemapEntry:
  type: object
  required: [path, lastModified]
  properties:
    path: { type: string, pattern: '^/' }
    lastModified: { type: string, format: date-time }
SEOSitemapEntries:
  type: object
  required: [items, page, perPage, hasMore]
  properties:
    items:
      type: array
      items:
        "$ref": "#/SEOSitemapEntry"
    page: { type: integer, minimum: 1 }
    perPage: { type: integer, minimum: 1, maximum: 10000 }
    hasMore: { type: boolean }
