ForumSettings:
  type: object
  required:
  - defaultCategorySlug
  - tagCreationMode
  - tagPublicPages
  - tagMinPerTopic
  - tagMaxPerTopic
  - topicsPerPage
  - commentsPerPage
  - topicTitleMinRunes
  - topicTitleMaxRunes
  - topicContentMinRunes
  - topicContentMaxRunes
  - topicEditWindowMinutes
  - topicCooldownSeconds
  - dailyTopicLimit
  - commentMinRunes
  - commentMaxRunes
  - commentMaxNestingDepth
  - commentEditWindowMinutes
  - commentCooldownSeconds
  - dailyCommentLimit
  - excerptRuneLimit
  - guestRead
  - listDefaultSort
  - listHotWindowDays
  - allowAuthorCloseReplies
  - allowAuthorDelete
  - autoLockIdleDays
  - showTopicEditMark
  - duplicateTitlePolicy
  - showCommentEditMark
  - softDeleteVisibility
  - mentionsEnabled
  - mentionsMaxPerPost
  properties:
    defaultCategorySlug:
      type: string
    tagCreationMode:
      "$ref": "#/TagCreationMode"
    tagPublicPages:
      type: boolean
    tagMinPerTopic:
      type: integer
      minimum: 0
      maximum: 10
    tagMaxPerTopic:
      type: integer
      minimum: 0
      maximum: 10
    topicsPerPage:
      type: integer
      default: 20
      minimum: 1
      maximum: 100
    commentsPerPage:
      type: integer
      default: 20
      minimum: 1
      maximum: 100
    topicTitleMinRunes:
      type: integer
      minimum: 1
      maximum: 200
    topicTitleMaxRunes:
      type: integer
      minimum: 1
      maximum: 200
    topicContentMinRunes:
      type: integer
      minimum: 0
      maximum: 200000
    topicContentMaxRunes:
      type: integer
      minimum: 1
      maximum: 200000
    topicEditWindowMinutes:
      type: integer
      minimum: 0
      maximum: 10080
      description: 0 means unlimited author edit window
    topicCooldownSeconds:
      type: integer
      minimum: 0
      maximum: 86400
      description: 0 means no cooldown between topic creates
    dailyTopicLimit:
      type: integer
      minimum: 0
      maximum: 10000
      description: 0 means unlimited daily topics
    commentMinRunes:
      type: integer
      minimum: 0
      maximum: 50000
    commentMaxRunes:
      type: integer
      minimum: 1
      maximum: 50000
    commentMaxNestingDepth:
      type: integer
      minimum: 0
      maximum: 20
    commentEditWindowMinutes:
      type: integer
      minimum: 0
      maximum: 10080
    commentCooldownSeconds:
      type: integer
      minimum: 0
      maximum: 86400
    dailyCommentLimit:
      type: integer
      minimum: 0
      maximum: 10000
    excerptRuneLimit:
      type: integer
      minimum: 40
      maximum: 500
    guestRead:
      type: string
      enum: [public, login_required]
      description: Whether guests may read public forum content
    listDefaultSort:
      type: string
      enum: [latest, active, hot]
    listHotWindowDays:
      type: integer
      minimum: 1
      maximum: 90
    allowAuthorCloseReplies:
      type: boolean
    allowAuthorDelete:
      type: boolean
    autoLockIdleDays:
      type: integer
      minimum: 0
      maximum: 3650
      description: 0 disables auto-lock of idle topics
    showTopicEditMark:
      type: boolean
    duplicateTitlePolicy:
      type: string
      enum: [off, warn, block]
    showCommentEditMark:
      type: boolean
    softDeleteVisibility:
      type: string
      enum: [author_and_staff, staff_only, hidden]
    mentionsEnabled:
      type: boolean
    mentionsMaxPerPost:
      type: integer
      minimum: 0
      maximum: 50
      description: 0 means unlimited mentions when mentions are enabled
