AvatarView:
  type: object
  required:
  - kind
  - url
  - alt
  properties:
    kind:
      type: string
      enum:
      - uploaded
      - initials
      - gravatar
      - static
    url:
      type: string
      description: Empty when kind is initials and no image URL should be loaded.
    attachmentId:
      type:
      - integer
      - 'null'
      format: int64
      description: Present for uploaded avatars.
    alt:
      type: string
Profile:
  type: object
  required:
  - userId
  - bio
  - signature
  - location
  - websiteUrl
  - avatar
  - createdAt
  - updatedAt
  properties:
    userId:
      type: integer
      format: int64
    bio:
      type: string
    signature:
      type: string
    location:
      type: string
    websiteUrl:
      type: string
    avatarAttachmentId:
      type:
      - integer
      - 'null'
      format: int64
      description: Deprecated compatibility field. Use avatar.attachmentId and the dedicated avatar endpoints for changes.
    avatar:
      "$ref": "#/AvatarView"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
PublicProfile:
  type: object
  required:
  - userId
  - username
  - displayName
  - profile
  - topicCount
  - commentCount
  - recentTopics
  - joinedAt
  properties:
    userId:
      type: integer
      format: int64
    username:
      type: string
    displayName:
      type: string
    profile:
      "$ref": "#/Profile"
    topicCount:
      type: integer
      format: int64
    commentCount:
      type: integer
      format: int64
    recentTopics:
      type: array
      items:
        "$ref": "../schemas/forum.yaml#/TopicSummary"
    joinedAt:
      type: string
      format: date-time
    extensionTabs:
      type: array
      description: Host-rendered profile tabs/sections from forum.profile.tabs (F4.3).
      items:
        "$ref": "#/ProfileExtensionTab"
ProfileExtensionTab:
  type: object
  required:
  - extensionId
  - id
  - order
  - kind
  - url
  properties:
    extensionId:
      type: string
    id:
      type: string
    order:
      type: integer
    label:
      type: object
      additionalProperties:
        type: string
    icon:
      type: string
    kind:
      type: string
      enum:
      - extensionRoute
      - hostLink
    method:
      type: string
    url:
      type: string
UpdateProfileRequest:
  type: object
  description: All fields optional. Omitted fields are left unchanged.
  properties:
    bio:
      type: string
      maxLength: 500
    signature:
      type: string
      maxLength: 200
    location:
      type: string
      maxLength: 100
    websiteUrl:
      type: string
      maxLength: 200
    avatarAttachmentId:
      type:
      - integer
      - 'null'
      format: int64
ApiResponseProfile:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/Profile"
ApiResponsePublicProfile:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/PublicProfile"
