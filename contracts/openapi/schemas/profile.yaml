AvatarView:
  type: object
  required:
  - kind
  - url
  - alt
  properties:
    kind:
      type: string
      enum:
      - uploaded
      - initials
      - gravatar
      - static
    url:
      type: string
      description: Empty when kind is initials and no image URL should be loaded.
    attachmentId:
      type:
      - integer
      - 'null'
      format: int64
      description: Present for uploaded avatars.
    alt:
      type: string
Profile:
  type: object
  required:
  - userId
  - bio
  - signature
  - location
  - websiteUrl
  - avatar
  - createdAt
  - updatedAt
  properties:
    userId:
      type: integer
      format: int64
    bio:
      type: string
    signature:
      type: string
    location:
      type: string
    websiteUrl:
      type: string
    avatarAttachmentId:
      type:
      - integer
      - 'null'
      format: int64
      description: Deprecated compatibility field. Use avatar.attachmentId and the dedicated avatar endpoints for changes.
    avatar:
      "$ref": "#/AvatarView"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
PublicProfile:
  type: object
  required:
  - userId
  - username
  - displayName
  - profile
  - topicCount
  - commentCount
  - recentTopics
  - activities
  - joinedAt
  properties:
    userId:
      type: integer
      format: int64
    username:
      type: string
    displayName:
      type: string
    profile:
      "$ref": "#/Profile"
    topicCount:
      type: integer
      format: int64
    commentCount:
      type: integer
      format: int64
    recentTopics:
      type: array
      items:
        "$ref": "../schemas/forum.yaml#/TopicSummary"
    activities:
      type: array
      description: Recent public topic/comment activity. Items only include topics in public categories and active/locked topic states; comments are active only.
      items:
        "$ref": "#/ProfileActivity"
    joinedAt:
      type: string
      format: date-time
    extensionTabs:
      type: array
      description: Host-rendered profile tabs/sections from forum.profile.tabs (F4.3).
      items:
        "$ref": "#/ProfileExtensionTab"
ProfileActivity:
  type: object
  required:
  - kind
  - topic
  - excerpt
  - createdAt
  properties:
    kind:
      type: string
      enum:
      - topic
      - comment
    topic:
      "$ref": "#/ProfileActivityTopic"
    commentId:
      type:
      - integer
      - 'null'
      format: int64
      description: Present for comment activity and links to the topic comment anchor.
    commentPage:
      type:
      - integer
      - 'null'
      format: int32
      minimum: 1
      description: >
        Flat-view page number for the comment within its topic (1-based). Present
        for comment activity so clients can build /page/N#comment-{id} deep links
        without relying on hash-only SSR resolve (fragments are not sent to the server).
    excerpt:
      type: string
    createdAt:
      type: string
      format: date-time
ProfileActivityTopic:
  type: object
  required:
  - id
  - slug
  - title
  - status
  - categorySlug
  - categoryName
  - commentCount
  - createdAt
  - updatedAt
  - lastActivityAt
  properties:
    id:
      type: integer
      format: int64
    slug:
      type: string
    title:
      type: string
    status:
      type: string
      enum:
      - active
      - locked
    categorySlug:
      type: string
    categoryName:
      type: string
    commentCount:
      type: integer
      format: int64
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    lastActivityAt:
      type: string
      format: date-time
ProfileExtensionTab:
  type: object
  required:
  - extensionId
  - id
  - order
  - kind
  - url
  properties:
    extensionId:
      type: string
    id:
      type: string
    order:
      type: integer
    label:
      type: object
      additionalProperties:
        type: string
    icon:
      type: string
    kind:
      type: string
      enum:
      - extensionRoute
      - hostLink
    method:
      type: string
    url:
      type: string
UpdateProfileRequest:
  type: object
  description: All fields optional. Omitted fields are left unchanged.
  properties:
    bio:
      type: string
      maxLength: 500
    signature:
      type: string
      maxLength: 200
    location:
      type: string
      maxLength: 100
    websiteUrl:
      type: string
      maxLength: 200
    avatarAttachmentId:
      type:
      - integer
      - 'null'
      format: int64
ApiResponseProfile:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/Profile"
ApiResponsePublicProfile:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/PublicProfile"
ActivityPage:
  type: object
  required:
  - items
  - page
  - perPage
  - total
  - hasMore
  - kind
  properties:
    items:
      type: array
      items:
        "$ref": "#/ProfileActivity"
    page:
      type: integer
      minimum: 1
    perPage:
      type: integer
      minimum: 1
      maximum: 50
    total:
      type: integer
      format: int64
      description: Public total for the requested kind (topicCount or commentCount).
    hasMore:
      type: boolean
    kind:
      type: string
      enum: [topic, comment]
ApiResponseActivityPage:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/ActivityPage"
