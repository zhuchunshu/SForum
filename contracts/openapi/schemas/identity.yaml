ApiResponseCurrentUser:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/CurrentUser"
ApiResponseRegistrationStatus:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/RegistrationStatus"
ApiResponseRole:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/Role"
ApiResponseRoleList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: array
      items:
        "$ref": "#/Role"
RoleSuggestion:
  type: object
  allOf:
  - if:
      properties:
        approvalState:
          enum:
          - pending
          - rejected
      required:
      - approvalState
    then:
      properties:
        applied:
          const: false
  required:
  - id
  - permissionKey
  - ownerExtensionId
  - extensionVersionId
  - extensionVersion
  - packageDigest
  - permissionContractVersion
  - declarationDigest
  - roleKey
  - approvalState
  - applied
  - revision
  - createdAt
  - updatedAt
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
    permissionKey:
      type: string
    ownerExtensionId:
      type: string
    extensionVersionId:
      type: integer
      format: int64
      minimum: 1
    extensionVersion:
      type: string
    packageDigest:
      type: string
      pattern: '^[a-f0-9]{64}$'
    permissionContractVersion:
      type: string
    declarationDigest:
      type: string
      pattern: '^[a-f0-9]{64}$'
    roleKey:
      type: string
    approvalState:
      type: string
      enum:
      - pending
      - approved
      - rejected
    applied:
      type: boolean
      description: True only when immutable Host grant evidence exists.
    revision:
      type: integer
      format: int64
      minimum: 1
    decidedByUserId:
      type: integer
      format: int64
      minimum: 1
    decisionAuditEventId:
      type: integer
      format: int64
      minimum: 1
    decidedAt:
      type: string
      format: date-time
    appliedByUserId:
      type: integer
      format: int64
      minimum: 1
    appliedAuditEventId:
      type: integer
      format: int64
      minimum: 1
    appliedAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
RoleSuggestionPage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      maxItems: 100
      items:
        "$ref": "#/RoleSuggestion"
    nextCursor:
      type: string
RoleSuggestionDecisionInput:
  type: object
  additionalProperties: false
  required:
  - expectedRevision
  - approvalState
  properties:
    expectedRevision:
      type: integer
      format: int64
      minimum: 1
    approvalState:
      type: string
      enum:
      - approved
      - rejected
ApiResponseRoleSuggestion:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/RoleSuggestion"
ApiResponseRoleSuggestionPage:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/RoleSuggestionPage"
ApiResponsePermissionList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: array
      items:
        "$ref": "#/Permission"
ApiResponsePermissionMatrix:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/PermissionMatrix"
ApiResponseAdminUserList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/AdminUserList"
ApiResponseAdminUserDetail:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/AdminUserDetail"
ApiResponseAltchaChallenge:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/AltchaChallenge"
CurrentUser:
  type: object
  required:
  - id
  - username
  - displayName
  - locale
  - status
  - isInitialSuperAdmin
  - avatar
  - roleKeys
  - permissions
  properties:
    id:
      type: integer
      format: int64
    username:
      type: string
    displayName:
      type: string
    locale:
      type: string
    status:
      type: string
      enum:
      - active
      - disabled
      - banned
    isInitialSuperAdmin:
      type: boolean
    avatar:
      "$ref": "../schemas/profile.yaml#/AvatarView"
    roleKeys:
      type: array
      items:
        type: string
    permissions:
      type: array
      items:
        type: string
RegistrationStatus:
  type: object
  required:
  - nextUserIsInitialSuperAdmin
  - registrationEnabled
  properties:
    nextUserIsInitialSuperAdmin:
      type: boolean
      description: Always false on the public endpoint to avoid leaking the bootstrap window.
    registrationEnabled:
      type: boolean
      description: Whether the UI should offer registration. Forced true when no users exist yet (bootstrap); otherwise follows identity.registration.enabled.
RegisterRequest:
  type: object
  required:
  - username
  - email
  - password
  properties:
    username:
      type: string
      minLength: 1
      description: Trimmed username. Must not be blank.
    email:
      type: string
      format: email
      description: Trimmed email address. Must not be blank.
    password:
      type: string
      format: password
      minLength: 12
      description: Must contain at least 12 characters.
    displayName:
      type: string
      description: Optional display name. Blank values default to username.
    locale:
      type: string
    humanVerification:
      "$ref": "#/HumanVerification"
      description: Required when the deployment enables human verification for registration.
HumanVerification:
  type: object
  required:
  - provider
  - token
  properties:
    provider:
      type: string
      enum:
      - altcha
    token:
      type: string
      description: Base64-encoded ALTCHA payload emitted by the widget.
AltchaChallenge:
  type: object
  required:
  - parameters
  properties:
    parameters:
      type: object
      required:
      - algorithm
      - nonce
      - salt
      - cost
      - keyLength
      - keyPrefix
      properties:
        algorithm:
          type: string
          examples:
          - PBKDF2/SHA-256
        nonce:
          type: string
        salt:
          type: string
        cost:
          type: integer
        keyLength:
          type: integer
        keyPrefix:
          type: string
        keySignature:
          type: string
        memoryCost:
          type: integer
        parallelism:
          type: integer
        expiresAt:
          type: integer
          format: int64
        data:
          type: object
          additionalProperties: true
    signature:
      type: string
LoginRequest:
  type: object
  required:
  - login
  - password
  properties:
    login:
      type: string
      description: Username or email address.
    password:
      type: string
      format: password
    humanVerification:
      "$ref": "#/HumanVerification"
      description: Required only after the account-level risk threshold is reached and the password is correct.
Role:
  type: object
  required:
  - id
  - key
  - alias
  - description
  - isSystem
  - isDefault
  - isDeletable
  - isEnabled
  - permissionKeys
  properties:
    id:
      type: integer
      format: int64
    key:
      type: string
    alias:
      type: string
    description:
      type: string
    isSystem:
      type: boolean
    isDefault:
      type: boolean
    isDeletable:
      type: boolean
    isEnabled:
      type: boolean
    permissionKeys:
      type: array
      items:
        type: string
RoleCreateInput:
  type: object
  required:
  - key
  - alias
  properties:
    key:
      type: string
      minLength: 1
      pattern: "^[a-z0-9_.-]+$"
      description: Stable role key used in URLs. Trimmed value may contain lowercase letters, numbers, dots, hyphens, or underscores.
    alias:
      type: string
      minLength: 1
      description: Display name shown to administrators and users. Trimmed value must not be blank.
    description:
      type: string
      description: Optional role description.
RoleUpdateInput:
  type: object
  required:
  - alias
  properties:
    alias:
      type: string
      minLength: 1
      description: Display name shown to administrators and users. Trimmed value must not be blank.
    description:
      type: string
      description: Optional role description.
Permission:
  type: object
  required:
  - key
  - module
  - description
  properties:
    key:
      type: string
    module:
      type: string
    description:
      type: string
RolePermissionSet:
  type: object
  required:
  - roleKey
  - permissionKeys
  properties:
    roleKey:
      type: string
    permissionKeys:
      type: array
      items:
        type: string
PermissionMatrix:
  type: object
  required:
  - permissions
  - roles
  properties:
    permissions:
      type: array
      items:
        "$ref": "#/Permission"
    roles:
      type: array
      items:
        "$ref": "#/RolePermissionSet"
PermissionOverrides:
  type: object
  required:
  - allow
  - deny
  properties:
    allow:
      type: array
      items:
        type: string
    deny:
      type: array
      items:
        type: string
AdminUserSummary:
  type: object
  required:
  - id
  - username
  - email
  - displayName
  - locale
  - status
  - isInitialSuperAdmin
  - roleKeys
  - createdAt
  - updatedAt
  properties:
    id:
      type: integer
      format: int64
    username:
      type: string
    email:
      type: string
      format: email
    displayName:
      type: string
    locale:
      type: string
    status:
      type: string
      enum:
      - active
      - disabled
      - banned
    isInitialSuperAdmin:
      type: boolean
    roleKeys:
      type: array
      items:
        type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
AdminUserProfile:
  type: object
  required:
  - bio
  - signature
  - location
  - websiteUrl
  properties:
    bio:
      type: string
    signature:
      type: string
    location:
      type: string
    websiteUrl:
      type: string
AdminUserDetail:
  allOf:
  - "$ref": "#/AdminUserSummary"
  - type: object
    required:
    - permissions
    - permissionOverrides
    - profile
    properties:
      permissions:
        type: array
        items:
          type: string
      permissionOverrides:
        "$ref": "#/PermissionOverrides"
      profile:
        "$ref": "#/AdminUserProfile"
AdminUserList:
  type: object
  required:
  - items
  - total
  - page
  - perPage
  properties:
    items:
      type: array
      items:
        "$ref": "#/AdminUserSummary"
    total:
      type: integer
      format: int64
    page:
      type: integer
    perPage:
      type: integer
AdminUpdateUserInput:
  type: object
  description: |
    Partial admin update for a user account and public profile.
    Omitted fields are left unchanged. Requires `user.manage`;
    setting status to `banned` also requires `user.ban`.
  properties:
    username:
      type: string
    email:
      type: string
      format: email
    displayName:
      type: string
    locale:
      type: string
      enum:
      - zh-CN
      - en-US
    status:
      type: string
      enum:
      - active
      - disabled
      - banned
    bio:
      type: string
      maxLength: 500
    signature:
      type: string
      maxLength: 200
    location:
      type: string
      maxLength: 100
    websiteUrl:
      type: string
      maxLength: 200
UserRolesInput:
  type: object
  required:
  - roleKeys
  properties:
    roleKeys:
      type: array
      items:
        type: string
UserPermissionOverridesInput:
  "$ref": "#/PermissionOverrides"
PasswordResetRequest:
  type: object
  required:
  - email
  properties:
    email:
      type: string
      format: email
    humanVerification:
      "$ref": "#/HumanVerification"
PasswordResetConfirmRequest:
  type: object
  required:
  - token
  - newPassword
  properties:
    token:
      type: string
    newPassword:
      type: string
      minLength: 12
ApiResponsePasswordResetSent:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: object
      required:
      - sent
      properties:
        sent:
          type: boolean
ApiResponsePasswordResetConfirmed:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: object
      required:
      - reset
      properties:
        reset:
          type: boolean

# 账号安全 / 登录设备管理。opaque 会话标识，非认证凭证，仅用于指定下线哪一条。
LoginSession:
  type: object
  required:
  - id
  - deviceName
  - browser
  - os
  - ipPrefix
  - createdAt
  - lastSeenAt
  - isCurrent
  properties:
    id:
      type: string
      description: Opaque session id (not an auth credential). Used to target a device for revocation.
    deviceName:
      type: string
      description: Display name parsed from User-Agent, e.g. "Chrome on macOS".
    browser:
      type: string
    os:
      type: string
    ipPrefix:
      type: string
      description: Masked IP prefix, e.g. "1.2.3.*".
    createdAt:
      type: string
      format: date-time
    lastSeenAt:
      type: string
      format: date-time
    isCurrent:
      type: boolean
      description: Whether this is the device making the current request.
    revokedAt:
      type: string
      format: date-time
      nullable: true
      description: Present (in history view) when the session has been revoked.
    revokeReason:
      type: string
      description: Why the session was revoked (logout / revoke_device / revoke_others / max_exceeded / password_reset).
LoginSessionList:
  type: object
  required:
  - items
  - total
  - page
  - perPage
  properties:
    items:
      type: array
      items:
        "$ref": "#/LoginSession"
    total:
      type: integer
    page:
      type: integer
    perPage:
      type: integer
ApiResponseLoginSessionList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/LoginSessionList"
ApiResponseRevokeOthers:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: object
      required:
      - revoked
      properties:
        revoked:
          type: integer
          description: Number of other sessions that were revoked.
APIToken:
  type: object
  required: [id, publicId, name, scopes, prefix, createdAt]
  properties:
    id: { type: integer, format: int64 }
    publicId: { type: string }
    name: { type: string }
    scopes: { type: array, items: { type: string } }
    prefix: { type: string }
    lastUsedAt: { type: string, format: date-time }
    expiresAt: { type: string, format: date-time }
    revokedAt: { type: string, format: date-time }
    createdAt: { type: string, format: date-time }
CreatedAPIToken:
  allOf:
  - "$ref": "#/APIToken"
  - type: object
    required: [token]
    properties:
      token:
        type: string
        description: One-time plaintext secret (sft_<publicId>.<secret>).
CreateAPITokenRequest:
  type: object
  required: [name, scopes]
  properties:
    name: { type: string, maxLength: 80 }
    scopes: { type: array, items: { type: string }, minItems: 1 }
    expiresAt: { type: string, format: date-time }
ApiResponseAPITokenList:
  type: object
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { "$ref": "#/APIToken" } }
ApiResponseCreatedAPIToken:
  type: object
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data: { "$ref": "#/CreatedAPIToken" }

ClearUserClientIPsResult:
  type: object
  required: [sessionsCleared, topicsCleared, commentsCleared]
  properties:
    sessionsCleared:
      type: integer
    topicsCleared:
      type: integer
    commentsCleared:
      type: integer
ApiResponseClearUserClientIPs:
  type: object
  required: [code, message, data]
  properties:
    code: {type: integer}
    message: {type: string}
    data: {$ref: "#/ClearUserClientIPsResult"}
