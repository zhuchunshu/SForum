ApiResponseWebOption:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/WebOption"
ApiResponseWebOptionList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: array
      items:
        "$ref": "#/WebOption"
ApiResponseAdminWebOptionList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: array
      items:
        "$ref": "#/AdminWebOption"
WebOption:
  type: object
  required:
  - name
  - value
  properties:
    name:
      type: string
      examples:
      - site.name
    value:
      type: string
