ExtensionManifestAdminSurface:
  type: object
  required: [id, contractVersion, kind, action, label]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    kind:
      type: string
      enum: [navigation, dashboard, list_column, list_filter, row_action, bulk_action, form, notice, editor_panel, detail_region, importer, exporter]
    action: { type: string, enum: [add, before, after, wrap, replace, hide, filter] }
    targetId: { type: string }
    placementId:
      type: string
      description: Exact stable Core admin page identity that owns this contribution placement.
    placementContractVersion: { type: string }
    label: { type: string }
    handler: { type: string }
    propsSchema: { type: string }
    resultSchema: { type: string }
    operation:
      type: string
      enum: [query, command]
      description: Command invocations require an Idempotency-Key and always receive actor delegation.
    schema: { type: string }
    permission: { type: string }
    priority: { type: integer }
ExtensionManifestQuery:
  type: object
  additionalProperties: false
  required: [id, contractVersion, entity, planVersion, fields, pagination, resultSchema, permissionPolicy]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    entity: { type: string }
    planVersion: { type: string }
    fields:
      type: array
      items: { type: string }
    relations:
      type: array
      items: { type: string }
    filters:
      type: array
      items: { type: string }
    sort:
      type: array
      items: { type: string }
    pagination: { type: string, enum: [none, offset, cursor] }
    resultSchema: { type: string }
    permissionPolicy: { type: string }
    cacheTags:
      type: array
      items: { type: string }
    handler:
      type: string
      description: Explicit Protocol V2 execution binding; omission keeps the query declaration-only.
    identityFields:
      type: array
      maxItems: 8
      uniqueItems: true
      items: { type: string }
    defaultSort:
      type: array
      maxItems: 16
      items: { "$ref": "#/ExtensionManifestQuerySort" }
ExtensionManifestQuerySort:
  type: object
  additionalProperties: false
  required: [field]
  properties:
    field: { type: string }
    descending: { type: boolean, default: false }
ExtensionManifestQueryResultFilterDependency:
  type: object
  additionalProperties: false
  required: [extensionId, versionConstraint]
  properties:
    extensionId: { type: string }
    versionConstraint: { type: string }
ExtensionManifestQueryResultFilter:
  type: object
  additionalProperties: false
  required: [id, contractVersion, queryId, queryContractVersion, queryPlanVersion, handler]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    queryId: { type: string }
    queryContractVersion: { type: string }
    queryPlanVersion: { type: string }
    handler: { type: string }
    priority: { type: integer, minimum: -1000000, maximum: 1000000 }
    failurePolicy: { type: string, enum: [fail_closed, fail_open], default: fail_closed }
    timeoutMs: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
    dependency: { "$ref": "#/ExtensionManifestQueryResultFilterDependency" }
ExtensionManifestIdentity:
  type: object
  required: [contractVersion]
  properties:
    contractVersion: { type: string }
    userFields:
      type: array
      items: { "$ref": "#/ExtensionManifestIdentityUserField" }
    providers:
      type: array
      items: { "$ref": "#/ExtensionManifestIdentityProvider" }
    sessionPolicy: { type: string }
    riskHooks:
      type: array
      items: { type: string }
ExtensionManifestIdentityUserField:
  type: object
  required: [id, contractVersion, type, schema]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    type: { type: string, enum: [string, number, boolean, object, array] }
    schema: { type: string }
    readPermission: { type: string }
    writePermission: { type: string }
ExtensionManifestIdentityProvider:
  type: object
  required: [id, contractVersion, kind, handler]
  description: A provider without operations remains inspect-only for Manifest V3 compatibility.
  properties:
    id: { type: string }
    contractVersion: { type: string }
    kind: { type: string, enum: [auth, profile, recovery, session, risk] }
    handler: { type: string }
    priority: { type: integer }
    operations:
      type: array
      maxItems: 16
      items: { "$ref": "#/ExtensionManifestIdentityProviderOperation" }
  allOf:
  - if: { properties: { kind: { const: auth } }, required: [kind] }
    then:
      properties:
        operations:
          items:
            properties:
              name: { enum: [registration.start, registration.complete, login.start, login.complete, link.start, link.complete] }
  - if: { properties: { kind: { const: profile } }, required: [kind] }
    then:
      properties:
        operations:
          items:
            properties:
              name: { enum: [sections.list, section.read, section.update, account.read, account.update] }
  - if: { properties: { kind: { const: recovery } }, required: [kind] }
    then:
      properties:
        operations:
          items:
            properties:
              name: { enum: [recovery.start, recovery.complete] }
  - if: { properties: { kind: { const: session } }, required: [kind] }
    then:
      properties:
        operations:
          items:
            properties:
              name: { const: session.evaluate }
  - if: { properties: { kind: { const: risk } }, required: [kind] }
    then:
      properties:
        operations:
          items:
            properties:
              name: { const: risk.evaluate }
ExtensionManifestIdentityProviderOperation:
  type: object
  required: [name, inputSchema, outputSchema]
  properties:
    name:
      type: string
      enum: [registration.start, registration.complete, login.start, login.complete, link.start, link.complete, sections.list, section.read, section.update, account.read, account.update, recovery.start, recovery.complete, session.evaluate, risk.evaluate]
    inputSchema: { type: string }
    outputSchema: { type: string }
    timeoutMs: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
    failurePolicy: { type: string, enum: [fail_closed, omit] }
  allOf:
  - if:
      required: [name]
      properties:
        name: { enum: [sections.list, section.read] }
    then:
      properties:
        failurePolicy: { const: omit }
  - if:
      required: [name]
      properties:
        name: { not: { enum: [sections.list, section.read] } }
    then:
      properties:
        failurePolicy: { const: fail_closed }
ExtensionManifestPermissionDefinition:
  type: object
  description: Recommended role mappings are advisory. assignmentPolicy=host prevents install or enable code from granting permissions.
  required: [key, contractVersion, label, description, assignmentPolicy]
  properties:
    key: { type: string }
    contractVersion: { type: string }
    label:
      oneOf:
      - type: string
      - type: object
        additionalProperties: { type: string }
        minProperties: 1
        description: Extension-owned locale map keyed by BCP 47 locale.
    description:
      oneOf:
      - type: string
      - type: object
        additionalProperties: { type: string }
        minProperties: 1
        description: Extension-owned locale map keyed by BCP 47 locale.
    recommendedRoles:
      type: array
      items: { type: string }
    assignmentPolicy: { type: string, const: host }
ExtensionManifestMediaPipeline:
  type: object
  required: [id, contractVersion, action, mimes, handler]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    action: { type: string, enum: [add, before, after, wrap, replace] }
    targetId: { type: string }
    mimes:
      type: array
      items: { type: string }
    transforms:
      type: array
      items: { "$ref": "#/ExtensionManifestMediaTransform" }
    handler: { type: string }
    permission: { type: string }
    priority: { type: integer }
ExtensionManifestMediaTransform:
  type: object
  required: [id, variant]
  properties:
    id: { type: string }
    variant: { type: string }
    format: { type: string }
    width: { type: integer, minimum: 0 }
    height: { type: integer, minimum: 0 }
ExtensionManifestNavigation:
  type: object
  required: [id, contractVersion, kind, action, label]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    kind: { type: string, enum: [menu, item, breadcrumb, header, footer, sidebar] }
    action: { type: string, enum: [add, before, after, wrap, replace, hide, filter] }
    targetId: { type: string }
    label: { type: string }
    href: { type: string }
    permission: { type: string }
    order: { type: integer, minimum: 0 }
ExtensionManifestRegion:
  type: object
  required: [id, contractVersion, action, kind, label]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    action: { type: string, enum: [add, before, after, wrap, replace, hide, filter] }
    targetId: { type: string }
    kind: { type: string, enum: [menu, widget, header, footer, sidebar, content] }
    label: { type: string }
    multiple: { type: boolean }
