ExtensionManifestGuard:
  type: object
  required: [id, contractVersion, kind, entry, digest]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    kind: { type: string, enum: [custom, raw_request] }
    entry: { type: string }
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    permissions:
      type: array
      items: { type: string }
ExtensionManifestSchedule:
  type: object
  required: [id, contractVersion, jobId, cron]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    jobId: { type: string }
    cron: { type: string }
    timezone: { type: string }
ExtensionManifestComponent:
  type: object
  required: [id, contractVersion, action]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    action:
      type: string
      enum: [add, before, after, wrap, replace, hide, filter_props, filter_result]
    targetId: { type: string }
    targetContractVersion:
      type: string
      description: Required with targetId; Core targets must exactly match the Host catalog contract.
    priority: { type: integer }
    ssrTemplate: { type: string }
    l2Component: { type: string }
    propsSchema: { type: string }
    resultSchema: { type: string }
    themeOverrideKey: { type: string }
  allOf:
    - if: { required: [targetId] }
      then: { required: [targetContractVersion] }
    - if: { required: [targetContractVersion] }
      then: { required: [targetId] }
ExtensionManifestTemplate:
  type: object
  required: [id, contractVersion, action, path, digest, viewModelSchema]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    action: { type: string, enum: [add, replace] }
    targetId: { type: string }
    path: { type: string }
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    viewModelSchema: { type: string }
    themeOverrideKey: { type: string }
ExtensionManifestAsset:
  type: object
  required: [handle, contractVersion, type, path, digest]
  properties:
    handle: { type: string }
    contractVersion: { type: string }
    type: { type: string, enum: [script, style] }
    path: { type: string }
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    dependencies:
      type: array
      items: { type: string }
    scope:
      type: array
      items: { type: string }
    module: { type: boolean }
    loading: { type: string, enum: [blocking, defer, async, preload] }
    integrity: { type: string }
    csp:
      type: array
      items: { type: string }
ExtensionManifestContent:
  type: object
  required: [id, contractVersion, kind, schema]
  anyOf:
  - required: [handler]
  - required: [renderer]
  properties:
    id:
      type: string
      maxLength: 81
      pattern: '^[a-z0-9][a-z0-9._-]{1,80}$'
    contractVersion:
      type: string
      maxLength: 256
      pattern: '^[a-z0-9][a-z0-9._-]*@[1-9][0-9]*$'
    kind:
      type: string
      enum: [block, shortcode, embed, node, mark, render_filter, sanitizer]
    handler:
      type: string
      minLength: 1
      maxLength: 256
      description: Requires an executable backend entry.
      allOf:
      - not: { pattern: '://' }
      - not: { pattern: '\.\.' }
      - not: { pattern: '[\x00-\x1f\x7f]' }
    schema:
      type: string
      minLength: 1
      maxLength: 256
      anyOf:
      - pattern: '^[a-z0-9][a-z0-9._-]*@[1-9][0-9]*$'
      - allOf:
        - pattern: '^[^/].*\.json$'
        - not: { pattern: '(^|/)\.\.(/|$)' }
        - not: { pattern: '(^|/)\.(/|$)' }
        - not: { pattern: '//' }
        - not: { pattern: '\\' }
    renderer:
      type: string
      minLength: 2
      maxLength: 81
      pattern: '^[a-z0-9][a-z0-9._-]{1,80}$'
    migration:
      type: string
      minLength: 2
      maxLength: 81
      pattern: '^[a-z0-9][a-z0-9._-]{1,80}$'
ExtensionManifestDatabase:
  type: object
  required: [contractVersion, backup, retention]
  oneOf:
  - required: [authority]
    not:
      required: [grants]
  - required: [grants]
    not:
      required: [authority]
  properties:
    contractVersion: { type: string }
    authority:
      type: string
      deprecated: true
      description: Legacy cumulative compatibility input. New manifests use grants.
      enum: [own_schema, core_views, host_commands, raw_core, kernel]
    grants:
      type: array
      minItems: 1
      maxItems: 5
      uniqueItems: true
      description: Exact additive database grant set bound by exact-artifact trust.
      items:
        type: string
        enum: [own_schema, core_views, host_commands, raw_core, kernel]
    schema: { type: string }
    role: { type: string }
    coreCompatibility: { type: string }
    backup:
      type: object
      required: [required]
      properties:
        required: { type: boolean }
        strategy: { type: string }
    retention:
      type: object
      required: [onDisable, onUninstall]
      properties:
        onDisable: { type: string, enum: [retain] }
        onUninstall: { type: string, enum: [retain, delete, export] }
        days: { type: integer, minimum: 0 }
    operations:
      type: array
      items: { "$ref": "#/ExtensionManifestDatabaseOperation" }
ExtensionManifestDatabaseOperation:
  type: object
  additionalProperties: false
  required: [id, statementVersion, kind, path, digest, parameters, columns, timeoutMs]
  properties:
    id: { type: string }
    statementVersion: { type: string, pattern: '^[1-9][0-9]*$' }
    kind: { type: string, enum: [query, execute] }
    path: { type: string }
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    parameters:
      type: array
      maxItems: 32
      items: { "$ref": "#/ExtensionManifestDatabaseParameter" }
    resultSchema: { type: string }
    columns:
      type: array
      maxItems: 64
      items: { "$ref": "#/ExtensionManifestDatabaseColumn" }
    maxRows: { type: integer, minimum: 1, maximum: 1000 }
    maxAffectedRows: { type: integer, minimum: 1, maximum: 10000 }
    queryInvalidationTags:
      type: array
      maxItems: 32
      uniqueItems: true
      description: Owner-scoped logical Query Registry tags invalidated transactionally after execute operations.
      items: { type: string }
    timeoutMs: { type: integer, minimum: 0, maximum: 5000 }
  allOf:
  - if:
      properties: { kind: { const: query } }
      required: [kind]
    then:
      required: [resultSchema, maxRows]
      not:
        anyOf:
        - required: [maxAffectedRows]
        - required: [queryInvalidationTags]
      properties: { columns: { minItems: 1 } }
    else:
      required: [maxAffectedRows]
      not: { required: [maxRows] }
ExtensionManifestDatabaseParameter:
  type: object
  additionalProperties: false
  required: [schema, field, kind, nullable, maxBytes]
  properties:
    schema: { type: string }
    field: { type: string }
    kind: { type: string, enum: [string, int64, number, bool] }
    nullable: { type: boolean }
    maxBytes: { type: integer, minimum: 0, maximum: 65536 }
ExtensionManifestDatabaseColumn:
  type: object
  additionalProperties: false
  required: [name, nullable]
  properties:
    name: { type: string }
    nullable: { type: boolean }
ExtensionManifestCache:
  type: object
  required: [id, contractVersion, namespace, policy]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    namespace: { type: string }
    policy: { type: string, enum: [private, actor, permission, public] }
    tags:
      type: array
      items: { type: string }
    provider: { type: string }
    invalidators:
      type: array
      items: { type: string }
ExtensionManifestSEO:
  type: object
  description: Typed executable contribution to sforum.seo-registry@1; Host final SEO policy remains authoritative.
  required: [id, contractVersion, scope, kind, action, handler, failurePolicy]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    scope: { type: string, description: Stable page/route id or global. }
    kind: { type: string, enum: [title, meta, canonical, robots, hreflang, sitemap, jsonld] }
    action: { type: string, enum: [add, filter, replace] }
    handler: { type: string }
    priority: { type: integer, minimum: -1000000, maximum: 1000000 }
    failurePolicy: { type: string, enum: [fail_closed, fallback] }
    timeoutMs: { type: integer, minimum: 1, maximum: 5000, default: 500 }
ExtensionManifestService:
  type: object
  required: [id, contractVersion, action, handler, requestSchema, responseSchema]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    action: { type: string, enum: [add, before, after, wrap, replace] }
    targetId: { type: string }
    handler: { type: string }
    requestSchema: { type: string }
    responseSchema: { type: string }
    priority: { type: integer }
ExtensionManifestCommand:
  type: object
  required: [id, contractVersion, handler, inputSchema, resultSchema]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    handler: { type: string }
    permission: { type: string }
    inputSchema: { type: string }
    resultSchema: { type: string }
    description: { type: string }
    recoverySafe:
      type: boolean
      default: false
      description: Explicitly permits this exact trusted command in Safe Mode.
    timeoutMs: { type: integer, minimum: 1, maximum: 5000, default: 5000 }
ExtensionManifestDependency:
  type: object
  required: [version, kind]
  description: Exactly one of id or capability is used for required, optional, and conflict. Provides uses capability plus an exact semantic version.
  properties:
    id: { type: string }
    capability: { type: string }
    version: { type: string }
    kind: { type: string, enum: [required, optional, conflict, provides] }
ExtensionManifestLifecycle:
  type: object
  required: [contractVersion]
  properties:
    contractVersion: { type: string }
    install: { "$ref": "#/ExtensionManifestLifecycleOperation" }
    enable: { "$ref": "#/ExtensionManifestLifecycleOperation" }
    disable: { "$ref": "#/ExtensionManifestLifecycleOperation" }
    upgrade: { "$ref": "#/ExtensionManifestLifecycleOperation" }
    rollback: { "$ref": "#/ExtensionManifestLifecycleOperation" }
    uninstall: { "$ref": "#/ExtensionManifestLifecycleOperation" }
ExtensionManifestLifecycleOperation:
  type: object
  required: [plan, execute, progressSchema, checkpointSchema]
  properties:
    plan: { type: string }
    execute: { type: string }
    progressSchema: { type: string }
    checkpointSchema: { type: string }
ExtensionManifestOpenAPIFragment:
  type: object
  required: [id, contractVersion, path, digest, namespace]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    path: { type: string }
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    namespace: { type: string }
ExtensionManifestPackageFile:
  type: object
  required: [id, kind, path, digest]
  properties:
    id: { type: string }
    kind:
      type: string
      enum: [executable, frontend, locale, schema, migration, template, asset, openapi]
    path: { type: string }
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    locale: { type: string }
    version: { type: string }
ExtensionManifestIncludes:
  type: object
  description: Package-relative JSON files or directories. Root and include declarations for the same family are mutually exclusive.
  additionalProperties: false
  properties:
    langs: { "$ref": "#/ExtensionManifestInclude" }
    settings: { "$ref": "#/ExtensionManifestInclude" }
    contributions: { "$ref": "#/ExtensionManifestInclude" }
    admin: { "$ref": "#/ExtensionManifestInclude" }
    events: { "$ref": "#/ExtensionManifestInclude" }
    routes: { "$ref": "#/ExtensionManifestInclude" }
    jobs: { "$ref": "#/ExtensionManifestInclude" }
    migrations: { "$ref": "#/ExtensionManifestInclude" }
    permissions: { "$ref": "#/ExtensionManifestInclude" }
    hooks: { "$ref": "#/ExtensionManifestInclude" }
    providers: { "$ref": "#/ExtensionManifestInclude" }
    adminPages: { "$ref": "#/ExtensionManifestInclude" }
    guards: { "$ref": "#/ExtensionManifestInclude" }
    schedules: { "$ref": "#/ExtensionManifestInclude" }
    components: { "$ref": "#/ExtensionManifestInclude" }
    templates: { "$ref": "#/ExtensionManifestInclude" }
    assets: { "$ref": "#/ExtensionManifestInclude" }
    content: { "$ref": "#/ExtensionManifestInclude" }
    database: { "$ref": "#/ExtensionManifestInclude" }
    cache: { "$ref": "#/ExtensionManifestInclude" }
    seo: { "$ref": "#/ExtensionManifestInclude" }
    services: { "$ref": "#/ExtensionManifestInclude" }
    commands: { "$ref": "#/ExtensionManifestInclude" }
    adminSurfaces: { "$ref": "#/ExtensionManifestInclude" }
    queries: { "$ref": "#/ExtensionManifestInclude" }
    queryResultFilters: { "$ref": "#/ExtensionManifestInclude" }
    identity: { "$ref": "#/ExtensionManifestInclude" }
    permissionDefinitions: { "$ref": "#/ExtensionManifestInclude" }
    media: { "$ref": "#/ExtensionManifestInclude" }
    navigation: { "$ref": "#/ExtensionManifestInclude" }
    regions: { "$ref": "#/ExtensionManifestInclude" }
    dependencies: { "$ref": "#/ExtensionManifestInclude" }
    lifecycle: { "$ref": "#/ExtensionManifestInclude" }
    openapi: { "$ref": "#/ExtensionManifestInclude" }
    packageFiles: { "$ref": "#/ExtensionManifestInclude" }
ExtensionManifestInclude:
  oneOf:
  - type: string
  - type: array
    minItems: 1
    items: { type: string }
