ExtensionManifestGuard:
  type: object
  required: [id, contractVersion, kind, entry, digest]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    kind: { type: string, enum: [custom, raw_request] }
    entry: { type: string }
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    permissions:
      type: array
      items: { type: string }
ExtensionManifestSchedule:
  type: object
  required: [id, contractVersion, jobId, cron]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    jobId: { type: string }
    cron: { type: string }
    timezone: { type: string }
ExtensionManifestComponent:
  type: object
  required: [id, contractVersion, action]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    action:
      type: string
      enum: [add, before, after, wrap, replace, hide, filter_props, filter_result]
    targetId: { type: string }
    priority: { type: integer }
    ssrTemplate: { type: string }
    l2Component: { type: string }
    propsSchema: { type: string }
    resultSchema: { type: string }
    themeOverrideKey: { type: string }
ExtensionManifestTemplate:
  type: object
  required: [id, contractVersion, action, path, digest, viewModelSchema]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    action: { type: string, enum: [add, replace] }
    targetId: { type: string }
    path: { type: string }
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    viewModelSchema: { type: string }
    themeOverrideKey: { type: string }
ExtensionManifestAsset:
  type: object
  required: [handle, contractVersion, type, path, digest]
  properties:
    handle: { type: string }
    contractVersion: { type: string }
    type: { type: string, enum: [script, style] }
    path: { type: string }
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    dependencies:
      type: array
      items: { type: string }
    scope:
      type: array
      items: { type: string }
    module: { type: boolean }
    loading: { type: string, enum: [blocking, defer, async, preload] }
    integrity: { type: string }
    csp:
      type: array
      items: { type: string }
ExtensionManifestContent:
  type: object
  required: [id, contractVersion, kind, schema]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    kind:
      type: string
      enum: [block, shortcode, embed, node, mark, render_filter, sanitizer]
    handler: { type: string }
    schema: { type: string }
    renderer: { type: string }
    migration: { type: string }
ExtensionManifestDatabase:
  type: object
  required: [contractVersion, authority, backup, retention]
  properties:
    contractVersion: { type: string }
    authority:
      type: string
      enum: [own_schema, core_views, host_commands, raw_core, kernel]
    schema: { type: string }
    role: { type: string }
    coreCompatibility: { type: string }
    backup:
      type: object
      required: [required]
      properties:
        required: { type: boolean }
        strategy: { type: string }
    retention:
      type: object
      required: [onDisable, onUninstall]
      properties:
        onDisable: { type: string, enum: [retain] }
        onUninstall: { type: string, enum: [retain, delete, export] }
        days: { type: integer, minimum: 0 }
ExtensionManifestCache:
  type: object
  required: [id, contractVersion, namespace, policy]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    namespace: { type: string }
    policy: { type: string, enum: [private, actor, permission, public] }
    tags:
      type: array
      items: { type: string }
    provider: { type: string }
    invalidators:
      type: array
      items: { type: string }
ExtensionManifestService:
  type: object
  required: [id, contractVersion, action, handler, requestSchema, responseSchema]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    action: { type: string, enum: [add, before, after, wrap, replace] }
    targetId: { type: string }
    handler: { type: string }
    requestSchema: { type: string }
    responseSchema: { type: string }
    priority: { type: integer }
ExtensionManifestCommand:
  type: object
  required: [id, contractVersion, handler, inputSchema, resultSchema]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    handler: { type: string }
    permission: { type: string }
    inputSchema: { type: string }
    resultSchema: { type: string }
ExtensionManifestDependency:
  type: object
  required: [version, kind]
  description: Exactly one of id or capability is used for required, optional, and conflict. Provides uses capability plus an exact semantic version.
  properties:
    id: { type: string }
    capability: { type: string }
    version: { type: string }
    kind: { type: string, enum: [required, optional, conflict, provides] }
ExtensionManifestLifecycle:
  type: object
  required: [contractVersion]
  properties:
    contractVersion: { type: string }
    install: { "$ref": "#/ExtensionManifestLifecycleOperation" }
    enable: { "$ref": "#/ExtensionManifestLifecycleOperation" }
    disable: { "$ref": "#/ExtensionManifestLifecycleOperation" }
    upgrade: { "$ref": "#/ExtensionManifestLifecycleOperation" }
    rollback: { "$ref": "#/ExtensionManifestLifecycleOperation" }
    uninstall: { "$ref": "#/ExtensionManifestLifecycleOperation" }
ExtensionManifestLifecycleOperation:
  type: object
  required: [plan, execute, progressSchema, checkpointSchema]
  properties:
    plan: { type: string }
    execute: { type: string }
    progressSchema: { type: string }
    checkpointSchema: { type: string }
ExtensionManifestOpenAPIFragment:
  type: object
  required: [id, contractVersion, path, digest, namespace]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    path: { type: string }
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    namespace: { type: string }
ExtensionManifestPackageFile:
  type: object
  required: [id, kind, path, digest]
  properties:
    id: { type: string }
    kind:
      type: string
      enum: [executable, frontend, locale, schema, migration, template, asset, openapi]
    path: { type: string }
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    locale: { type: string }
    version: { type: string }
ExtensionManifestIncludes:
  type: object
  description: Package-relative JSON files or directories. Root and include declarations for the same family are mutually exclusive.
  additionalProperties: false
  properties:
    langs: { "$ref": "#/ExtensionManifestInclude" }
    settings: { "$ref": "#/ExtensionManifestInclude" }
    contributions: { "$ref": "#/ExtensionManifestInclude" }
    admin: { "$ref": "#/ExtensionManifestInclude" }
    events: { "$ref": "#/ExtensionManifestInclude" }
    routes: { "$ref": "#/ExtensionManifestInclude" }
    jobs: { "$ref": "#/ExtensionManifestInclude" }
    migrations: { "$ref": "#/ExtensionManifestInclude" }
    permissions: { "$ref": "#/ExtensionManifestInclude" }
    hooks: { "$ref": "#/ExtensionManifestInclude" }
    providers: { "$ref": "#/ExtensionManifestInclude" }
    adminPages: { "$ref": "#/ExtensionManifestInclude" }
    guards: { "$ref": "#/ExtensionManifestInclude" }
    schedules: { "$ref": "#/ExtensionManifestInclude" }
    components: { "$ref": "#/ExtensionManifestInclude" }
    templates: { "$ref": "#/ExtensionManifestInclude" }
    assets: { "$ref": "#/ExtensionManifestInclude" }
    content: { "$ref": "#/ExtensionManifestInclude" }
    database: { "$ref": "#/ExtensionManifestInclude" }
    cache: { "$ref": "#/ExtensionManifestInclude" }
    services: { "$ref": "#/ExtensionManifestInclude" }
    commands: { "$ref": "#/ExtensionManifestInclude" }
    adminSurfaces: { "$ref": "#/ExtensionManifestInclude" }
    queries: { "$ref": "#/ExtensionManifestInclude" }
    identity: { "$ref": "#/ExtensionManifestInclude" }
    permissionDefinitions: { "$ref": "#/ExtensionManifestInclude" }
    media: { "$ref": "#/ExtensionManifestInclude" }
    navigation: { "$ref": "#/ExtensionManifestInclude" }
    regions: { "$ref": "#/ExtensionManifestInclude" }
    dependencies: { "$ref": "#/ExtensionManifestInclude" }
    lifecycle: { "$ref": "#/ExtensionManifestInclude" }
    openapi: { "$ref": "#/ExtensionManifestInclude" }
    packageFiles: { "$ref": "#/ExtensionManifestInclude" }
ExtensionManifestInclude:
  oneOf:
  - type: string
  - type: array
    minItems: 1
    items: { type: string }
