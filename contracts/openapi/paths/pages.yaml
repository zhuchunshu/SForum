pagesCatalog:
  get:
    summary: Public page catalog
    operationId: getPagesCatalog
    tags: [Pages]
    description: Lists core public page definitions (stable ids and path patterns).
    responses:
      '200':
        description: Page catalog list.
        content:
          application/json:
            schema:
              "$ref": "../schemas/pages.yaml#/ApiResponsePageCatalog"

pagesResolve:
  get:
    summary: Resolve page provider
    operationId: resolvePage
    tags: [Pages]
    description: |
      Resolves a core catalog page id. After access checks, may invoke the host
      loader gateway for plugin dataSource (loopback only; no Cookie/Authorization).
    parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
          example: forum.home
    responses:
      '200':
        description: Resolved page provider (core or extension).
        content:
          application/json:
            schema:
              "$ref": "../schemas/pages.yaml#/ApiResponsePageResolve"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"

pagesResolvePath:
  get:
    summary: Resolve added page by path
    operationId: resolvePageByPath
    tags: [Pages]
    description: |
      Deterministic match of Page Registry action=add contributions.
      Static routes beat params; params beat catch-all. Access is fail-closed.
    parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
          example: /demo-docs/hello
      - name: locale
        in: query
        required: false
        schema:
          type: string
    responses:
      '200':
        description: Matched add contribution with optional loader data.
        content:
          application/json:
            schema:
              "$ref": "../schemas/pages.yaml#/ApiResponsePageResolve"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: Guest-only page accessed while authenticated.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"

siteActiveThemeSkin:
  get:
    summary: Active theme L0 skin asset URLs
    operationId: getSiteActiveThemeSkin
    tags: [Pages]
    responses:
      '200':
        description: CSS and token URLs for the active theme skin.
        content:
          application/json:
            schema:
              "$ref": "../schemas/pages.yaml#/ApiResponseActiveThemeSkin"

adminPages:
  get:
    summary: Admin page provider list
    operationId: listAdminPages
    tags: [Pages]
    responses:
      '200':
        description: Core pages with active provider and candidates.
        content:
          application/json:
            schema:
              "$ref": "../schemas/pages.yaml#/ApiResponseAdminPageList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"

adminThemeActivationPreview:
  get:
    summary: Preview an exact theme activation
    operationId: previewAdminThemeActivation
    tags: [Pages]
    description: |
      Returns the exact target and current active-theme tuples plus every add or
      replace impact and conflict. Theme managers may activate presentation-only
      contributions. Core replacements require a separately explicit
      super_admin approval in the exact activation request.
    parameters:
      - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Exact activation preview and approval eligibility.
        content:
          application/json:
            schema:
              "$ref": "../schemas/pages.yaml#/ApiResponseThemeActivationPreview"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"

adminPageApprove:
  post:
    summary: Approve core page replace
    operationId: approveAdminPageReplace
    tags: [Pages]
    description: super_admin only. Binds extension contribution as provider for a replaceable core page.
    parameters:
      - "$ref": "../components/parameters.yaml#/PageID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/pages.yaml#/PageApproveRequest"
    responses:
      '200':
        description: Approval recorded.
        content:
          application/json:
            schema:
              "$ref": "../schemas/pages.yaml#/ApiResponsePageProviderMutation"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"

adminPageRestoreCore:
  post:
    summary: Restore core page provider
    operationId: restoreAdminPageCore
    tags: [Pages]
    parameters:
      - "$ref": "../components/parameters.yaml#/PageID"
    responses:
      '200':
        description: Provider restored to core.
        content:
          application/json:
            schema:
              "$ref": "../schemas/pages.yaml#/ApiResponsePageProviderMutation"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
