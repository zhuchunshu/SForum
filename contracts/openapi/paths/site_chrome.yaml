siteNavItems:
  get:
    summary: List public navigation items
    operationId: listSiteNavItems
    tags: [Site chrome]
    responses:
      '200':
        description: Operator-configured nav items plus optional forum.nav.items contributions (E2.3). Core/operator items first; theme appends extensionItems by order.
        content:
          application/json:
            schema:
              "$ref": "../schemas/site_chrome.yaml#/ApiResponseSiteNavItemList"

siteFriendLinks:
  get:
    summary: List public friend links
    operationId: listSiteFriendLinks
    tags: [Site chrome]
    responses:
      '200':
        description: Enabled friend links ordered by position.
        content:
          application/json:
            schema:
              "$ref": "../schemas/site_chrome.yaml#/ApiResponseSiteFriendLinkList"

siteAnnouncements:
  get:
    summary: List active public announcements
    operationId: listSiteAnnouncements
    tags: [Site chrome]
    responses:
      '200':
        description: Enabled announcements within the active time window.
        content:
          application/json:
            schema:
              "$ref": "../schemas/site_chrome.yaml#/ApiResponseSiteAnnouncementList"

adminSiteNavItems:
  get:
    summary: List all navigation items (admin)
    operationId: adminListSiteNavItems
    tags: [Site chrome]
    description: Requires settings.site.manage.
    responses:
      '200':
        description: All nav items including disabled.
        content:
          application/json:
            schema:
              "$ref": "../schemas/site_chrome.yaml#/ApiResponseSiteNavItemList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
  post:
    summary: Create a navigation item
    operationId: adminCreateSiteNavItem
    tags: [Site chrome]
    description: Requires settings.site.manage.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/site_chrome.yaml#/SiteNavItemInput"
    responses:
      '201':
        description: Created.
        content:
          application/json:
            schema:
              "$ref": "../schemas/site_chrome.yaml#/ApiResponseSiteNavItem"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"

adminSiteNavItemByID:
  patch:
    summary: Update a navigation item
    operationId: adminUpdateSiteNavItem
    tags: [Site chrome]
    description: Requires settings.site.manage.
    parameters:
      - name: itemID
        in: path
        required: true
        schema: { type: integer, format: int64 }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/site_chrome.yaml#/SiteNavItemUpdateInput"
    responses:
      '200':
        description: Updated.
        content:
          application/json:
            schema:
              "$ref": "../schemas/site_chrome.yaml#/ApiResponseSiteNavItem"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
  delete:
    summary: Delete a navigation item
    operationId: adminDeleteSiteNavItem
    tags: [Site chrome]
    description: Requires settings.site.manage.
    parameters:
      - name: itemID
        in: path
        required: true
        schema: { type: integer, format: int64 }
    responses:
      '200':
        description: Deleted.
        content:
          application/json:
            schema:
              "$ref": "../schemas/site_chrome.yaml#/ApiResponseSiteChromeDeleted"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"

