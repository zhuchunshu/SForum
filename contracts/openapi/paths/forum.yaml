        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
topicRevisionRestore:
  post:
    summary: Restore a topic revision as a new accepted version
    operationId: restoreTopicRevision
    description: Requires both `topic.revision.view_any` and `topic.edit_any`. The selected immutable payload is revalidated through current filters, moderation, taxonomy, attachment, cache, and search policy. It never rewrites history.
    security:
    - cookieAuth: []
    - bearerAuth: []
    parameters:
    - "$ref": "../components/parameters.yaml#/TopicID"
    - name: revisionNo
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    requestBody:
      required: true
      content:
        application/json:
          schema: { "$ref": "../schemas/forum.yaml#/RestoreRevisionRequest" }
    responses:
      '200':
        description: Restored topic with its newly allocated current revision.
        content:
          application/json:
            schema: { "$ref": "../schemas/forum.yaml#/ApiResponseTopicDetail" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '404': { "$ref": "../components/responses.yaml#/NotFound" }
      '409': { "$ref": "../components/responses.yaml#/Conflict" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
topicRevisionRedact:
  post:
