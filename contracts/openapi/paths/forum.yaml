    operationId: getTopicRevision
    description: |
      Requires `topic.revision.view_any`. Returns raw historical source only
      after the authoritative history permission check. Historical preview is
      rendered and sanitized on demand; derived HTML is not persisted in the
      revision ledger.
    security:
    - cookieAuth: []
    - bearerAuth: []
    parameters:
    - "$ref": "../components/parameters.yaml#/TopicID"
    - name: revisionNo
      in: path
      required: true
