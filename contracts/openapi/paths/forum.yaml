              "$ref": "../schemas/forum.yaml#/ApiResponseTopicDetail"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
topicRevisions:
  get:
    summary: List topic revision summaries
    operationId: listTopicRevisions
    description: |
      Requires `topic.revision.view_any`. Returns newest-first revision summaries
      for authorized staff only. The list payload never includes raw source.
      Unauthorized callers are rejected before the store lookup so hidden targets
      cannot be enumerated by actors without history permission.
    security:
    - cookieAuth: []
    - bearerAuth: []
    parameters:
    - "$ref": "../components/parameters.yaml#/TopicID"
    - name: after
      in: query
      schema:
        type: string
      description: Opaque revision cursor from `nextCursor`.
    - name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    responses:
      '200':
        description: Keyset-paged topic revision summaries without raw source.
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseForumRevisionList"
      '400':
        "$ref": "../components/responses.yaml#/BadRequest"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
topicRevisionByNo:
  get:
