topicComments:
  get:
    summary: List topic comments
    operationId: listTopicComments
    description: |
      view=tree pages roots and loads at most forum.comments.tree_descendants_per_root
      descendants per root (default 50). Truncated roots set hasMoreChildren; load more
      via listCommentReplies. Public list responses may be short-TTL Redis cached.

      **分页（M5）：** view=flat 支持 keyset `after`（path_key + id）。
      **优先级：非空 `after` 优先于 `page`。** 响应含 `hasMore` / `nextCursor`。
      view=tree 根分页仍可用 page；cursor 主要用于 flat 深翻。
    parameters:
    - "$ref": "../components/parameters.yaml#/TopicID"
    - name: view
      in: query
      schema:
        type: string
        enum:
        - tree
        - flat
        default: tree
    - name: page
      in: query
      description: |
        Page number (OFFSET). Deep pages beyond the maximum are clamped.
        Ignored when `after` is non-empty (cursor precedence).
      schema:
        type: integer
        minimum: 1
        maximum: 200
    - name: after
      in: query
      description: |
        Forward keyset cursor for view=flat (opaque). Prefer for deep scroll.
        Invalid cursor → 400 forum.cursor_invalid.
      schema:
        type: string
    - name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    responses:
      '200':
        description: Topic comments as a desktop tree or mobile-friendly flat list.
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseCommentList"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
  post:
    summary: Create a topic comment
    operationId: createTopicComment
    parameters:
    - "$ref": "../components/parameters.yaml#/TopicID"
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/forum.yaml#/CreateCommentRequest"
    responses:
      '201':
        description: Comment created with shared post content.
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseComment"
      '400':
        "$ref": "../components/responses.yaml#/BadRequest"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
