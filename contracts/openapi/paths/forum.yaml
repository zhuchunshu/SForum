      按 slug 查询公开主题。仅当站点 seo.topic_url_mode = slug（纯 slug URL 模式）
      时使用，slug 全局唯一（依赖 topics_slug_unique_idx）。
      浏览计数语义与 getTopic 相同（D3：成功 GET 后去重 INCR，无 POST /view）。
    operationId: getTopicBySlug
    parameters:
    - "$ref": "../components/parameters.yaml#/TopicSlug"
    responses:
      '200':
        description: Public topic detail with shared post content.
        content:
          application/json:
