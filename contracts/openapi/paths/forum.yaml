search:
  get:
    summary: Search topics by keyword (Meilisearch-backed)
    description: |
      基于 Meilisearch 的主题全文检索，支持 categorySlug/tagSlug 过滤。
      仅返回 active/locked 公开主题。关键词检索已从 GET /topics 迁移至此端点，
      以避免 PostgreSQL ILIKE 在千万级数据下的全表扫描。
    operationId: searchTopics
    parameters:
    - name: query
      in: query
      required: true
      description: 搜索关键词。
      schema:
        type: string
    - name: page
      in: query
      description: 页码，最大 200。
      schema:
        type: integer
        minimum: 1
        maximum: 200
    - name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    - name: categorySlug
      in: query
      schema:
        type: string
    - "$ref": "../components/parameters.yaml#/TagSlug"
    responses:
      '200':
        description: 关键词检索结果。
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseSearchOutput"
      '503':
        description: 搜索服务不可用（Meilisearch 未配置或不可达）。
topics:
  get:
    summary: List public topics
    operationId: listTopics
    parameters:
    - name: page
      in: query
      description: 页码，最大 200。超过上限的深翻页请求会被 clamp 到末页，避免深分页扫描退化。
      schema:
        type: integer
        minimum: 1
        maximum: 200
    - name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    - name: categorySlug
      in: query
      schema:
        type: string
    - "$ref": "../components/parameters.yaml#/TagSlug"
    - name: query
      in: query
      description: 已废弃。关键词检索请改用 GET /api/v1/search；topics 列表不再支持关键词过滤。
      schema:
        type: string
    responses:
      '200':
        description: Paged public topic list.
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseTopicList"
  post:
    summary: Create a topic
    operationId: createTopic
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/forum.yaml#/CreateTopicRequest"
    responses:
      '201':
        description: Topic created with shared post content.
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseTopicDetail"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
