      body substring scans; use id/status/author/date/category/title-prefix only.
      M2 intentionally adds no admin mutation routes.
    security:
    - cookieAuth: []
    - bearerAuth: []
    parameters:
    - name: after
      in: query
      schema:
        type: string
    - name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    - name: status
      in: query
      schema:
        type: string
    - name: authorUserID
      in: query
      schema:
        type: integer
        format: int64
    - name: authorUsername
      in: query
      schema:
        type: string
    - name: updatedFrom
      in: query
      schema:
        type: string
        format: date-time
    - name: updatedTo
      in: query
      schema:
        type: string
        format: date-time
    - name: topicID
      in: query
      schema:
        type: integer
        format: int64
    - name: titlePrefix
      in: query
      schema:
        type: string
    - name: categorySlug
      in: query
      schema:
        type: string
    responses:
      '200':
        description: Cursor-paged admin topic rows.
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseAdminForumContentList"
      '400':
        "$ref": "../components/responses.yaml#/BadRequest"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
