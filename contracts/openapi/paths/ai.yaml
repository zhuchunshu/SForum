adminAISettings:
  get:
    summary: Read AI gateway settings (requires ai.manage)
    operationId: getAISettings
    security: [{cookieAuth: []}]
    responses:
      '200': {description: AI gateway settings., content: {application/json: {schema: {$ref: "../schemas/ai.yaml#/ApiResponseAISettings"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
  put:
    summary: Update AI gateway settings (requires ai.manage)
    operationId: updateAISettings
    security: [{cookieAuth: []}]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: "../schemas/ai.yaml#/AISettingsUpdateRequest"}
    responses:
      '200': {description: Saved settings., content: {application/json: {schema: {$ref: "../schemas/ai.yaml#/ApiResponseAISettings"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
      '422':
        $ref: "../components/responses.yaml#/UnprocessableEntity"
        description: |
          配置不合法。reason 为 ai.settings_malformed（字段类型不对，例如数字字段
          收到空串或小数）或 ai.settings_invalid（取值越界/形状不合法）；两种情况
          data.fields 都会按载荷路径给出字段级消息，例如
          {"gates.rateLimitPerMinute": ["取值超出允许范围…"]}。

adminAISettingsReset:
  post:
    summary: Restore recommended AI gateway defaults (requires ai.manage)
    operationId: resetAISettings
    security: [{cookieAuth: []}]
    responses:
      '200': {description: Restored settings., content: {application/json: {schema: {$ref: "../schemas/ai.yaml#/ApiResponseAISettings"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}

adminAIUsage:
  get:
    summary: Read AI gateway usage for the current site (requires ai.manage)
    operationId: getAIUsage
    security: [{cookieAuth: []}]
    responses:
      '200': {description: Usage counters., content: {application/json: {schema: {$ref: "../schemas/ai.yaml#/ApiResponseAIUsage"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}

adminAIProfileCredential:
  put:
    summary: Store a provider API key in the Host secret store (requires ai.manage)
    operationId: saveAIProfileCredential
    security: [{cookieAuth: []}]
    parameters:
    - name: profileId
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: "../schemas/ai.yaml#/AIProfileCredentialRequest"}
    responses:
      '200': {description: Stored credential version., content: {application/json: {schema: {$ref: "../schemas/ai.yaml#/ApiResponseAIProfileCredential"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
      '404': {$ref: "../components/responses.yaml#/NotFound"}
      '422': {$ref: "../components/responses.yaml#/UnprocessableEntity"}

adminAIProfileModels:
  post:
    summary: List the models a provider endpoint currently serves (requires ai.manage)
    description: |
      一次只读探测，供控制台从返回的模型里直接选择。它不产生补全调用，因此不计费、
      不写执行记录，也不经过成本闸门。请求体可省略：省略时使用已保存的地址与密钥。
      body 中携带的 baseUrl / protocol / apiKey 只用于这次探测，不写库、不回传。
    operationId: listAIProfileModels
    security: [{cookieAuth: []}]
    parameters:
    - name: profileId
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: false
      content:
        application/json:
          schema: {$ref: "../schemas/ai.yaml#/AIModelListRequest"}
    responses:
      '200': {description: Model list outcome. Provider-side failures are returned as a reason code with a readable detail., content: {application/json: {schema: {$ref: "../schemas/ai.yaml#/ApiResponseAIModelList"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
      '404': {$ref: "../components/responses.yaml#/NotFound"}
      '422': {$ref: "../components/responses.yaml#/UnprocessableEntity"}

adminAIDiagnose:
  post:
    summary: Send one minimal live call to verify AI connectivity (requires ai.manage)
    operationId: diagnoseAI
    security: [{cookieAuth: []}]
    requestBody:
      required: false
      content:
        application/json:
          schema: {$ref: "../schemas/ai.yaml#/AIDiagnoseRequest"}
    responses:
      '200': {description: Diagnostic outcome., content: {application/json: {schema: {$ref: "../schemas/ai.yaml#/ApiResponseAIDiagnose"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}

adminAIExecutions:
  get:
    summary: List recent AI executions for audit (requires ai.manage)
    operationId: listAIExecutions
    security: [{cookieAuth: []}]
    parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    responses:
      '200': {description: Execution trace records., content: {application/json: {schema: {$ref: "../schemas/ai.yaml#/ApiResponseAIExecutions"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}

adminAIRunTimeline:
  get:
    summary: Read every execution record of one AI run in time order (requires ai.manage)
    description: |
      轨迹回放：按归属对象（`resourceType=ai.run`, `resourceId=<runId>`）取回同一
      run 的全部执行记录，按 `created_at ASC, id ASC` 排序。

      - `runId` 为空或长度超过 128 返回 422 `ai.run_id_invalid`。
      - 未知 `runId` 返回 200 与空 `items`，不是 404：历史记录（没有 run 归属）
        与「查不到」对运营者是同一个事实，界面据此不显示展开入口。
      - `limit` 上限 200、默认 50。
      - 记录里没有工具调用明细：工具轨迹在日志与新表，不在执行记录里。
    operationId: getAIRunTimeline
    security: [{cookieAuth: []}]
    parameters:
    - name: runId
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    responses:
      '200': {description: Every record of this run in time order., content: {application/json: {schema: {$ref: "../schemas/ai.yaml#/ApiResponseAIRunTimeline"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
      '422': {$ref: "../components/responses.yaml#/UnprocessableEntity"}
