adminExtensionCacheInspector:
  get:
    summary: Inspect Host Cache Registry health and metadata-only traces
    operationId: inspectAdminExtensionCache
    description: >-
      Requires extension.view or the legacy extension.manage permission. Returns
      one revision-consistent Cache Registry snapshot with aggregate hit, miss,
      latency, and invalidation evidence. Cache keys, values, tag names, lock
      tokens, request payloads, and error strings are never disclosed.
    parameters:
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
      description: Maximum newest-first trace and invalidation rows to return.
    responses:
      '200':
        description: Detached, revision-consistent Cache Inspector snapshot.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extension-cache-inspector.yaml#/ApiResponseCacheInspectorSnapshot"
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '409': { "$ref": "../components/responses.yaml#/Conflict" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
      '503': { "$ref": "../components/responses.yaml#/ServiceUnavailable" }
