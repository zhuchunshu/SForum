profileByUsername:
  get:
    summary: Read a public member profile
    operationId: getPublicProfile
    parameters:
    - name: username
      in: path
      required: true
      schema:
        type: string
      description: Member username.
    responses:
      '200':
        description: Public profile with stats and recent topics.
        content:
          application/json:
            schema:
              "$ref": "../schemas/profile.yaml#/ApiResponsePublicProfile"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
myProfile:
  get:
    summary: Read the current user's editable profile
    operationId: getMyProfile
    responses:
      '200':
        description: Current user profile.
        content:
          application/json:
            schema:
              "$ref": "../schemas/profile.yaml#/ApiResponsePublicProfile"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
  put:
    summary: Update the current user's editable profile
    operationId: updateMyProfile
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/profile.yaml#/UpdateProfileRequest"
    responses:
      '200':
        description: Updated profile.
        content:
          application/json:
            schema:
              "$ref": "../schemas/profile.yaml#/ApiResponseProfile"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
myProfileAvatar:
  post:
    summary: Upload and set the current user's avatar
    operationId: uploadMyProfileAvatar
    description: Requires authentication, attachment.upload permission, and avatar.allow_upload enabled.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - file
            properties:
              file:
                type: string
                format: binary
    responses:
      '200':
        description: Profile after the uploaded public avatar is attached.
        content:
          application/json:
            schema:
              "$ref": "../schemas/profile.yaml#/ApiResponseProfile"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
  delete:
    summary: Remove the current user's uploaded avatar
    operationId: deleteMyProfileAvatar
    description: Clears the profile avatar attachment and falls back to the configured default provider.
    responses:
      '200':
        description: Profile after avatar removal.
        content:
          application/json:
            schema:
              "$ref": "../schemas/profile.yaml#/ApiResponseProfile"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
