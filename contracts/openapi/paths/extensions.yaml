siteActiveThemeSettings:
  get:
    summary: Public settings for the active theme
    operationId: getSiteActiveThemeSettings
    tags: [Extensions]
    description: >-
      Returns non-secret settings for the currently active theme (merged with
      manifest defaults). Used by public theme layers for operator-configurable
      UI such as homepage notice copy and right-rail toggles. Secrets are never
      included.
    responses:
      '200':
        description: Active theme public settings map.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponsePublicActiveThemeSettings"

adminExtensions:
  get:
    summary: List installed extensions and themes
    operationId: listAdminExtensions
    responses:
      '200':
        description: Installed extension list.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
  post:
    summary: Upload and install or stage an extension ZIP archive
    description: >-
      Uploads a ZIP archive containing sforum.extension.json. Same extension id
      stores an immutable upgrade candidate without changing the active package,
      runtime, status, provider selection, or active trust grants. Candidate code,
      migrations, and admin components remain inert until a separate trusted
      upgrade transaction activates that exact artifact. Theme ZIPs contain
      theme.json plus static assets and never trigger a Nuxt build. Themes cannot
      declare plugin runtime capabilities. New installs are not automatically
      enabled or activated.
    operationId: installAdminExtension
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - file
            properties:
              file:
                type: string
                format: binary
    responses:
      '201':
        description: >-
          Extension archive installed or saved as an upgrade candidate. data is
          InstallResult (extension plus activationPending metadata).
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionInstallResult"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        description: Built-in/system extension cannot be overwritten (extension.not_deletable).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: >-
          Invalid archive or manifest. Invalid theme manifests keep the normal
          error envelope and use reason extension.manifest_invalid.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionUninstall:
  delete:
    summary: Uninstall a deletable extension
    description: >-
      Protocol V2 plugins run digest-bound uninstall hooks while their exact
      package, runtime recovery material, and last successful authority remain
      available. The safe default preserves plugin data. Physical identity and
      package deletion occurs only after terminal success through a durable
      tombstone and exact purge receipt. Legacy extensions retain the V1
      retainSettings/retainPackage compatibility behavior.
    operationId: uninstallAdminExtension
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              removalMode:
                type: string
                enum: [preserve, export_then_remove, complete_removal]
                default: preserve
                description: V2 data disposition. Omission selects the safe preserve default.
              retainSettings:
                type: boolean
                description: V1 compatibility only; settings still CASCADE with the extension row.
              retainPackage:
                type: boolean
                description: V1 compatibility only; keep the package snapshot directory on disk.
    responses:
      '200':
        description: Extension uninstalled.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionUninstall"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: >-
          Not deletable, a lifecycle conflict, or an explicit recovery is
          required. V1 extensions may still require disable first.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Invalid removal mode or missing/invalid V2 Idempotency-Key.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        description: Lifecycle coordinator or exact cleanup finalizer unavailable.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionLifecycleOperations:
  get:
    summary: List durable extension lifecycle operations
    description: >-
      Requires extension.view (or the extension.manage compatibility parent).
      Returns newest-first durable operation summaries for this extension. The
      response is a strict allowlist and never exposes authority snapshots,
      idempotency keys, request fingerprints, checkpoints, progress documents,
      trusted-runtime inputs/results, lease credentials, or opaque metadata.
    operationId: listAdminExtensionLifecycleOperations
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - name: limit
      in: query
      required: false
      description: Maximum number of newest operations. Empty, repeated, signed, non-canonical, or out-of-range values are rejected.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    responses:
      '200':
        description: Allowlisted lifecycle operation history.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseLifecycleOperationList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        description: Invalid extension id or limit (reason validation.invalid).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        description: Lifecycle inspection is not initialized (reason extension.lifecycle_unavailable).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionLifecycleOperation:
  get:
    summary: Inspect one durable extension lifecycle operation
    description: >-
      Requires extension.view (or the extension.manage compatibility parent).
      The operation is scoped by both extensionID and operationID. Returns the
      allowlisted operation and step history without authority, checkpoint,
      input, result, lease, or opaque metadata fields.
    operationId: getAdminExtensionLifecycleOperation
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - name: operationID
      in: path
      required: true
      description: Canonical positive base-10 lifecycle operation id.
      schema:
        type: integer
        format: int64
        minimum: 1
    responses:
      '200':
        description: Allowlisted lifecycle operation detail and step attempts.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseLifecycleOperationDetail"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        description: No operation with this id belongs to the extension (reason extension.lifecycle_operation_not_found).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Invalid extension id or operation id (reason validation.invalid).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        description: Lifecycle inspection is not initialized (reason extension.lifecycle_unavailable).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionLifecycleRecovery:
  post:
    summary: Recover one failed durable lifecycle operation
    description: >-
      Requires plugin management permission and targets the exact extensionID
      plus operationID. Retry and skip-step preserve the original artifact,
      authority snapshot, idempotency key, request fingerprint, and initial
      audit identity. Each decision receives a new durable recovery audit id.
      Forced uninstall escalation additionally requires an active super_admin
      and an explicit residual-risk reason. Successful operations cannot be
      recovered.
    operationId: recoverAdminExtensionLifecycleOperation
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - name: operationID
      in: path
      required: true
      description: Canonical positive base-10 lifecycle operation id.
      schema:
        type: integer
        format: int64
        minimum: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/extensions.yaml#/LifecycleRecoveryInput"
    responses:
      '200':
        description: Updated operation detail with recovery decision history.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseLifecycleOperationDetail"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        description: Missing plugin management permission, or forced escalation by a non-super-admin.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '404':
        description: No operation with this id belongs to the extension.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '409':
        description: Operation is not recoverable or its durable state changed.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Invalid operation id, decision, reason, or forced recovery request.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        description: Lifecycle coordinator, audit writer, or cleanup finalizer unavailable.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionMigrations:
  get:
    summary: List recorded extension migration ledger entries
    description: >-
      Returns the host migration ledger for declared manifest.migrations paths
      (F2.4). v1 records checksums only and does not execute plugin SQL.
    operationId: listAdminExtensionMigrations
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Migration ledger rows.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionMigrationList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
adminExtensionMigrationsApply:
  post:
    summary: Record declared extension migrations
    description: >-
      Idempotently records manifest.migrations paths into the ledger with file
      checksums. Does not run arbitrary SQL against the host database (F2.4 v1).
    operationId: applyAdminExtensionMigrations
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Full ledger after recording new paths.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionMigrationList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: Safe Mode blocks extension migration actions (extension.safe_mode_active).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Migration recording failed (extension.migration_failed).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionNavigation:
  get:
    summary: List extension admin navigation items
    description: Returns explicit extension admin menu pages declared with menu true by enabled plugins and the active theme. All pages stay under the fixed Extensions namespace.
    operationId: listAdminExtensionNavigation
    responses:
      '200':
        description: Extension admin navigation items.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionNavigationList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionContributionPoints:
  get:
    summary: List host-defined extension contribution points
    description: Requires extension.manage. Returns the core-owned typed contribution point catalog; plugins may only declare contributions to known points.
    operationId: listAdminExtensionContributionPoints
    responses:
      '200':
        description: Known contribution points.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseContributionPointDefinitionList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionContributions:
  get:
    summary: List active extension contributions
    description: Requires extension.manage. Returns effective contributions from enabled plugins only; disabled plugins and inactive themes do not affect runtime behavior.
    operationId: listAdminExtensionContributions
    responses:
      '200':
        description: Active contribution descriptors sorted by order, extension id, and contribution id.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseEffectiveContributionList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionSettings:
  get:
    summary: Read extension settings
    description: >-
      Returns the localized host-renderer page model for either a plugin or a
      theme. Installed/disabled plugins and inactive themes remain readable and
      configurable without starting extension runtime code. Legacy array-shaped
      settings normalize to schema/form. Versioned Settings Documents may opt
      into an explicitly trusted prebuilt component while retaining Schema fallback.
    operationId: getAdminExtensionSettings
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Manifest-declared settings with stored values resolved over defaults.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionSettings"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
  put:
    summary: Update extension settings
    description: >-
      Persists only manifest-declared keys. Stored secrets remain encrypted and
      blank/omitted secret values preserve the current secret. Disabled plugins
      and inactive themes can be configured; only an already-enabled backend
      plugin is restarted after persistence.
    operationId: updateAdminExtensionSettings
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/extensions.yaml#/ExtensionSettingsInput"
    responses:
      '200':
        description: Updated settings.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionSettings"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        description: Unknown setting key or invalid settings payload.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        description: Plugin restart failed; reason extension.settings_rollback_failed means restoring the previous settings also failed and requires operator intervention.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionSettingsReset:
  post:
    summary: Reset extension settings to manifest defaults
    operationId: resetAdminExtensionSettings
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Settings after default resolution.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionSettings"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        description: Plugin restart failed; reason extension.settings_rollback_failed means restoring the previous settings also failed and requires operator intervention.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionSettingsAction:
  post:
    summary: Execute a declared extension settings action
    operationId: executeAdminExtensionSettingsAction
    description: >-
      Executes only an action declared by the installed settings document. The
      host validates permission, field allowlists, explicit secret
      preserve/replace semantics, lifecycle, timeout, audit, and response
      bounds. Provider probes use a restricted short-lived runtime that does
      not register normal routes, events, jobs, schedules, or providers, so a
      disabled plugin can be tested before enablement. Results are structured
      host data and never plugin-provided HTML.
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - name: actionID
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/extensions.yaml#/ExtensionSettingsActionInput"
    responses:
      '200':
        description: Structured action result; success may be false for provider-level failures.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionSettingsActionResult"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        description: Unknown action/field, implicit secret handling, or oversized input.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        description: Action runtime unavailable or timed out.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionEnable:
  post:
    summary: Enable an installed plugin
    description: >-
      Enables a plugin after preflight. With SFORUM_V3_TRUST_CHALLENGES enabled,
      a newly executable uploaded artifact requires the actor-bound one-use
      confirmationToken returned by the challenge endpoint. An already trusted
      exact digest may restart without another token. With the migration gate
      disabled, confirmCapabilities remains the v1 compatibility field.
      Idempotency-Key is required for protocol V2 plus manifest.lifecycle and
      remains optional for legacy plugins.
    operationId: enableAdminExtension
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              confirmCapabilities:
                type: boolean
                deprecated: true
                description: V1 compatibility confirmation used only while the V3 trust challenge gate is disabled.
              confirmationToken:
                type: string
                pattern: '^[0-9a-f]{64}$'
                description: Actor-bound, one-use, maximum-five-minute token for the exact canonical impact document.
    responses:
      '200':
        description: Plugin enabled after preflight checks.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: >-
          Themes must use activation, or capability confirmation is required
          (reason extension.capability_confirmation_required), or Safe Mode
          blocks executable activation (extension.safe_mode_active).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Invalid or missing V2 lifecycle Idempotency-Key.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionTrust:
  get:
    summary: Preview exact executable extension impact and trust state
    description: >-
      Returns the canonical impact document without executing package code.
      Delegated extension managers may inspect this preview. The document binds
      package/binary/frontend/migration digests, routes, guards, hooks, providers,
      components, capabilities, permissions, requested authority, and contracts.
    operationId: getAdminExtensionTrust
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Current exact-artifact trust status and impact preview.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExecutableTrustStatus"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: V3 trust challenge migration gate is disabled.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
  delete:
    summary: Revoke executable trust for an extension
    description: Super-admin only. Revokes every live exact-artifact grant and outstanding challenge for the extension.
    operationId: revokeAdminExtensionTrust
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Executable trust revoked immediately.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExecutableTrustStatus"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: V3 trust challenge migration gate is disabled.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionTrustChallenge:
  post:
    summary: Issue an exact-artifact executable trust challenge
    description: >-
      Super-admin only. Returns a one-use token bound to the current actor,
      extension version, package and executable digests, canonical impact digest,
      requested authority, and Host/Frontend contracts. Expires within five minutes.
    operationId: createAdminExtensionTrustChallenge
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Short-lived one-use challenge issued.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExecutableTrustChallenge"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: Trust is not required for this artifact or the migration gate is disabled.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionDisable:
  post:
    summary: Disable an installed plugin
    description: >-
      Runs the durable lifecycle transaction for protocol V2 plus
      manifest.lifecycle; those plugins require Idempotency-Key. Legacy plugins
      continue to use the compatibility disable path.
    operationId: disableAdminExtension
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    responses:
      '200':
        description: Plugin disabled.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: Themes must use the activation endpoint instead of plugin disable.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Invalid or missing V2 lifecycle Idempotency-Key.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionUpgrade:
  post:
    summary: Activate the exact staged plugin version
    description: >-
      Runs the protocol V2 upgrade transaction for the immutable staged
      candidate. Idempotency-Key is required when the selected plugin declares
      backend protocolVersion 2 plus manifest.lifecycle. Candidate code remains
      inert until static preflight and exact-artifact trust both pass.
    operationId: upgradeAdminExtension
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              confirmationToken:
                type: string
                pattern: '^[0-9a-f]{64}$'
    responses:
      '200':
        description: The exact staged artifact is active.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: No staged candidate, trust conflict, or another lifecycle operation is open.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Invalid or missing V2 lifecycle idempotency identity.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionRollback:
  post:
    summary: Roll back to an exact historical plugin version
    description: >-
      Runs the protocol V2 rollback transaction for the exact version and
      digest. The Host reuses that artifact's last successful immutable
      authority snapshot even if its live grant was later revoked; current
      operator permission and audit identity remain authoritative.
    operationId: rollbackAdminExtension
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [targetVersion, targetPackageDigest]
            properties:
              targetVersion:
                type: string
                minLength: 1
              targetPackageDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
    responses:
      '200':
        description: The exact historical artifact is active.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        description: Extension or exact historical version not found.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '409':
        description: No successful frozen authority or another lifecycle operation is open.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Invalid rollback target or missing V2 lifecycle idempotency identity.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionVerify:
  post:
    summary: Verify an installed plugin or theme package without applying it
    description: >-
      Plugins run preflight checks. Themes validate their buildless theme.json,
      page templates, and static asset paths without applying the package.
    operationId: verifyAdminExtension
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Extension preflight or theme package verification completed.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: Safe Mode blocks executable preflight (extension.safe_mode_active).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionActivate:
  post:
    summary: Activate a theme
    operationId: activateAdminExtensionTheme
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Theme synchronously activated through the public Page Registry.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: Safe Mode blocks theme activation (extension.safe_mode_active).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionEvents:
  get:
    summary: List extension lifecycle events
    operationId: listAdminExtensionEvents
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    responses:
      '200':
        description: Recent extension lifecycle events.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionEventList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionEventDefinitions:
  get:
    summary: List host-defined extension event points
    operationId: listAdminExtensionEventDefinitions
    responses:
      '200':
        description: Known extension event definitions and their listener semantics.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionEventDefinitionList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionEventDeliveries:
  get:
    summary: List plugin event delivery attempts
    operationId: listAdminExtensionEventDeliveries
    parameters:
    - name: extensionId
      in: query
      schema:
        type: string
    - name: eventName
      in: query
      schema:
        type: string
    - name: status
      in: query
      schema:
        type: string
        enum:
        - queued
        - running
        - succeeded
        - failed
        - skipped
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    responses:
      '200':
        description: Recent plugin event listener delivery attempts.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionEventDeliveryList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionFrontend:
  get:
    summary: Inspect an extension prebuilt settings component
    description: Requires extension management permission. Returns the exact admin frontend digest, component declaration, and trust state without executing extension code.
    operationId: getAdminExtensionFrontend
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Trusted frontend status.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseFrontendStatus"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionFrontendAsset:
  get:
    summary: Load a trusted immutable prebuilt admin asset
    description: >-
      Authenticated same-origin endpoint. It serves only the current settings
      component entry or CSS declared by the installed package, after exact
      digest grant/source-trust verification. Arbitrary package paths are never
      accepted. Responses use immutable private caching and nosniff.
    operationId: getAdminExtensionFrontendAsset
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - name: digest
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    - name: asset
      in: path
      required: true
      schema:
        type: string
        enum: [entry, style]
    responses:
      '200':
        description: Immutable JavaScript module or CSS bytes from the extension package.
        headers:
          Cache-Control:
            schema: { type: string }
          ETag:
            schema: { type: string }
          X-Content-Type-Options:
            schema: { type: string, enum: [nosniff] }
          Cross-Origin-Resource-Policy:
            schema: { type: string, enum: [same-origin] }
        content:
          application/javascript:
            schema: { type: string, format: binary }
          text/css:
            schema: { type: string, format: binary }
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
adminExtensionFrontendConfirmation:
  post:
    summary: Create a one-use prebuilt component trust confirmation
    description: >-
      Active super_admin only. The five-minute challenge is bound to actor,
      extension id, version, API version, component id, and
      adminFrontendDigest, and is consumed by the first grant attempt. It
      confirms intentional authorization; the durable technical boundary is
      still the exact digest grant.
    operationId: createAdminExtensionFrontendConfirmation
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: One-use confirmation challenge.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseFrontendTrustChallenge"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
adminExtensionFrontendTrust:
  post:
    summary: Grant exact trusted admin frontend access
    description: >-
      Requires an active super administrator. Trust is bound to extension id,
      version, API version, component identity, and exact adminFrontendDigest.
      Prebuilt components additionally require an explicit confirmation object
      and load directly from the immutable digest endpoint after authorization.
    operationId: grantAdminExtensionFrontendTrust
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/extensions.yaml#/GrantFrontendTrustInput"
    responses:
      '200':
        description: Trust granted immediately.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseFrontendStatus"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '422':
        description: The admin frontend digest is not 64 lowercase hexadecimal characters.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
  delete:
    summary: Revoke exact trusted admin frontend access
    description: Requires an active super administrator. Revocation finalizes immediately and prevents further asset loads for the digest grant.
    operationId: revokeAdminExtensionFrontendTrust
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Trust revoked immediately.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseFrontendStatus"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
adminExtensionRouteProviderConflicts:
  get:
    summary: Inspect replace-provider conflicts and durable desired selections
    operationId: listAdminExtensionRouteProviderConflicts
    description: Requires extension.view or the legacy extension.manage permission. Stale desired bindings remain visible with their revision for explicit CAS reset.
    responses:
      '200':
        description: Replace-provider conflicts from the current immutable Route Registry snapshot.
        content:
          application/json:
            schema: { "$ref": "../schemas/extension-route-providers.yaml#/ApiResponseRouteProviderConflictList" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '503': { "$ref": "../components/responses.yaml#/ServiceUnavailable" }
adminExtensionRouteProviderSelection:
  get:
    summary: Inspect the durable desired route-provider selection
    operationId: getAdminExtensionRouteProviderSelection
    description: Returns the stored binding and revision even when its target contract or exact provider is stale. Runtime dispatch never uses this management-only desired read.
    parameters:
    - { name: targetRouteId, in: query, required: true, schema: { type: string } }
    - { name: targetContractVersion, in: query, required: true, schema: { type: string } }
    - { name: method, in: query, required: true, schema: { type: string } }
    - { name: pathSignature, in: query, required: true, schema: { type: string } }
    responses:
      '200':
        description: Durable desired selection.
        content:
          application/json:
            schema: { "$ref": "../schemas/extension-route-providers.yaml#/ApiResponseRouteProviderSelection" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '404': { "$ref": "../components/responses.yaml#/NotFound" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
      '503': { "$ref": "../components/responses.yaml#/ServiceUnavailable" }
  post:
    summary: Select an exact replace provider
    operationId: selectAdminExtensionRouteProvider
    description: Active super_admin only. The Host appends an attributable audit event before exact-snapshot validation and revision-CAS persistence. Priority never selects a replacement.
    requestBody:
      required: true
      content:
        application/json:
          schema: { "$ref": "../schemas/extension-route-providers.yaml#/RouteProviderSelectInput" }
    responses:
      '200':
        description: Exact desired provider selected.
        content:
          application/json:
            schema: { "$ref": "../schemas/extension-route-providers.yaml#/ApiResponseRouteProviderSelection" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '409': { "$ref": "../components/responses.yaml#/Conflict" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
      '503': { "$ref": "../components/responses.yaml#/ServiceUnavailable" }
adminExtensionRouteProviderEvents:
  get:
    summary: List append-only route-provider selection events
    operationId: listAdminExtensionRouteProviderEvents
    parameters:
    - { name: targetRouteId, in: query, required: true, schema: { type: string } }
    - { name: targetContractVersion, in: query, required: true, schema: { type: string } }
    - { name: method, in: query, required: true, schema: { type: string } }
    - { name: pathSignature, in: query, required: true, schema: { type: string } }
    - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    responses:
      '200':
        description: Select, reset, and lifecycle invalidation evidence.
        content:
          application/json:
            schema: { "$ref": "../schemas/extension-route-providers.yaml#/ApiResponseRouteProviderSelectionEventList" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
      '503': { "$ref": "../components/responses.yaml#/ServiceUnavailable" }
adminExtensionRouteProviderReset:
  post:
    summary: Reset a durable desired route-provider selection
    operationId: resetAdminExtensionRouteProvider
    description: Active super_admin only. Uses the stored key and revision returned by the management inspection API, including for stale bindings.
    requestBody:
      required: true
      content:
        application/json:
          schema: { "$ref": "../schemas/extension-route-providers.yaml#/RouteProviderResetInput" }
    responses:
      '200':
        description: Desired selection reset; runtime resolution remains fail closed until a new provider is selected.
        content:
          application/json:
            schema: { "$ref": "../schemas/extension-route-providers.yaml#/ApiResponseRouteProviderReset" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '404': { "$ref": "../components/responses.yaml#/NotFound" }
      '409': { "$ref": "../components/responses.yaml#/Conflict" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
      '503': { "$ref": "../components/responses.yaml#/ServiceUnavailable" }
extensionPluginRoute:
  parameters:
  - "$ref": "../components/parameters.yaml#/ExtensionID"
  - "$ref": "../components/parameters.yaml#/ExtensionPluginPath"
  get:
    summary: Invoke a declared plugin route
    description: Proxies a plugin-declared GET route under /api/v1/extensions/{extensionID}/* after host-side manifest matching and access checks. Plugins cannot override core API routes.
    responses:
      '200':
        description: Plugin-defined response.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '405':
        description: Plugin route exists but does not declare this HTTP method.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
  post:
    summary: Invoke a declared plugin route
    description: Proxies a plugin-declared unsafe route only after the host verifies the current actor and any manifest-declared permission.
    responses:
      '200':
        description: Plugin-defined response.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '405':
        description: Plugin route exists but does not declare this HTTP method.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
