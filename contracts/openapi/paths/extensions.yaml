adminExtensions:
  get:
    summary: List installed extensions and themes
    operationId: listAdminExtensions
    responses:
      '200':
        description: Installed extension list.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
  post:
    summary: Upload and install an extension ZIP archive
    description: >-
      Uploads a ZIP archive containing sforum.extension.json. Theme ZIPs are
      installable Nuxt Layer packages: type theme requires a safe non-empty
      frontend.layer and cannot declare plugin/runtime/admin capabilities in v1.
      Uploaded themes may be installed and verified, but cannot be activated
      until the theme rebuild and rollback runtime exists.
    operationId: installAdminExtension
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - file
            properties:
              file:
                type: string
                format: binary
    responses:
      '201':
        description: Extension archive installed but not automatically enabled or activated.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        description: >-
          Invalid archive or manifest. Invalid theme manifests keep the normal
          error envelope and use reason extension.manifest_invalid.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionEnable:
  post:
    summary: Enable an installed plugin
    operationId: enableAdminExtension
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Plugin enabled after preflight checks.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: Themes must use the activation endpoint instead of plugin enable.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionDisable:
  post:
    summary: Disable an installed plugin
    operationId: disableAdminExtension
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Plugin disabled.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: Themes must use the activation endpoint instead of plugin disable.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionVerify:
  post:
    summary: Verify an installed plugin or theme package without applying it
    description: >-
      Plugins run preflight checks. Themes run Nuxt Layer package verification
      without applying the uploaded layer. Missing theme package files, missing
      installed manifests, and missing layer paths return reason
      extension.build_failed.
    operationId: verifyAdminExtension
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Extension preflight or Nuxt Layer verification completed.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionActivate:
  post:
    summary: Activate a theme
    operationId: activateAdminExtensionTheme
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Built-in default theme restored as the active applied theme.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: Uploaded theme activation is unavailable until theme rebuild, health-check, and rollback runtime exists.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionEvents:
  get:
    summary: List extension lifecycle events
    operationId: listAdminExtensionEvents
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    responses:
      '200':
        description: Recent extension lifecycle events.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionEventList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionEventDefinitions:
  get:
    summary: List host-defined extension event points
    operationId: listAdminExtensionEventDefinitions
    responses:
      '200':
        description: Known extension event definitions and their listener semantics.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionEventDefinitionList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionEventDeliveries:
  get:
    summary: List plugin event delivery attempts
    operationId: listAdminExtensionEventDeliveries
    parameters:
    - name: extensionId
      in: query
      schema:
        type: string
    - name: eventName
      in: query
      schema:
        type: string
    - name: status
      in: query
      schema:
        type: string
        enum:
        - queued
        - running
        - succeeded
        - failed
        - skipped
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    responses:
      '200':
        description: Recent plugin event listener delivery attempts.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionEventDeliveryList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
extensionPluginRoute:
  parameters:
  - "$ref": "../components/parameters.yaml#/ExtensionID"
  - "$ref": "../components/parameters.yaml#/ExtensionPluginPath"
  get:
    summary: Invoke a declared plugin route
    description: Proxies a plugin-declared GET route under /api/v1/extensions/{extensionID}/* after host-side manifest matching and access checks. Plugins cannot override core API routes.
    responses:
      '200':
        description: Plugin-defined response.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '405':
        description: Plugin route exists but does not declare this HTTP method.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
  post:
    summary: Invoke a declared plugin route
    description: Proxies a plugin-declared unsafe route only after the host verifies the current actor and any manifest-declared permission.
    responses:
      '200':
        description: Plugin-defined response.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '405':
        description: Plugin route exists but does not declare this HTTP method.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
