adminExtensions:
  get:
    summary: List installed extensions and themes
    operationId: listAdminExtensions
    responses:
      '200':
        description: Installed extension list.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
  post:
    summary: Upload and install an extension ZIP archive
    description: >-
      Uploads a ZIP archive containing sforum.extension.json. Theme ZIPs are
      installable Nuxt Layer packages: type theme requires a safe non-empty
      frontend.layer and cannot declare plugin/runtime/admin capabilities in v1.
      Uploaded themes may be installed, verified, and queued for activation
      through the theme rebuild and rollback runtime.
    operationId: installAdminExtension
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - file
            properties:
              file:
                type: string
                format: binary
    responses:
      '201':
        description: Extension archive installed but not automatically enabled or activated.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        description: >-
          Invalid archive or manifest. Invalid theme manifests keep the normal
          error envelope and use reason extension.manifest_invalid.
        content:
          application/json:
            schema:
          "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionNavigation:
  get:
    summary: List extension admin navigation items
    description: Returns explicit extension admin menu pages declared with menu true by enabled plugins and the active theme. All pages stay under the fixed Extensions namespace.
    operationId: listAdminExtensionNavigation
    responses:
      '200':
        description: Extension admin navigation items.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionNavigationList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionContributionPoints:
  get:
    summary: List host-defined extension contribution points
    description: Requires extension.manage. Returns the core-owned typed contribution point catalog; plugins may only declare contributions to known points.
    operationId: listAdminExtensionContributionPoints
    responses:
      '200':
        description: Known contribution points.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseContributionPointDefinitionList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionContributions:
  get:
    summary: List active extension contributions
    description: Requires extension.manage. Returns effective contributions from enabled plugins only; disabled plugins and inactive themes do not affect runtime behavior.
    operationId: listAdminExtensionContributions
    responses:
      '200':
        description: Active contribution descriptors sorted by order, extension id, and contribution id.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseEffectiveContributionList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionSettings:
  get:
    summary: Read extension settings
    operationId: getAdminExtensionSettings
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Manifest-declared settings with stored values resolved over defaults.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionSettings"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
  put:
    summary: Update extension settings
    operationId: updateAdminExtensionSettings
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/extensions.yaml#/ExtensionSettingsInput"
    responses:
      '200':
        description: Updated settings.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionSettings"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        description: Unknown setting key or invalid settings payload.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionSettingsReset:
  post:
    summary: Reset extension settings to manifest defaults
    operationId: resetAdminExtensionSettings
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Settings after default resolution.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionSettings"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
adminExtensionEnable:
  post:
    summary: Enable an installed plugin
    description: >-
      Enables a plugin after preflight. When the plugin resolves to any host
      capabilities, the first enable requires confirmCapabilities=true so
      operators acknowledge the grant list (F2.1). Restarting an already-enabled
      plugin does not require re-confirmation.
    operationId: enableAdminExtension
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              confirmCapabilities:
                type: boolean
                description: Operator confirmed the capability grant list for this plugin.
    responses:
      '200':
        description: Plugin enabled after preflight checks.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionOperation"
      '202':
        description: Trusted plugin frontend Web Release queued.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionOperation"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: >-
          Themes must use activation, or capability confirmation is required
          (reason extension.capability_confirmation_required).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionDisable:
  post:
    summary: Disable an installed plugin
    operationId: disableAdminExtension
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Plugin disabled.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionOperation"
      '202':
        description: Safe Web Release without the plugin frontend queued.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionOperation"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: Themes must use the activation endpoint instead of plugin disable.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionVerify:
  post:
    summary: Verify an installed plugin or theme package without applying it
    description: >-
      Plugins run preflight checks. Themes run Nuxt Layer package verification
      without applying the uploaded layer. Missing theme package files, missing
      installed manifests, and missing layer paths return reason
      extension.build_failed.
    operationId: verifyAdminExtension
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Extension preflight or Nuxt Layer verification completed.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionOperation"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionActivate:
  post:
    summary: Activate a theme
    operationId: activateAdminExtensionTheme
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Built-in default theme restored as the active applied theme.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionOperation"
      '202':
        description: Uploaded theme activation accepted and queued for build.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionEvents:
  get:
    summary: List extension lifecycle events
    operationId: listAdminExtensionEvents
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    responses:
      '200':
        description: Recent extension lifecycle events.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionEventList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionEventDefinitions:
  get:
    summary: List host-defined extension event points
    operationId: listAdminExtensionEventDefinitions
    responses:
      '200':
        description: Known extension event definitions and their listener semantics.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionEventDefinitionList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionEventDeliveries:
  get:
    summary: List plugin event delivery attempts
    operationId: listAdminExtensionEventDeliveries
    parameters:
    - name: extensionId
      in: query
      schema:
        type: string
    - name: eventName
      in: query
      schema:
        type: string
    - name: status
      in: query
      schema:
        type: string
        enum:
        - queued
        - running
        - succeeded
        - failed
        - skipped
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    responses:
      '200':
        description: Recent plugin event listener delivery attempts.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionEventDeliveryList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionFrontend:
  get:
    summary: Inspect an extension trusted admin frontend
    description: Requires extension.manage. Returns the exact package digest, declaration, dependency summary, and trust state without executing plugin code.
    operationId: getAdminExtensionFrontend
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Trusted frontend status.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseFrontendStatus"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionFrontendTrust:
  post:
    summary: Grant exact trusted admin frontend access
    description: Requires an active super administrator. Trust is bound to the submitted exact immutable package digest. A disabled plugin returns 200; an enabled plugin queues a web release and returns 202.
    operationId: grantAdminExtensionFrontendTrust
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/extensions.yaml#/GrantFrontendTrustInput"
    responses:
      '200':
        description: Trust granted without a web rebuild.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionOperation"
      '202':
        description: Trust granted and a web release queued.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionOperation"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '422':
        description: The package digest is not 64 lowercase hexadecimal characters.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
  delete:
    summary: Revoke exact trusted admin frontend access
    description: Requires an active super administrator. Revocation finalizes immediately when the active artifact does not contain the grant; otherwise it remains pending and queues a force-reload safe release.
    operationId: revokeAdminExtensionFrontendTrust
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Trust revoked immediately.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionOperation"
      '202':
        description: Revocation is pending a safe web release.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionOperation"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
adminWebReleases:
  get:
    summary: List web releases
    description: Requires extension.manage. Returns immutable release history ordered by desired generation descending.
    operationId: listAdminWebReleases
    parameters:
    - name: status
      in: query
      schema:
        "$ref": "../schemas/extensions.yaml#/WebReleaseStatus"
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    responses:
      '200':
        description: Paged web release history.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseWebReleasePage"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminWebRelease:
  get:
    summary: Get a web release timeline
    operationId: getAdminWebRelease
    parameters:
    - "$ref": "../components/parameters.yaml#/WebReleaseID"
    responses:
      '200':
        description: Release composition, effects, and transition events.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseWebReleaseDetail"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
adminWebReleaseRetry:
  post:
    summary: Retry a failed or superseded web release
    description: Creates a new queued release and generation; it never mutates the terminal source release.
    operationId: retryAdminWebRelease
    parameters:
    - "$ref": "../components/parameters.yaml#/WebReleaseID"
    responses:
      '202':
        description: New retry release queued.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseWebReleaseOperation"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
adminWebReleaseRollback:
  post:
    summary: Rebuild an eligible historical web release composition
    description: Rechecks exact frontend trust and creates a new force-reload release. Historical rows and artifacts are not directly reactivated.
    operationId: rollbackAdminWebRelease
    parameters:
    - "$ref": "../components/parameters.yaml#/WebReleaseID"
    responses:
      '202':
        description: New checked rollback release queued.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseWebReleaseOperation"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
adminWebReleaseRestoreDefaults:
  post:
    summary: Restore recommended trusted frontend defaults
    description: Requires an active super administrator. Marks all uploaded frontend grants for revocation while preserving plugin status, settings, credentials, and backend runtimes. Returns 200 when no active uploaded frontend is present, otherwise 202.
    operationId: restoreAdminWebReleaseDefaults
    responses:
      '200':
        description: Recommended defaults already effective or finalized immediately.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionOperation"
      '202':
        description: Safe default web release queued.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionOperation"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
extensionPluginRoute:
  parameters:
  - "$ref": "../components/parameters.yaml#/ExtensionID"
  - "$ref": "../components/parameters.yaml#/ExtensionPluginPath"
  get:
    summary: Invoke a declared plugin route
    description: Proxies a plugin-declared GET route under /api/v1/extensions/{extensionID}/* after host-side manifest matching and access checks. Plugins cannot override core API routes.
    responses:
      '200':
        description: Plugin-defined response.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '405':
        description: Plugin route exists but does not declare this HTTP method.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
  post:
    summary: Invoke a declared plugin route
    description: Proxies a plugin-declared unsafe route only after the host verifies the current actor and any manifest-declared permission.
    responses:
      '200':
        description: Plugin-defined response.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '405':
        description: Plugin route exists but does not declare this HTTP method.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
