health:
  get:
    summary: Liveness health check
    description: |
      Cheap process liveness probe. Does not check PostgreSQL, Redis, or
      optional dependencies. Use `/ready` for readiness.
    operationId: getHealth
    responses:
      '200':
        description: Service process is alive.
        content:
          application/json:
            schema:
              "$ref": "../schemas/system.yaml#/ApiResponseHealth"
ready:
  get:
    summary: Readiness probe
    description: |
      Dependency readiness. PostgreSQL is required (failure → 503).
      Redis failures are reported as component errors but the
      overall status remains ready with `status: degraded` (F1 policy).
    operationId: getReady
    responses:
      '200':
        description: Safe to receive traffic (possibly degraded optional deps).
        content:
          application/json:
            schema:
              "$ref": "../schemas/system.yaml#/ApiResponseReady"
      '503':
        description: Not ready (required dependency failed).
        content:
          application/json:
            schema:
              "$ref": "../schemas/system.yaml#/ApiResponseReady"
adminOverview:
  get:
    summary: Get admin overview dashboard metrics
    operationId: getAdminOverview
    security:
    - cookieAuth: []
    responses:
      '200':
        description: Aggregated system, community, moderation, attachment, and extension metrics for the admin overview dashboard.
        content:
          application/json:
            schema:
              "$ref": "../schemas/system.yaml#/ApiResponseAdminOverview"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminOverviewResources:
  get:
    summary: Get lightweight admin overview resource metrics
    description: |
      Process memory/CPU and filesystem disk usage only. Intended for high-frequency
      dashboard polling; does not query community KPIs, trends, or extension widgets.
    operationId: getAdminOverviewResources
    security:
    - cookieAuth: []
    responses:
      '200':
        description: Lightweight runtime resource snapshot for admin resource cards.
        content:
          application/json:
            schema:
              "$ref": "../schemas/system.yaml#/ApiResponseAdminOverviewResources"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminSystemUpdates:
  get:
    summary: Get the cached SForum release status
    description: |
      Returns the current build and latest known GitHub release status. Successful
      checks are cached for six hours and failed checks for ten minutes. Requires
      `admin.access`.
    operationId: getAdminSystemUpdates
    security:
    - cookieAuth: []
    responses:
      '200':
        description: Current release status, including an unavailable or development state when no comparison can be made.
        content:
          application/json:
            schema:
              "$ref": "../schemas/system.yaml#/ApiResponseSystemUpdateStatus"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminSystemUpdatesCheck:
  post:
    summary: Check GitHub releases immediately
    description: |
      Bypasses the normal release-status cache and performs a new outbound check.
      Requires `settings.site.manage`.
    operationId: checkAdminSystemUpdates
    security:
    - cookieAuth: []
    responses:
      '200':
        description: Fresh release status.
        content:
          application/json:
            schema:
              "$ref": "../schemas/system.yaml#/ApiResponseSystemUpdateStatus"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
