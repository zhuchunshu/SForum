RoleKey:
  name: roleKey
  in: path
  required: true
  schema:
    type: string
  description: Stable role key, such as member or moderator.
UserID:
  name: userID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric user id.
AttachmentPublicID:
  name: publicId
  in: path
  required: true
  schema:
    type: string
  description: Public attachment identifier returned by upload.
AttachmentID:
  name: attachmentID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric attachment id.
ExtensionID:
  name: extensionID
  in: path
  required: true
  schema:
    type: string
  description: Stable extension id from sforum.extension.json.
ExtensionPluginPath:
  name: pluginPath
  in: path
  required: true
  schema:
    type: string
  description: Slash-separated plugin route path after the extension id. The host only proxies paths declared by that plugin manifest.
TopicID:
  name: topicID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric topic id.
CommentID:
  name: commentID
  in: path
  required: true
  schema:
    type: integer
    format: int64
CategoryGroupID:
  name: categoryGroupID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric category group id.
CategoryID:
  name: categoryID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric category id.
TagID:
  name: tagID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric tag id.
TagSlug:
  name: tagSlug
  in: query
  schema:
    type: string
  description: Active tag slug used to filter public topics.
DatabaseSchema:
  name: schema
  in: path
  required: true
  schema:
    type: string
DatabaseTable:
  name: table
  in: path
  required: true
  schema:
    type: string
  description: Numeric comment id.
