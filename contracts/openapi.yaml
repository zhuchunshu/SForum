    AttachmentSettings:
      type: object
      required:
        - provider
        - uploadEnabled
        - pathTemplate
        - publicBaseUrl
        - maxFileSizeMb
        - allowedExtensions
        - allowedMimeTypes
        - defaultVisibility
        - cleanupOrphanAfterDays
        - local
        - aliyunOss
        - tencentCos
        - ftp
        - sftp
      properties:
        provider:
          $ref: "#/components/schemas/AttachmentProvider"
        uploadEnabled:
          type: boolean
        pathTemplate:
          type: string
          examples: ["{yyyy}/{mm}/{dd}/{public_id}{ext}"]
        publicBaseUrl:
          type: string
        maxFileSizeMb:
          type: integer
          minimum: 1
          maximum: 1024
        allowedExtensions:
          type: array
          items:
            type: string
          examples:
            - [.jpg, .jpeg, .png, .gif, .webp, .pdf, .txt, .zip]
        allowedMimeTypes:
          type: array
          items:
            type: string
          examples:
            - [image/jpeg, image/png, application/pdf]
        defaultVisibility:
          $ref: "#/components/schemas/AttachmentVisibility"
        cleanupOrphanAfterDays:
          type: integer
          minimum: 1
          maximum: 3650
        local:
          $ref: "#/components/schemas/AttachmentLocalSettings"
        aliyunOss:
          $ref: "#/components/schemas/AttachmentAliyunOSSSettings"
        tencentCos:
          $ref: "#/components/schemas/AttachmentTencentCOSSettings"
        ftp:
          $ref: "#/components/schemas/AttachmentFTPSettings"
        sftp:
          $ref: "#/components/schemas/AttachmentSFTPSettings"
    AttachmentLocalSettings:
      type: object
      required:
        - publicPrefix
      properties:
        publicPrefix:
          type: string
          description: Optional public URL prefix for locally stored objects. The physical root comes from ATTACHMENT_LOCAL_ROOT.
    AttachmentAliyunOSSSettings:
      type: object
      required:
        - endpoint
        - bucket
        - region
        - accessKeyId
        - accessKeySecretSet
      properties:
        endpoint:
          type: string
        bucket:
          type: string
        region:
          type: string
        accessKeyId:
          type: string
        accessKeySecret:
          type: string
          format: password
          description: Blank on update keeps the existing secret.
        accessKeySecretSet:
          type: boolean
    AttachmentTencentCOSSettings:
      type: object
      required:
        - region
        - bucket
        - secretId
        - secretKeySet
        - cdnDomain
      properties:
        region:
          type: string
        bucket:
          type: string
        secretId:
          type: string
        secretKey:
          type: string
          format: password
          description: Blank on update keeps the existing secret.
        secretKeySet:
          type: boolean
        cdnDomain:
          type: string
    AttachmentFTPSettings:
      type: object
      required:
        - host
        - port
        - username
        - passwordSet
        - rootPath
        - passive
        - explicitTls
        - publicBaseUrl
      properties:
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        username:
          type: string
        password:
          type: string
          format: password
          description: Blank on update keeps the existing secret.
        passwordSet:
          type: boolean
        rootPath:
          type: string
        passive:
          type: boolean
        explicitTls:
          type: boolean
        publicBaseUrl:
          type: string
    AttachmentSFTPSettings:
      type: object
      required:
        - host
        - port
        - username
        - passwordSet
        - privateKeySet
        - passphraseSet
        - rootPath
        - hostKeyFingerprint
        - publicBaseUrl
      properties:
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        username:
          type: string
        password:
          type: string
          format: password
          description: Blank on update keeps the existing secret.
        passwordSet:
          type: boolean
        privateKey:
          type: string
          format: password
          description: Blank on update keeps the existing private key.
        privateKeySet:
          type: boolean
        passphrase:
          type: string
          format: password
          description: Blank on update keeps the existing passphrase.
        passphraseSet:
          type: boolean
        rootPath:
          type: string
        hostKeyFingerprint:
          type: string
        publicBaseUrl:
          type: string
