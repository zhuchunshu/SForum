openapi: 3.1.0
info:
  title: SForum API
  version: 0.1.0
  description: Initial API contract for the SForum foundation.
servers:
  - url: /api/v1
paths:
  /auth/registration-status:
    get:
      summary: Get public registration bootstrap status
      operationId: getRegistrationStatus
      responses:
        "200":
          description: Public registration state used by the registration page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRegistrationStatus"
  /auth/register:
    post:
      summary: Register a forum account
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and session cookie issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCurrentUser"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Registration input or human verification is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                invalidFields:
                  summary: Registration fields need correction
                  value:
                    code: 422
                    message: 注册失败：请按标出的提示修改后再提交。
                    data:
                      reason: auth.register_invalid
                      fields:
                        username:
                          - 请填写用户名。
                        email:
                          - 邮箱格式不正确，请填写可接收邮件的地址。
                        password:
                          - 密码至少需要 12 个字符。
                humanVerificationRequired:
                  summary: Human verification is required
                  value:
                    code: 422
                    message: 请先完成人机验证。
                    data:
                      reason: human_verification.required
                      fields:
                        humanVerification:
                          - 请先完成人机验证。
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /human-verification/challenge:
    get:
      summary: Create a human verification challenge
      operationId: createHumanVerificationChallenge
      parameters:
        - name: purpose
          in: query
          required: true
          schema:
            type: string
            enum: [register]
          description: Verification purpose for rate limits and replay scope.
      responses:
        "200":
          description: ALTCHA challenge payload for the requested purpose.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAltchaChallenge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/login:
    post:
      summary: Log in with username or email
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session cookie issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /auth/logout:
    post:
      summary: Destroy the current browser session
      operationId: logout
      responses:
        "200":
          description: Session destroyed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseNull"
  /auth/session:
    get:
      summary: Get the current browser session user
      operationId: getCurrentSession
      responses:
        "200":
          description: Current authenticated forum user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseHealth"
  /web-options:
    get:
      summary: List public runtime web options
      operationId: listWebOptions
      responses:
        "200":
          description: Public runtime options used by the web frontend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWebOptionList"
    put:
      summary: Update a runtime web option
      operationId: updateWebOption
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebOptionInput"
      responses:
        "200":
          description: Option updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWebOption"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /web-options/{name}:
    get:
      summary: Get a public runtime web option
      operationId: getWebOption
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Option name, such as site.name.
      responses:
        "200":
          description: Public runtime option value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWebOption"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /roles:
    get:
      summary: List roles and user groups
      operationId: listRoles
      responses:
        "200":
          description: Roles visible to role managers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRoleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create a custom role
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: Role created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRole"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /roles/{roleKey}:
    patch:
      summary: Update a role alias and description
      operationId: updateRole
      parameters:
        - $ref: "#/components/parameters/RoleKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "200":
          description: Role updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRole"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      summary: Delete a custom role
      operationId: deleteRole
      parameters:
        - $ref: "#/components/parameters/RoleKey"
      responses:
        "200":
          description: Role deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseNull"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /roles/{roleKey}/permissions:
    put:
      summary: Replace permissions assigned to a role
      operationId: replaceRolePermissions
      parameters:
        - $ref: "#/components/parameters/RoleKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - permissions
              properties:
                permissions:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Role permissions replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseNull"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
components:
  parameters:
    RoleKey:
      name: roleKey
      in: path
      required: true
      schema:
        type: string
      description: Stable role key, such as member or moderator.
  responses:
    Unauthorized:
      description: Authentication is required or credentials are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Forbidden:
      description: The current user does not have permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Conflict:
      description: The request conflicts with a system invariant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    UnprocessableEntity:
      description: The request body is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    ApiErrorData:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Stable machine-readable reason code, such as auth.register_invalid.
        fields:
          type: object
          description: Localized field-level messages keyed by request field name. Registration uses username, email, password, and humanVerification.
          additionalProperties:
            type: array
            items:
              type: string
    ApiErrorResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: "#/components/schemas/ApiErrorData"
    ApiResponseNull:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          examples: [200]
        message:
          type: string
          examples: [OK]
        data:
          type: "null"
    ApiResponseCurrentUser:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: "#/components/schemas/CurrentUser"
    ApiResponseRegistrationStatus:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: "#/components/schemas/RegistrationStatus"
    ApiResponseRole:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: "#/components/schemas/Role"
    ApiResponseRoleList:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    ApiResponseAltchaChallenge:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: "#/components/schemas/AltchaChallenge"
    ApiResponseHealth:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: "#/components/schemas/Health"
    ApiResponseWebOption:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: "#/components/schemas/WebOption"
    ApiResponseWebOptionList:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebOption"
    Health:
      type: object
      required:
        - name
        - status
        - environment
        - locale
        - supportedLocales
        - time
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ok]
        environment:
          type: string
        locale:
          type: string
          examples: [zh-CN]
        supportedLocales:
          type: array
          items:
            type: string
        time:
          type: string
          format: date-time
    WebOption:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
          examples: [site.name]
        value:
          type: string
    WebOptionInput:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
          enum: [site.name]
        value:
          type: string
          minLength: 1
          maxLength: 80
    CurrentUser:
      type: object
      required:
        - id
        - username
        - displayName
        - locale
        - status
        - isInitialSuperAdmin
        - roleKeys
        - permissions
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        locale:
          type: string
        status:
          type: string
          enum: [active, disabled, banned]
        isInitialSuperAdmin:
          type: boolean
        roleKeys:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    RegistrationStatus:
      type: object
      required:
        - nextUserIsInitialSuperAdmin
      properties:
        nextUserIsInitialSuperAdmin:
          type: boolean
          description: True when no user exists yet and the next successful registration will become the initial super administrator.
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
        - humanVerification
      properties:
        username:
          type: string
          minLength: 1
          description: Trimmed username. Must not be blank.
        email:
          type: string
          format: email
          description: Trimmed email address. Must not be blank.
        password:
          type: string
          format: password
          minLength: 12
          description: Must contain at least 12 characters.
        displayName:
          type: string
          description: Optional display name. Blank values default to username.
        locale:
          type: string
        humanVerification:
          $ref: "#/components/schemas/HumanVerification"
    HumanVerification:
      type: object
      required:
        - provider
        - token
      properties:
        provider:
          type: string
          enum: [altcha]
        token:
          type: string
          description: Base64-encoded ALTCHA payload emitted by the widget.
    AltchaChallenge:
      type: object
      required:
        - parameters
      properties:
        parameters:
          type: object
          required:
            - algorithm
            - nonce
            - salt
            - cost
            - keyLength
            - keyPrefix
          properties:
            algorithm:
              type: string
              examples: [PBKDF2/SHA-256]
            nonce:
              type: string
            salt:
              type: string
            cost:
              type: integer
            keyLength:
              type: integer
            keyPrefix:
              type: string
            keySignature:
              type: string
            memoryCost:
              type: integer
            parallelism:
              type: integer
            expiresAt:
              type: integer
              format: int64
            data:
              type: object
              additionalProperties: true
        signature:
          type: string
    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          description: Username or email address.
        password:
          type: string
          format: password
    Role:
      type: object
      required:
        - id
        - key
        - alias
        - description
        - isSystem
        - isDefault
        - isDeletable
        - isEnabled
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
        alias:
          type: string
        description:
          type: string
        isSystem:
          type: boolean
        isDefault:
          type: boolean
        isDeletable:
          type: boolean
        isEnabled:
          type: boolean
    RoleInput:
      type: object
      properties:
        key:
          type: string
        alias:
          type: string
        description:
          type: string
