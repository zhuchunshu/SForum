openapi: 3.1.0
info:
  title: SForum API
  version: 0.1.0
  description: Initial API contract for the SForum foundation.
servers:
  - url: /api/v1
paths:
  /auth/registration-status:
    get:
      summary: Get public registration bootstrap status
      operationId: getRegistrationStatus
      responses:
        "200":
          description: Public registration state used by the registration page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRegistrationStatus"
  /auth/register:
    post:
      summary: Register a forum account
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and session cookie issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCurrentUser"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Registration input or human verification is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                invalidFields:
                  summary: Registration fields need correction
                  value:
                    code: 422
                    message: 注册失败：请按标出的提示修改后再提交。
                    data:
                      reason: auth.register_invalid
                      fields:
                        username:
                          - 请填写用户名。
                        email:
                          - 邮箱格式不正确，请填写可接收邮件的地址。
                        password:
                          - 密码至少需要 12 个字符。
                humanVerificationRequired:
                  summary: Human verification is required
                  value:
                    code: 422
                    message: 请先完成人机验证。
                    data:
                      reason: human_verification.required
                      fields:
                        humanVerification:
                          - 请先完成人机验证。
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Account was created but the server could not issue the automatic sign-in session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                sessionUnavailable:
                  summary: Automatic sign-in session could not be saved
                  value:
                    code: 503
                    message: 账号已创建，但自动登录失败，请直接登录。
                    data:
                      reason: auth.session_unavailable
  /human-verification/challenge:
    get:
      summary: Create a human verification challenge
      operationId: createHumanVerificationChallenge
      parameters:
        - name: purpose
          in: query
          required: true
          schema:
            type: string
            enum: [register]
          description: Verification purpose for rate limits and replay scope.
      responses:
        "200":
          description: ALTCHA challenge payload for the requested purpose.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAltchaChallenge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/login:
    post:
      summary: Log in with username or email
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session cookie issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /auth/logout:
    post:
      summary: Destroy the current browser session
      operationId: logout
      responses:
        "200":
          description: Session destroyed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseNull"
  /auth/session:
    get:
      summary: Get the current browser session user
      operationId: getCurrentSession
      responses:
        "200":
          description: Current authenticated forum user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseHealth"
  /web-options:
    get:
      summary: List public runtime web options
      operationId: listWebOptions
      responses:
        "200":
          description: Public runtime options used by the web frontend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWebOptionList"
    put:
      summary: Update a runtime web option
      operationId: updateWebOption
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebOptionInput"
      responses:
        "200":
          description: Option updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWebOption"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /web-options/{name}:
    get:
      summary: Get a public runtime web option
      operationId: getWebOption
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Option name, such as site.name.
      responses:
        "200":
          description: Public runtime option value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWebOption"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /admin/web-options:
    get:
      summary: List all runtime web options for administrators
      operationId: listAdminWebOptions
      responses:
        "200":
          description: Admin-visible runtime options. Secret values are masked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAdminWebOptionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      summary: Update runtime web options in a batch
      operationId: updateAdminWebOptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebOptionBatchInput"
      responses:
        "200":
          description: Options updated. Secret values are masked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAdminWebOptionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /attachments:
    post:
      summary: Upload an attachment
      operationId: uploadAttachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Attachment uploaded through the API server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAttachment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /attachments/{publicId}:
    get:
      summary: Get attachment metadata
      operationId: getAttachment
      parameters:
        - $ref: "#/components/parameters/AttachmentPublicID"
      responses:
        "200":
          description: Public attachment metadata allowed for the current actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAttachment"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /attachments/{publicId}/content:
    get:
      summary: Download or render attachment content
      operationId: getAttachmentContent
      parameters:
        - $ref: "#/components/parameters/AttachmentPublicID"
      responses:
        "200":
          description: Attachment bytes streamed from the configured provider.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admin/attachment-settings:
    get:
      summary: Get attachment runtime settings
      operationId: getAttachmentSettings
      responses:
        "200":
          description: Attachment storage and upload settings. Secret values are masked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAttachmentSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      summary: Update attachment runtime settings
      operationId: updateAttachmentSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentSettings"
      responses:
        "200":
          description: Attachment settings updated. Blank secret fields keep existing secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAttachmentSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /admin/attachment-settings/test:
    post:
      summary: Test the active attachment storage provider
      operationId: testAttachmentSettings
      responses:
        "200":
          description: Provider probe result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAttachmentProbe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/attachments:
    get:
      summary: List attachments for administration
      operationId: listAdminAttachments
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: perPage
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: query
          in: query
          schema:
            type: string
        - name: provider
          in: query
          schema:
            $ref: "#/components/schemas/AttachmentProvider"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/AttachmentStatus"
        - name: contentType
          in: query
          schema:
            type: string
        - name: ownerUserId
          in: query
          schema:
            type: integer
            format: int64
        - name: referenceStatus
          in: query
          schema:
            type: string
            enum: [referenced, orphan]
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paged attachment list for governance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAdminAttachmentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/attachments/cleanup:
    post:
      summary: Clean up deleted orphan attachments
      operationId: cleanupAdminAttachments
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 500
      responses:
        "200":
          description: Cleanup result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAttachmentCleanup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/attachments/{attachmentID}:
    get:
      summary: Get attachment detail for administration
      operationId: getAdminAttachment
      parameters:
        - $ref: "#/components/parameters/AttachmentID"
      responses:
        "200":
          description: Attachment detail including object key, checksum, and references.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAdminAttachmentDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update attachment status
      operationId: updateAdminAttachment
      parameters:
        - $ref: "#/components/parameters/AttachmentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        "200":
          description: Attachment status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAdminAttachment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      summary: Soft-delete an unreferenced attachment
      operationId: deleteAdminAttachment
      parameters:
        - $ref: "#/components/parameters/AttachmentID"
      responses:
        "200":
          description: Attachment marked as deleted. Physical cleanup is handled by the orphan cleanup path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAdminAttachment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /permissions:
    get:
      summary: List global permissions
      operationId: listPermissions
      responses:
        "200":
          description: Permission catalog visible to role or user managers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePermissionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /permissions/matrix:
    get:
      summary: List role permission matrix
      operationId: listPermissionMatrix
      responses:
        "200":
          description: Permission catalog with permissions assigned to each role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePermissionMatrix"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /roles:
    get:
      summary: List roles and user groups
      operationId: listRoles
      responses:
        "200":
          description: Roles visible to role managers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRoleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create a custom role
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: Role created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRole"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /roles/{roleKey}:
    patch:
      summary: Update a role alias and description
      operationId: updateRole
      parameters:
        - $ref: "#/components/parameters/RoleKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "200":
          description: Role updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRole"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      summary: Delete a custom role
      operationId: deleteRole
      parameters:
        - $ref: "#/components/parameters/RoleKey"
      responses:
        "200":
          description: Role deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseNull"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /roles/{roleKey}/permissions:
    put:
      summary: Replace permissions assigned to a role
      operationId: replaceRolePermissions
      parameters:
        - $ref: "#/components/parameters/RoleKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - permissions
              properties:
                permissions:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Role permissions replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseNull"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /users:
    get:
      summary: List users for administration
      operationId: listAdminUsers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: perPage
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: query
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, disabled, banned]
        - name: roleKey
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paged admin user list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAdminUserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/{userID}:
    get:
      summary: Get an admin user detail
      operationId: getAdminUser
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: User detail with effective permissions and direct overrides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAdminUserDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /users/{userID}/roles:
    put:
      summary: Replace roles assigned to a user
      operationId: replaceUserRoles
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRolesInput"
      responses:
        "200":
          description: User roles replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAdminUserDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /users/{userID}/permission-overrides:
    put:
      summary: Replace direct permission overrides for a user
      operationId: replaceUserPermissionOverrides
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPermissionOverridesInput"
      responses:
        "200":
          description: User direct permission overrides replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAdminUserDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
components:
  parameters:
    RoleKey:
      name: roleKey
      in: path
      required: true
      schema:
        type: string
      description: Stable role key, such as member or moderator.
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Numeric user id.
    AttachmentPublicID:
      name: publicId
      in: path
      required: true
      schema:
        type: string
      description: Public attachment identifier returned by upload.
    AttachmentID:
      name: attachmentID
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Numeric attachment id.
  responses:
    Unauthorized:
      description: Authentication is required or credentials are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Forbidden:
      description: The current user does not have permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Conflict:
      description: The request conflicts with a system invariant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    UnprocessableEntity:
      description: The request body is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    ServiceUnavailable:
      description: A required backend service or storage provider is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    ApiErrorData:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Stable machine-readable reason code, such as auth.register_invalid.
        fields:
          type: object
          description: Localized field-level messages keyed by request field name. Registration uses username, email, password, and humanVerification.
          additionalProperties:
            type: array
            items:
              type: string
    ApiErrorResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: "#/components/schemas/ApiErrorData"
    ApiResponseNull:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          examples: [200]
        message:
          type: string
          examples: [OK]
        data:
          type: "null"
    ApiResponseCurrentUser:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: "#/components/schemas/CurrentUser"
    ApiResponseRegistrationStatus:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: "#/components/schemas/RegistrationStatus"
    ApiResponseRole:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: "#/components/schemas/Role"
    ApiResponseRoleList:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    ApiResponsePermissionList:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
