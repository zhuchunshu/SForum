        - locale
        - status
        - isInitialSuperAdmin
        - roleKeys
        - permissions
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        locale:
          type: string
        status:
          type: string
          enum: [active, disabled, banned]
        isInitialSuperAdmin:
          type: boolean
        roleKeys:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
