openapi: 3.1.0
info:
  title: SForum API
  version: 0.1.0
  description: |
    Initial API contract for the SForum foundation.

    ## CSRF Protection

    All unsafe methods (POST/PUT/PATCH/DELETE) under `/api/v1` are protected by
    a double-submit CSRF token. The server sets a readable `csrf_` cookie on any
    safe (GET/HEAD/OPTIONS) request; clients must echo its value in an
    `X-Csrf-Token` header on every unsafe request. Missing or mismatched tokens
    are rejected with `403` and reason `csrf.invalid`; untrusted `Origin`/
    `Referer` are rejected with reason `csrf.origin_invalid`. Trusted origins
    are configured via `CSRF_TRUSTED_ORIGINS` (defaults to the `APP_URL` origin).
