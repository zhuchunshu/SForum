openapi: 3.1.0
info:
  title: SForum Commerce Workflow Reference
  version: 1.0.0
paths:
  /api/commerce-workflow/orders:
    get:
      operationId: sforumCommerceWorkflowListOrders
      summary: List reference commerce orders
      responses:
        "200":
          description: Order list
  /api/commerce-workflow/events:
    get:
      operationId: sforumCommerceWorkflowOrderEvents
      summary: Stream order events (SSE)
      responses:
        "200":
          description: Server-sent events
  /api/commerce-workflow/stream:
    get:
      operationId: sforumCommerceWorkflowBinaryStream
      summary: Opaque binary stream for order export chunks
      responses:
        "200":
          description: Binary stream
  /api/commerce-workflow/managed-orders:
    get:
      operationId: sforumCommerceWorkflowManagedOrders
      summary: List orders behind the package custom guard
      responses:
        "200":
          description: Managed order list
