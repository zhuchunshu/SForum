<!-- sforum.page.home@1 — Nocturne 拥有壳层与 hero；body 岛挂载宿主 SFHomePage -->
<div class="sf-page sf-page--home sf-page--nocturne" data-page="forum.home" data-theme="nocturne-harbor" data-theme-owned="presentation">
  <sf-navbar></sf-navbar>
  <div class="sf-theme-chrome-body" data-theme-region="body">
    <header class="nh-hero" aria-label="Nocturne Harbor" data-theme-region="home-hero">
      <div class="nh-hero__panel">
        <p class="nh-hero__eyebrow">{{siteName}}</p>
        <h1 class="nh-hero__title">Nocturne Harbor</h1>
        <p class="nh-hero__copy">Deep navy surfaces, cyan signals, and a calm night-harbor chrome for late-night discussions.</p>
      </div>
    </header>
    <div class="nh-home-body" data-theme-region="home-body">
      <sf-home-page></sf-home-page>
    </div>
  </div>
  <sf-footer></sf-footer>
</div>
