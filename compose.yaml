name: ${COMPOSE_PROJECT_NAME:-sforum}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sforum}
      POSTGRES_USER: ${POSTGRES_USER:-sforum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sforum}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sforum} -d ${POSTGRES_DB:-sforum}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1
    environment:
      MEILI_ENV: ${APP_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-sforum-dev-meili-key}
    volumes:
      - meili_data:/meili_data

  api:
    build:
      context: ./apps/api
      target: api
    environment:
      APP_NAME: ${APP_NAME:-SForum}
      APP_ENV: ${APP_ENV:-development}
      APP_LOCALE: ${APP_LOCALE:-zh-CN}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-zh-CN,en-US}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgres://sforum:sforum@postgres:5432/sforum?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      MEILI_HOST: ${MEILI_HOST:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-sforum-dev-meili-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started

  worker:
    build:
      context: ./apps/api
      target: worker
    environment:
      APP_NAME: ${APP_NAME:-SForum}
      APP_ENV: ${APP_ENV:-development}
      APP_LOCALE: ${APP_LOCALE:-zh-CN}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-zh-CN,en-US}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgres://sforum:sforum@postgres:5432/sforum?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      MEILI_HOST: ${MEILI_HOST:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-sforum-dev-meili-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started

  web:
    build:
      context: ./apps/web
      target: prod
    environment:
      APP_NAME: ${APP_NAME:-SForum}
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://127.0.0.1:3000}
      APP_LOCALE: ${APP_LOCALE:-zh-CN}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-zh-CN,en-US}
      NUXT_PUBLIC_I18N_BASE_URL: ${APP_URL:-http://127.0.0.1:3000}
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-/api/v1}
      NUXT_API_INTERNAL_BASE_URL: ${NUXT_API_INTERNAL_BASE_URL:-http://api:8080/api/v1}

volumes:
  postgres_data:
  redis_data:
  meili_data:
