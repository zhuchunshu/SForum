name: Release tooling

on:
  pull_request:
    paths:
      - .github/workflows/release-tooling.yml
      - scripts/release_test.sh
      - scripts/ci/**
      - deploy/**
      - tests/validate-docs_test.sh
      - tests/validate-builtin-plugin-versions.mjs
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-tooling.yml
      - scripts/release_test.sh
      - scripts/ci/**
      - deploy/**
      - tests/validate-docs_test.sh
      - tests/validate-builtin-plugin-versions.mjs

permissions:
  contents: read

concurrency:
  group: release-tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Release and deploy tooling gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run release tooling gates
        run: ./scripts/ci/release-tooling-gate.sh
