name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate when called by another workflow
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            tests/compat/go.sum
            tools/proto/go.sum
            extensions/builtin/plugins/*/backend/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Run repository test gate
        env:
          CI: "true"
        run: ./scripts/test.sh

      - name: Build Go commands
        working-directory: apps/api
        run: go build ./...

      - name: Run all web unit tests
        working-directory: apps/web
        run: bun test

      - name: Build production web app
        working-directory: apps/web
        run: bun run build

      - name: Reject generated or module drift
        run: git diff --exit-code

  containers:
    name: Container / ${{ matrix.image }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
            target: api
          - image: worker
            dockerfile: apps/api/Dockerfile
            target: worker
          - image: migrate
            dockerfile: apps/api/Dockerfile
            target: migrate
          - image: web
            dockerfile: apps/web/Dockerfile
            target: prod
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image }}
