name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate when called by another workflow
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sforum
          POSTGRES_USER: sforum
          POSTGRES_PASSWORD: sforum
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U sforum -d sforum"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            tests/compat/go.sum
            tools/proto/go.sum
            extensions/builtin/plugins/*/backend/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Run database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://sforum:sforum@127.0.0.1:15432/sforum?sslmode=disable
        run: go run ./cmd/migrate

      - name: Run repository test gate
        env:
          CI: "true"
          SFORUM_COMPAT_DATABASE_URL: postgres://sforum:sforum@127.0.0.1:15432/sforum?sslmode=disable
          SFORUM_BUILTIN_VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/test.sh

      - name: Build Go commands
        working-directory: apps/api
        run: go build ./...

      - name: Run all web unit tests
        working-directory: apps/web
        run: bun test

      - name: Build production web app
        working-directory: apps/web
        run: bun run build

      - name: Reject generated or module drift
        run: git diff --exit-code

  containers:
    name: Container / ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
            target: api
            cache_scope: ci-backend
            cache_writer: true
          - image: worker
            dockerfile: apps/api/Dockerfile
            target: worker
            cache_scope: ci-backend
            cache_writer: false
          - image: migrate
            dockerfile: apps/api/Dockerfile
            target: migrate
            cache_scope: ci-backend
            cache_writer: false
          - image: web
            dockerfile: apps/web/Dockerfile
            target: prod
            cache_scope: ci-web
            cache_writer: true
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          load: ${{ matrix.image == 'web' }}
          tags: ${{ matrix.image == 'web' && 'sforum-web:ci' || '' }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: ${{ matrix.cache_writer && github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.cache_scope) || '' }}

      - name: Scan Web runtime image
        if: matrix.image == 'web'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: sforum-web:ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
