name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
      sha: ${{ steps.version.outputs.sha }}
      commit: ${{ steps.version.outputs.commit }}
      build_time: ${{ steps.version.outputs.build_time }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve and validate release version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must look like v2.8.0 or v2.8.0-beta.1" >&2
            exit 1
          fi
          if [[ "$REQUESTED_TAG" == *-* ]]; then
            stable=false
          else
            stable=true
          fi
          commit="$(git rev-parse HEAD)"
          build_time="$(git show -s --format=%cI HEAD)"
          {
            echo "tag=$REQUESTED_TAG"
            echo "version=${REQUESTED_TAG#v}"
            echo "stable=$stable"
            echo "commit=$commit"
            echo "build_time=$build_time"
            echo "sha=sha-$commit"
          } >> "$GITHUB_OUTPUT"

  verify-ci:
    name: Verify main CI
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Verify release commit belongs to main
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main; then
            echo "Release commit $RELEASE_COMMIT is not reachable from origin/main" >&2
            exit 1
          fi

      - name: Wait for exact main CI result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: ./scripts/ci/verify-main-ci.sh "$RELEASE_COMMIT"

  publish-candidate:
    name: Publish candidate / ${{ matrix.image }}
    needs:
      - prepare
      - verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sforum-api
            dockerfile: apps/api/Dockerfile
            target: api
            ci_cache: ci-api
          - image: sforum-worker
            dockerfile: apps/api/Dockerfile
            target: worker
            ci_cache: ci-worker
          - image: sforum-migrate
            dockerfile: apps/api/Dockerfile
            target: migrate
            ci_cache: ci-migrate
          - image: sforum-web
            dockerfile: apps/web/Dockerfile
            target: prod
            ci_cache: ci-web
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: type=raw,value=${{ needs.prepare.outputs.sha }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}

      - name: Build and push multi-platform candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SFORUM_VERSION=${{ needs.prepare.outputs.version }}
            SFORUM_COMMIT=${{ needs.prepare.outputs.commit }}
            SFORUM_BUILD_TIME=${{ needs.prepare.outputs.build_time }}
          cache-from: |
            type=gha,scope=${{ matrix.ci_cache }}
            type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Scan published image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  smoke:
    name: Published image smoke test
    needs:
      - prepare
      - publish-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start exact published images
        env:
          SFORUM_REGISTRY: ${{ env.REGISTRY }}/${{ github.repository_owner }}
        run: >-
          ./scripts/ci/release-smoke.sh
          "${{ needs.prepare.outputs.sha }}"
          "${{ needs.prepare.outputs.version }}"
          "${{ needs.prepare.outputs.commit }}"

  release-assets:
    name: Release asset / ${{ matrix.goos }} / ${{ matrix.goarch }}
    needs:
      - prepare
      - publish-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Log in to GHCR for Linux bundle extraction
        if: matrix.goos == 'linux'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release assets
        env:
          SFORUM_REGISTRY: ${{ env.REGISTRY }}/${{ github.repository_owner }}
        run: >-
          ./scripts/ci/build-release-assets.sh
          "${{ needs.prepare.outputs.version }}"
          "${{ needs.prepare.outputs.commit }}"
          "${{ needs.prepare.outputs.build_time }}"
          "${{ needs.prepare.outputs.sha }}"
          "${{ matrix.goos }}"
          "${{ matrix.goarch }}"
          "$GITHUB_WORKSPACE/dist"

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-asset-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  verify-release-assets:
    name: Verify release assets
    needs:
      - prepare
      - release-assets
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download release asset matrix
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-asset-*
          path: dist
          merge-multiple: true

      - name: Verify release assets and generate checksums
        run: ./scripts/ci/finalize-release-assets.sh "${{ needs.prepare.outputs.version }}" dist

      - name: Attest release assets
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/*

      - name: Upload verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-assets
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  promote:
    name: Promote / ${{ matrix.image }}
    needs:
      - prepare
      - smoke
      - verify-release-assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - sforum-api
          - sforum-worker
          - sforum-migrate
          - sforum-web
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          CANDIDATE_TAG: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          STABLE: ${{ needs.prepare.outputs.stable }}
        run: |
          tags=(--tag "$IMAGE:$RELEASE_TAG" --tag "$IMAGE:$VERSION")
          if [[ "$STABLE" == "true" ]]; then
            major_minor="${VERSION%.*}"
            tags+=(--tag "$IMAGE:$major_minor" --tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$CANDIDATE_TAG"

  github-release:
    name: Create GitHub release
    needs:
      - prepare
      - promote
      - verify-release-assets
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verified-release-assets
          path: dist

      - name: Create release after image promotion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          STABLE: ${{ needs.prepare.outputs.stable }}
        run: |
          shopt -s nullglob
          assets=(dist/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No verified release assets are available" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if [[ -z "$existing_assets" ]]; then
              gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
              echo "Added verified assets to existing GitHub Release $RELEASE_TAG"
              exit 0
            fi
            local_names="$(printf '%s\n' "${assets[@]##*/}" | sort)"
            remote_names="$(sort <<< "$existing_assets")"
            if [[ "$local_names" != "$remote_names" ]]; then
              echo "GitHub Release $RELEASE_TAG has a partial or conflicting asset set; refusing to overwrite it" >&2
              exit 1
            fi
            remote_dir="$(mktemp -d)"
            trap 'rm -rf "$remote_dir"' EXIT
            gh release download "$RELEASE_TAG" --dir "$remote_dir" --repo "$GITHUB_REPOSITORY"
            for asset in "${assets[@]}"; do
              asset_name="$(basename "$asset")"
              if ! cmp -s "$asset" "$remote_dir/$asset_name"; then
                echo "GitHub Release $RELEASE_TAG asset $asset_name differs from the verified artifact; refusing to overwrite it" >&2
                exit 1
              fi
            done
            echo "GitHub Release $RELEASE_TAG already contains the exact verified asset set"
            exit 0
          fi
          args=(--verify-tag --generate-notes --title "SForum $RELEASE_TAG")
          if [[ "$STABLE" != "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" "${args[@]}" --repo "$GITHUB_REPOSITORY"
