name: Host API v2 drift

on:
  pull_request:
    paths:
      - .github/workflows/host-api-v2-drift.yml
      - apps/api/app/Support/Extensions/protocol_v2_*.go
      - apps/api/sdk/plugin/v2/gen/**
      - contracts/proto/**
      - docs/extensions/authoring-guide.md
      - docs/extensions/host-api-v2.md
      - scripts/proto.sh
      - scripts/test.sh
      - tests/validate-host-api-v2-docs.mjs
      - tools/proto/go.mod
      - tools/proto/go.sum
  push:
    branches:
      - main
    paths:
      - .github/workflows/host-api-v2-drift.yml
      - apps/api/app/Support/Extensions/protocol_v2_*.go
      - apps/api/sdk/plugin/v2/gen/**
      - contracts/proto/**
      - docs/extensions/authoring-guide.md
      - docs/extensions/host-api-v2.md
      - scripts/proto.sh
      - scripts/test.sh
      - tests/validate-host-api-v2-docs.mjs
      - tools/proto/go.mod
      - tools/proto/go.sum

permissions:
  contents: read

concurrency:
  group: host-api-v2-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/proto/go.mod
          cache-dependency-path: tools/proto/go.sum

      - name: Check generated Protobuf SDK
        run: ./scripts/proto.sh check

      - name: Check Host API v2 documentation
        run: node tests/validate-host-api-v2-docs.mjs
