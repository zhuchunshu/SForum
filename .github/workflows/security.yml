name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Go code
        if: matrix.language == 'go'
        working-directory: apps/api
        run: go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          category: /language:${{ matrix.language }}

  govulncheck:
    name: Govulncheck / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-api
            module: apps/api
          - name: auth-github
            module: extensions/builtin/plugins/sforum-auth-github/backend
          - name: content-policy
            module: extensions/builtin/plugins/sforum-content-policy/backend
          - name: search-site
            module: extensions/builtin/plugins/sforum-search-site/backend
          - name: smtp
            module: extensions/builtin/plugins/sforum-smtp/backend
          - name: storage-fs
            module: extensions/builtin/plugins/sforum-storage-fs/backend
          - name: storage-s3
            module: extensions/builtin/plugins/sforum-storage-s3/backend
          - name: web-push
            module: extensions/builtin/plugins/sforum-web-push/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan reachable Go vulnerabilities
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          repo-checkout: false
          go-version-input: 1.26.6
          cache-dependency-path: ${{ matrix.module }}/go.sum
          work-dir: ${{ matrix.module }}
          go-package: ./...
