root = "."
tmp_dir = "tmp"
# storage/builtin-dev/air.env 由 scripts/build-builtin-plugins.sh 生成，覆盖 BUILTIN_EXTENSION_ROOT。
env_files = ["../../.env", "../../storage/builtin-dev/air.env"]

[build]
cmd = "go build -o ./tmp/sforum-worker ./cmd/worker"
entrypoint = ["./tmp/sforum-worker"]
include_dir = ["app", "bootstrap", "cmd", "config", "database"]
include_ext = ["go"]
exclude_dir = ["tmp", "vendor", "storage", "database/sqlc", "app/Models/Attachments/storage"]
exclude_regex = ["_test\\.go"]
delay = 200
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[misc]
clean_on_exit = true
