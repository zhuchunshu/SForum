root = "."
tmp_dir = "tmp"
env_files = ["../../.env"]

[build]
cmd = "go build -o ./tmp/sforum-worker ./cmd/worker"
bin = "./tmp/sforum-worker"
include_ext = ["go"]
exclude_dir = ["tmp", "vendor", "internal/store/sqlc"]
exclude_regex = ["_test\\.go"]
delay = 200
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[misc]
clean_on_exit = true
