root = "."
tmp_dir = "tmp"
env_files = ["../../.env"]

[build]
cmd = "go build -o ./tmp/sforum-api ./cmd/api"
entrypoint = ["./tmp/sforum-api"]
include_dir = ["app", "bootstrap", "cmd", "config", "database"]
include_ext = ["go"]
exclude_dir = ["tmp", "vendor", "storage", "database/sqlc", "app/Models/Attachments/storage"]
exclude_regex = ["_test\\.go"]
delay = 200
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[misc]
clean_on_exit = true
