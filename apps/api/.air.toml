root = "."
tmp_dir = "tmp"
# storage/builtin-dev/air.env 由 scripts/build-builtin-plugins.sh 生成，覆盖 BUILTIN_EXTENSION_ROOT。
env_files = ["../../.env", "../../storage/builtin-dev/air.env"]

[build]
# Air 会在 pre_cmd 之前停止旧 API；这里只防御性检查端口，插件孤儿由新 API 内的延迟 reaper 清理。
pre_cmd = ["bash ../../scripts/free-api-dev-port.sh"]
cmd = "go build -o ./tmp/sforum-api ./cmd/api"
entrypoint = ["./tmp/sforum-api"]
include_dir = ["app", "bootstrap", "cmd", "config", "database"]
include_ext = ["go"]
exclude_dir = ["tmp", "vendor", "storage", "database/sqlc", "app/Models/Attachments/storage"]
exclude_regex = ["_test\\.go"]
# 合并编辑器的连续写入，减少对尚未完整的多文件修改进行编译。
delay = 500
# 编译失败时重新运行上一个成功二进制，避免开发 API 一直中断到下次保存。
stop_on_error = false
send_interrupt = true
# 给 Fiber graceful shutdown 留足时间；过短会导致新旧进程同时 bind。
kill_delay = "2s"

[log]
time = true

[misc]
clean_on_exit = true
