services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    profiles:
      - tools
    environment:
      APP_NAME: ${APP_NAME:-SForum}
      APP_ENV: ${APP_ENV:-production}
      APP_LOCALE: ${APP_LOCALE:-zh-CN}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-zh-CN,en-US}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgres://sforum:change-me@postgres:5432/sforum?sslmode=require}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      target: api
    environment:
      APP_URL: ${APP_URL:-https://forum.example.com}
    restart: unless-stopped

  worker:
    build:
      target: worker
    restart: unless-stopped

  web:
    build:
      target: prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      APP_NAME: ${APP_NAME:-SForum}
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL:-https://forum.example.com}
      APP_LOCALE: ${APP_LOCALE:-zh-CN}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-zh-CN,en-US}
      NUXT_PUBLIC_I18N_BASE_URL: ${APP_URL:-https://forum.example.com}
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-/api/v1}
      NUXT_API_INTERNAL_BASE_URL: ${NUXT_API_INTERNAL_BASE_URL:-http://api:8080/api/v1}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  meilisearch:
    restart: unless-stopped
