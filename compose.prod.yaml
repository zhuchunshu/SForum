services:
  api:
    build:
      target: api
    restart: unless-stopped

  worker:
    build:
      target: worker
    restart: unless-stopped

  web:
    build:
      target: prod
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-/api/v1}
      NUXT_API_INTERNAL_BASE_URL: ${NUXT_API_INTERNAL_BASE_URL:-http://api:8080/api/v1}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  meilisearch:
    restart: unless-stopped
