services:
  api:
    build:
      target: dev
    command: ["air", "-c", ".air.toml"]
    volumes:
      - ./apps/api:/app
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app
          ignore:
            - tmp/
        - action: rebuild
          path: ./apps/api/go.mod
        - action: rebuild
          path: ./apps/api/go.sum

  worker:
    build:
      target: dev
    command: ["air", "-c", ".air.worker.toml"]
    volumes:
      - ./apps/api:/app
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app
          ignore:
            - tmp/
        - action: rebuild
          path: ./apps/api/go.mod
        - action: rebuild
          path: ./apps/api/go.sum

  web:
    build:
      target: dev
    command: ["bun", "run", "dev"]
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app
          ignore:
            - .nuxt/
            - .output/
            - node_modules/
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/bun.lock
        - action: rebuild
          path: ./apps/web/nuxt.config.ts

  mailpit:
    image: axllent/mailpit:latest

volumes:
  web_node_modules:
