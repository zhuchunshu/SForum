services:
  migrate:
    build:
      context: ./apps/api
      target: dev
    command: ["go", "run", "./cmd/migrate"]
    environment:
      APP_NAME: ${APP_NAME:-SForum}
      APP_ENV: ${APP_ENV:-development}
      APP_LOCALE: ${APP_LOCALE:-zh-CN}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-zh-CN,en-US}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgres://sforum:sforum@postgres:5432/sforum?sslmode=disable}
      GOMODCACHE: /go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - go_build_cache:/root/.cache/go-build
      - go_module_cache:/go/pkg/mod
    restart: "no"

  api:
    build:
      target: dev
    command: ["air", "-c", ".air.toml"]
    environment:
      GOMODCACHE: /go/pkg/mod
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/api:/app
      - go_build_cache:/root/.cache/go-build
      - go_module_cache:/go/pkg/mod
      - api_air_tmp:/app/tmp
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app
          ignore:
            - tmp/
            - bin/
            - coverage/
            - coverage.out
            - "*.test"
            - "*.out"
            - "*.prof"
            - "*.coverprofile"
        - action: rebuild
          path: ./apps/api/go.mod
        - action: rebuild
          path: ./apps/api/go.sum

  worker:
    profiles:
      - worker
    build:
      target: dev
    command: ["air", "-c", ".air.worker.toml"]
    environment:
      GOMODCACHE: /go/pkg/mod
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/api:/app
      - go_build_cache:/root/.cache/go-build
      - go_module_cache:/go/pkg/mod
      - worker_air_tmp:/app/tmp
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app
          ignore:
            - tmp/
            - bin/
            - coverage/
            - coverage.out
            - "*.test"
            - "*.out"
            - "*.prof"
            - "*.coverprofile"
        - action: rebuild
          path: ./apps/api/go.mod
        - action: rebuild
          path: ./apps/api/go.sum

  web:
    build:
      target: dev
    command: ["bun", "run", "dev"]
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app
          ignore:
            - .nuxt/
            - .output/
            - .nitro/
            - .vite/
            - .cache/
            - dist/
            - coverage/
            - node_modules/
            - playwright-report/
            - test-results/
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/bun.lock
        - action: rebuild
          path: ./apps/web/nuxt.config.ts

  mailpit:
    image: axllent/mailpit:latest

volumes:
  go_build_cache:
  go_module_cache:
  api_air_tmp:
  worker_air_tmp:
  web_node_modules:
