services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"

  meilisearch:
    ports:
      - "127.0.0.1:${MEILI_PORT:-17700}:7700"

  migrate:
    build:
      context: ./apps/api
      target: dev
    command: ["go", "run", "./cmd/migrate"]
    environment:
      APP_NAME: ${APP_NAME:-SForum}
      APP_ENV: ${APP_ENV:-development}
      APP_LOCALE: ${APP_LOCALE:-zh-CN}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-zh-CN,en-US}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-sforum}:${POSTGRES_PASSWORD:-sforum}@postgres:5432/${POSTGRES_DB:-sforum}?sslmode=disable
      GOMODCACHE: /go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - go_build_cache:/root/.cache/go-build
      - go_module_cache:/go/pkg/mod
    restart: "no"

  api:
    build:
      target: dev
    command: ["air", "-c", ".air.toml"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sforum}:${POSTGRES_PASSWORD:-sforum}@postgres:5432/${POSTGRES_DB:-sforum}?sslmode=disable
      REDIS_ADDR: redis:6379
      MEILI_HOST: http://meilisearch:7700
      ATTACHMENT_LOCAL_ROOT: /var/lib/sforum/uploads
      GOMODCACHE: /go/pkg/mod
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/api:/app
      - go_build_cache:/root/.cache/go-build
      - go_module_cache:/go/pkg/mod
      - api_air_tmp:/app/tmp
      - attachment_uploads:/var/lib/sforum/uploads
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app
          ignore:
            - tmp/
            - bin/
            - coverage/
            - coverage.out
            - "*.test"
            - "*.out"
            - "*.prof"
            - "*.coverprofile"
        - action: rebuild
          path: ./apps/api/go.mod
        - action: rebuild
          path: ./apps/api/go.sum

  worker:
    profiles:
      - worker
    build:
      target: dev
    command: ["air", "-c", ".air.worker.toml"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sforum}:${POSTGRES_PASSWORD:-sforum}@postgres:5432/${POSTGRES_DB:-sforum}?sslmode=disable
      REDIS_ADDR: redis:6379
      MEILI_HOST: http://meilisearch:7700
      ATTACHMENT_LOCAL_ROOT: /var/lib/sforum/uploads
      GOMODCACHE: /go/pkg/mod
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/api:/app
      - go_build_cache:/root/.cache/go-build
      - go_module_cache:/go/pkg/mod
      - worker_air_tmp:/app/tmp
      - attachment_uploads:/var/lib/sforum/uploads
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app
          ignore:
            - tmp/
            - bin/
            - coverage/
            - coverage.out
            - "*.test"
            - "*.out"
            - "*.prof"
            - "*.coverprofile"
        - action: rebuild
          path: ./apps/api/go.mod
        - action: rebuild
          path: ./apps/api/go.sum

  web:
    build:
      target: dev
    command: ["bun", "run", "dev"]
    environment:
      NUXT_API_INTERNAL_BASE_URL: http://api:8080/api/v1
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app
          ignore:
            - .nuxt/
            - .output/
            - .nitro/
            - .vite/
            - .cache/
            - dist/
            - coverage/
            - node_modules/
            - playwright-report/
            - test-results/
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/bun.lock
        - action: rebuild
          path: ./apps/web/nuxt.config.ts

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025"

volumes:
  go_build_cache:
  go_module_cache:
  api_air_tmp:
  worker_air_tmp:
  web_node_modules:
  attachment_uploads:
