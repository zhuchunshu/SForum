services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  meilisearch:
    ports:
      - "${MEILI_PORT:-7700}:7700"

  api:
    build:
      target: dev
    command: ["air", "-c", ".air.toml"]
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./apps/api:/app
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app
          ignore:
            - tmp/
        - action: rebuild
          path: ./apps/api/go.mod

  worker:
    build:
      target: dev
    command: ["air", "-c", ".air.worker.toml"]
    volumes:
      - ./apps/api:/app
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app
          ignore:
            - tmp/
        - action: rebuild
          path: ./apps/api/go.mod

  web:
    build:
      target: dev
    command: ["bun", "run", "dev"]
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app
          ignore:
            - .nuxt/
            - .output/
            - node_modules/
        - action: rebuild
          path: ./apps/web/package.json

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  web_node_modules:
